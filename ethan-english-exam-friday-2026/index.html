r friends have books?",["Does","Do","Is"],1,"Friends = they; Do they have books?"]]},"can":{"name":"Can / can’t","emoji":"🦸","desc":"Habilidades y permisos sencillos","rule":"Can + verbo base. No agregues -s después de can. Pregunta: Can you swim? Respuesta: Yes, I can. / No, I can’t.","example":"She can swim. · She can’t fly. · Can he ride a bike?","items":[["A fish ___ swim.",["can","can’t","is"],0,"Can expresa capacidad."],["A penguin ___ fly.",["can","can’t","has"],1,"Los pingüinos no pueden volar."],["She can ___ a bike.",["rides","ride","riding"],1,"Después de can va el verbo base: ride."],["___ you play chess?",["Are","Have","Can"],2,"Pregunta sobre capacidad: Can you...?"],["Yes, I ___.",["can","am","has"],0,"A Can you...? puedes responder Yes, I can."],["Which one is correct?",["He can sings.","He can sing.","He cans sing."],1,"Can nunca cambia para he/she/it."],["Can turtles run very fast? No, they ___.",["can","can’t","are"],1,"Respuesta negativa: No, they can’t."],["My dog can ___ high.",["jump","jumps","jumping"],0,"Can + jump, sin -s."]]},"present":{"name":"Daily routines · present simple","emoji":"⏰","desc":"Hábitos, horarios y preguntas","rule":"I/You/We/They play. He/She/It plays. Preguntas: Do you play? Does she play? Negaciones: don’t / doesn’t.","example":"I read every night. · She reads every night. · Does she read?","items":[["I ___ breakfast at seven.",["has","have","having"],1,"I have breakfast, no has."],["She ___ to school every day.",["walk","walks","walking"],1,"She + walks."],["Tom ___ football on Fridays.",["play","plays","playing"],1,"Tom = he; se agrega -s."],["___ you like music?",["Do","Does","Are"],0,"Do you like music?"],["___ she study English?",["Do","Does","Is"],1,"Does she study English?"],["He doesn’t ___ TV at night.",["watches","watch","watching"],1,"Después de doesn’t, verbo base."],["We ___ our homework after school.",["do","does","doing"],0,"We do our homework."],["My sister ___ her teeth every morning.",["brush","brushes","brushing"],1,"Brush termina en -sh: brushes."],["They ___ breakfast at eight.",["eats","eat","eating"],1,"They + eat."],["Choose the correct question.",["Does he likes apples?","Does he like apples?","Do he like apples?"],1,"Con does usa verbo base like."]]},"place":{"name":"There is / are · prepositions","emoji":"🏠","desc":"Habitaciones y ubicación de objetos","rule":"There is + una cosa. There are + varias cosas. in=dentro, on=encima, under=debajo, next to=al lado, behind=detrás.","example":"There is a ball under the table. · There are two books on the desk.","items":[["There ___ a cat on the sofa.",["is","are","am"],0,"A cat es singular: there is."],["There ___ three windows.",["is","are","has"],1,"Three windows es plural: there are."],["The ball is ___ the box. (dentro)",["under","in","behind"],1,"In significa dentro de."],["The book is ___ the table. (encima)",["on","under","next to"],0,"On significa sobre una superficie."],["The shoes are ___ the bed. (debajo)",["in","on","under"],2,"Under significa debajo de."],["The school is ___ to the park. (al lado)",["next","behind","in"],0,"Next to = al lado de."],["___ there any apples?",["Is","Are","Am"],1,"Are there any apples? es plural."],["Is there a library? Yes, there ___.",["is","are","have"],0,"A Is there...? responde Yes, there is."],["There ___ two dogs in the garden.",["is","are","am"],1,"Two dogs = plural."]]},"questions":{"name":"Question words","emoji":"🔎","desc":"Who, what, where, when, why, how","rule":"Who=quién · What=qué · Where=dónde · When=cuándo · Why=por qué · How=cómo · What time=a qué hora.","example":"Where is your school? · When is your birthday? · Why are you happy?","items":[["___ is your name?",["What","Where","When"],0,"What pregunta por el nombre."],["___ do you live?",["Who","Where","Why"],1,"Where pregunta por un lugar."],["___ is your birthday?",["When","What","How"],0,"When pregunta por una fecha."],["___ is your best friend?",["Who","When","Why"],0,"Who pregunta por una persona."],["___ are you sad? Because my toy is broken.",["Where","Why","What"],1,"Why pregunta por la razón; because introduce la respuesta."],["___ old are you?",["Where","How","What"],1,"How old...? pregunta la edad."],["___ time do you wake up?",["What","Who","How"],0,"What time...? pregunta la hora."],["___ is the book? On the chair.",["When","Where","Why"],1,"On the chair es un lugar; usa Where."]]},"vocab":{"name":"Vocabulary adventure","emoji":"🧩","desc":"School, family, food, animals and places","rule":"Relaciona palabras con imágenes, crea oraciones cortas y repite en voz alta.","example":"pencil = lápiz · library = biblioteca · cousin = primo/a","items":[["Where do you borrow books?",["library","hospital","kitchen"],0,"En la library se piden libros prestados."],["Which word means “sobrino”?",["uncle","nephew","cousin"],1,"Nephew es sobrino."],["Which one is a vegetable?",["carrot","apple","banana"],0,"Carrot es zanahoria."],["Which animal has a long neck?",["frog","giraffe","ant"],1,"La giraffe tiene cuello largo."],["Where do you cook?",["bedroom","kitchen","bathroom"],1,"Kitchen = cocina."],["What do you use to erase?",["eraser","ruler","scissors"],0,"Eraser = goma de borrar."],["Which one is a body part?",["knee","table","window"],0,"Knee = rodilla."],["Which word means “nublado”?",["cloudy","sunny","windy"],0,"Cloudy = nublado."],["The opposite of “big” is...",["small","tall","long"],0,"Big ↔ small."],["Which food is a fruit?",["bread","grapes","rice"],1,"Grapes = uvas."]]},"reading":{"name":"Reading detective","emoji":"📖","desc":"Comprende un texto y encuentra pistas","rule":"Lee primero todo el texto. Después subraya mentalmente nombres, días, acciones y lugares.","example":"Read → Find evidence → Answer.","passage":"Hello! My name is Mia and I am ten. I live near a park with my mum, my dad and my little brother, Ben. I usually walk to school at eight o’clock. On Tuesdays, I have English and science. I love English because I can read stories about animals. After school, Ben and I play in the garden. Ben can ride a bike, but he can’t swim yet. We have a brown dog called Coco. Coco sleeps under the kitchen table. On Fridays, my family visits Grandma. She makes delicious vegetable soup.","items":[["How old is Mia?",["eight","ten","twelve"],1,"The passage says: I am ten."],["Who is Ben?",["Mia’s brother","Mia’s dog","Mia’s teacher"],0,"The text says my little brother, Ben."],["What time does Mia walk to school?",["at seven","at eight","at nine"],1,"At eight o’clock."],["What does Mia study on Tuesdays?",["English and science","art and music","maths and PE"],0,"The text says English and science."],["Why does she love English?",["She can read animal stories.","She likes running.","She has a dog."],0,"Because I can read stories about animals."],["What can’t Ben do yet?",["ride a bike","swim","play"],1,"He can’t swim yet."],["Where does Coco sleep?",["under the kitchen table","on the sofa","in the garden"],0,"Coco sleeps under the kitchen table."],["When does the family visit Grandma?",["Mondays","Fridays","Tuesdays"],1,"On Fridays."]]},"listening":{"name":"Listening lab","emoji":"🎧","desc":"Escucha y reconoce información clave","rule":"Toca Reproducir. Escucha una o dos veces. No necesitas entender cada palabra; busca la idea y los datos importantes.","example":"Listen → Choose → Explain.","items":[["Listen and choose the animal.",["cat","dog","bird"],1,"La frase menciona un dog.","I have a small brown dog."],["What time does the speaker get up?",["seven","eight","nine"],0,"Seven o’clock.","I get up at seven o’clock every morning."],["Where is the pencil?",["under the desk","on the desk","in the bag"],2,"In my school bag.","My pencil is in my school bag."],["What can she do?",["swim","dance","fly"],1,"She says she can dance.","I can dance, but I cannot swim."],["What does he eat for breakfast?",["rice","eggs","pizza"],1,"Eggs for breakfast.","My brother eats eggs for breakfast."],["How many books are there?",["two","three", ))}</div></section></div>`};

const games=()=>`<div class="sectionhead"><div><span class="tag">Zona interactiva</span><h2>Aprender jugando</h2><p>Estos retos entrenan vocabulario, gramática y comprensión.</p></div></div><div class="grid games"><article class="tile card"><div class="big">🃏</div><h3>Memory Match</h3><p>Voltea tarjetas y encuentra parejas inglés ↔ español.</p>${btn('memory','Jugar memorama')}</article><article class="tile card"><div class="big">🧱</div><h3>Sentence Builder</h3><p>Ordena palabras para crear oraciones correctas.</p>${btn('builder','Construir oraciones')}</article><article class="tile card"><div class="big">🔍</div><h3>Picture Hunt</h3><p>Observa la habitación y encuentra objetos.</p>${btn('picture','Buscar objetos')}</article><article class="tile card"><div class="big">⚡</div><h3>Lightning Quiz</h3><p>10 preguntas mezcladas, sin cronómetro ni presión.</p>${btn('quick','Reto relámpago')}</article></div>`;

const normalize=w=>w.toLowerCase().replace(/\s+([.?])/g,'$1').trim();
const builder=()=>{let b=ui.build,ans=builderSentences[b.idx],now=b.chosen.map(x=>b.order[x].w).join(' ').replace(/\s+([.?])/g,'$1');return `<div class="main"><button class="back" data-a="games">← Juegos</button><div class="card gamebox"><h2>🧱 Sentence Builder</h2><p class="sub">Haz clic en cada palabra en el orden correcto. Oración ${b.idx+1} de ${builderSentences.length}.</p><div class="progress"><span style="width:${(b.idx/builderSentences.length)*100}%"></span></div><p><b>Pistas:</b> Empieza con mayúscula y termina con punto o signo de pregunta.</p><div class="answerbox" aria-live="polite">${b.chosen.length?b.chosen.map((x,j)=>`<button class="wordtile" data-a="unword:${j}">${safe(b.order[x].w)}</button>`).join(''):'<span class="sub">Tu oración aparecerá aquí…</span>'}</div><div class="tiles">${b.order.map((x,i)=>`<button class="wordtile" data-a="word:${i}" ${b.chosen.includes(i)?'disabled':''}>${safe(x.w)}</button>`).join('')}</div>${b.checked?`<div class="explain ${b.wrong?'try':''}"><b>${b.wrong?'🔁 Reordena y vuelve a intentar.':'✅ Great sentence!'}</b><p>Modelo: ${safe(ans.join(' ').replace(/\s+([.?])/g,'$1'))}</p></div>`:''}<div class="controls">${btn('clearBuilder','Limpiar','button secondary small')}${btn('checkBuilder','Comprobar')}${b.checked&&!b.wrong?btn('nextBuilder','Siguiente →'):''}</div></div></div>`};

function makeExam(){const levels={be:3,have:3,can:2,present:4,place:3,questions:3,vocab:3,reading:4,listening:3};let arr=[];ORDER.forEach(k=>{const all=DB[k].items.map((_,i)=>({k,i}));arr.push(...mix(all).slice(0,levels[k]))});ui.examQs=mix(arr);ui.examAnswers=Array(ui.examQs.length).fill(null);ui.view='mock';ui.index=0;render()}

const mockDone=()=>{let r=ui.result,m=r?.mistakes||[];return `<div class="main"><div class="card result"><div class="medal">${r.score>=23?'🏆':r.score>=17?'🥈':'🌟'}</div><h2>¡Terminaste tu simulacro!</h2><div class="score">${r.score}/${r.total}</div><p>${r.score>=23?'Muy buen dominio en este repaso. Revisa cualquier error y descansa.':'Cada error te dice qué practicar. Sigue las recomendaciones de abajo.'}</p><div class="grade">${ORDER.map(k=>`<div><b>${safe(DB[k].name)}</b><br><strong>${r.by[k]?.yes||0}/${r.by[k]?.total||0}</strong></div>`).join('')}</div></div>${m.length?`<div class="paper"><h3>🔁 Errores que vale la pena revisar</h3>${m.map(({k,i,user})=>{let q=DB[k].items[i];return `<p><b>${safe(q[0])}</b><br><span class="tiny">Correcta: ${safe(q[1][q[2]])}. ${safe(q[3])}</span></p>`}).join('')}${btn('review','Practicar preguntas pendientes')}</div>`:''}<div class="actions">${btn('startMock','Otro simulacro')}${btn('report','Ver mi progreso','button secondary')}</div></div>`};
const report=()=>{let rec=ORDER.map(k=>({k,c:eachCount(k),n:DB[k].items.length}));return `<div class="main"><div class="sectionhead"><div><span class="tag">Tu tablero</span><h2>Mi avance de inglés</h2><p>Se guarda solamente en este navegador.</p></div></div><div class="card paper"><label for="childName"><b>Nombre o apodo (opcional)</b></label><input id="childName" maxlength="30" value="${safe(st.name)}" placeholder="Explorador" style="display:block;padding:12px 14px;margin:10px 0;border-radius:12px;border:1px solid #b8d1e6;width:100%"><div class="smallcards"><div class="smallcard"><b>⭐ Puntos</b><br><strong>${st.xp} XP</strong></div><div class="smallcard"><b>🔁 Para repasar</b><br><strong>${reviewCount()}</strong></div><div class="smallcard"><b>🏆 Último simulacro</b><br><strong>${st.mock?st.mock.score+'/'+st.mock.total:'Pendiente'}</strong></div><div class="smallcard"><b>🧠 Respuestas dominadas</b><br><strong>${mast()}</strong></div></div><div class="separator"></div>${rec.map(v=>`<div style="margin:12px 0"><b>${safe(DB[v.k].name)}</b><span class="tiny" style="float:right">${v.c}/${v.n}</span><div class="progress"><span style="width:${v.c/v.n*100}%"></span></div></div>`).join('')}<div class="actions">${btn('review','Practicar errores')}${btn('printReport','🖨️ Imprimir reporte','button secondary')}${btn('resetConfirm','Reiniciar progreso','button secondary')}</div></div><div class="paper"><h3>✍️ Mini escritura</h3><p>Escribe en inglés 5 frases sobre tu día. Incluye: I am…, I have…, I can…, I go… y My… is…</p><textarea id="writing" aria-label="Escribe cinco oraciones en inglés" placeholder="My name is...&#10;I have...&#10;I can...">${safe(ui.reflection)}</textarea><div class="notice">Lee cada oración en voz alta. Un adulto debe revisar el contenido y la ortografía; la app no califica esta escritura automáticamente.</div>${btn('writingSave','Guardar texto en esta sesión','button secondary small')}</div><div class="paper"><h3>Plan para llegar al viernes</h3><div class="board"><div><span class="circleicon">📘</span><br><b>Miércoles</b><br><span class="tiny">Diagnóstico + 3 misiones débiles</span></div><div><span class="circleicon">🎮</span><br><b>Jueves</b><br><span class="tiny">Resto de misiones + juegos + simulacro</span></div><div><span class="circleicon">☀️</span><br><b>Viernes</b><br><span class="tiny">10 minutos de repaso fácil; sin estudiar a presión</span></div></div></div></div>`};
const diagnostic=()=>{let order=['be','have','can','present','place','questions','vocab','reading','listening'];ui.quick={qs:order.map(k=>({k,i:Math.floor(Math.random()*DB[k].items.length)})),idx:0,answer:null,score:0};ui.view='diagnostic';render()};
const diag=()=>{const q=ui.quick;if(q.idx>=q.qs.length)return `<div class="main"><div class="card result"><div class="medal">🧭</div><h2>¡Diagnóstico terminado!</h2><div class="score">${q.score}/9</div><p>Esto orienta la práctica, pero no predice la nota del examen. Elige ahora una misión.</p><div class="actions" style="justify-content:center">${btn('topics','Ir a las misiones')}${btn('review','Practicar errores','button secondary')}</div></div></div>`;let {k,i}=q.qs[q.idx],row=DB[k].items[i];return `<div class="main"><button class="back" data-a="home">← Inicio</button><div class="card quiz"><div class="qmeta">Diagnóstico ${q.idx+1}/9 · ${safe(DB[k].name)}</div><h2>${k==='listening'?'Listen and choose.':safe(row[0])}</h2>${k==='reading'?`<div class="story" lang="en">${safe(DB.reading.passage)}</div>`:''}${k==='listening'?btn('speakQuick','🔊 Escuchar','button secondary small'):''}<div class="options">${row[1].map((v,j)=>`<button class="option ${q.answer===j?(j===row[2]?'right':'wrong'):''}" data-a="quickAnswer:${j}" ${q.answer!==null?'disabled':''}><span class="letter">${String.fromCharCode(65+j)}</span>${safe(v)}</button>`).join('')}</div>${q.answer!==null?`<div class="explain ${q.answer===row[2]?'':'try'}"><b>${q.answer===row[2]?'✅ Correcto':'💡 Seguimos aprendiendo'}</b><p>${safe(row[3])}</p></div>${btn('quickNext','Siguiente →')}`:''}</div></div>`};
function speak(msg){if(!('speechSynthesis' in window)){alert('Este navegador no tiene voz integrada. Prueba Chrome o toca “Ver texto” en la lección.');return}try{speechSynthesis.cancel();const s=new SpeechSynthesisUtterance(msg);s.lang='en-US';s.rate=.78;s.pitch=1.03;speechSynthesis.speak(s)}catch(e){alert('No pudimos reproducir audio en este navegador. Usa el texto de apoyo.')}}
function render(){let body='';switch(ui.view){case'home':body=home();break;case'topics':body=topics();break;case'lesson':body=lesson();break;case'lessonDone':body=lessonDone();break;case'games':body=games();break;case'memory':body=memory();break;case'builder':body=builder();break;case'picture':body=picture();break;case'quick':body=quick();break;case'diagnostic':body=diag();break;case'mockIntro':body=mockIntro();break;case'mock':body=mock();break;case'mockDone':body=mockDone();break;case'report':body=report();break;default:body=home()}$('#app').innerHTML=head()+`<main>${body}</main>`;window.scrollTo({top:0,behavior:'instant'})}
function advanceBuilder(){let b=ui.build;b.idx++;if(b.idx>=builderSentences.length){st.games.builder=true;st.xp+=25;save();ui.view='games';render();alert('¡Excelente! Completaste el taller de oraciones. ⭐ +25 XP');return}b.order=mix(builderSentences[b.idx].map((w,i)=>({w,i})));b.chosen=[];b.checked=false;b.wrong=false;render()}
function chooseAction(action){const [name,raw]=action.split(':');const arg=raw===undefined?undefined:raw;
 if(name==='home'||name==='topics'||name==='games'||name==='mockIntro'||name==='report'){ui.view=name;render();return}
 if(name==='lesson'){startLesson(arg);return}
 if(name==='answer'){if(ui.view!=='lesson'||ui.chosen!==null)return;ui.chosen=Number(arg);const q=current(),id=qId(),ok=ui.chosen===q[2];let prior=st.records[id];if(ok){st.records[id]={correct:true};delete st.review[id];if(!prior?.correct)st.xp+=10}else{st.review[id]=true;st.records[id]={correct:false};st.xp+=1}save();render();return}
 if(name==='nextLesson'){if(ui.chosen===null)return;if(ui.index+1>=ui.ids.length){finishLesson();return}ui.index++;ui.chosen=null;ui.hint=false;ui.transcript=false;render();return}
 if(name==='hint'){ui.hint=!ui.hint;render();return}
 if(name==='say'){speak(current()[4]||current()[0]);return}
 if(name==='transcript'){ui.transcript=!ui.transcript;render();return}
 if(name==='review'){const keys=Object.keys(st.review);if(keys.length){let chosen=keys[0].split(':');let k=chosen[0];let ids=keys.filter(x=>x.startsWith(k+':')).map(x=>Number(x.split(':')[1]));startLesson(k,ids)}else{alert('¡Todavía no hay errores guardados! Puedes hacer una nueva misión.');ui.view='topics';render()}return}
 if(name==='diagnostic'){diagnostic();return}
 if(name==='memory'){startMemory();return}
 if(name==='flip'){let m=ui.mem,i=Number(arg);if(!m||m.matched.includes(m.cards[i].pair)||m.open.includes(i)||m.open.length>=2)return;m.open.push(i);if(m.open.length===2){m.moves++;let [a,b]=m.open;if(m.cards[a].pair===m.cards[b].pair){m.matched.push(m.cards[a].pair);m.open=[];if(m.matched.length===6){st.games.memory=true;st.xp+=20;save()}}else{render();setTimeout(()=>{if(ui.view==='memory'&&ui.mem===m){m.open=[];render()}},920);return}}render();return}
 if(name==='builder'){startBuilder();return}
 if(name==='word'){let b=ui.build,i=Number(arg);if(!b.chosen.includes(i)){b.chosen.push(i);b.checked=false;render()}return}
 if(name==='unword'){ui.build.chosen.splice(Number(arg),1);ui.build.checked=false;render();return}
 if(name==='clearBuilder'){ui.build.chosen=[];ui.build.checked=false;render();return}
 if(name==='checkBuilder'){let b=ui.build;let a=b.chosen.map(i=>b.order[i].w).join(' ');let good=builderSentences[b.idx].join(' ');b.checked=true;b.wrong=normalize(a)!==normalize(good);if(!b.wrong&&b.idx===builderSentences.length-1)st.games.builder=true;render();return}
 if(name==='nextBuilder'){if(ui.build.checked&&!ui.build.wrong)advanceBuilder();return}
 if(name==='picture'){startPicture();return}
 if(name==='scene'){let g=ui.scene;if(g.answer!==null)return;g.answer=arg;if(g.answer===targets[g.idx].answer){st.xp+=5;save()}render();return}
 if(name==='nextScene'){let g=ui.scene;g.idx++;if(g.idx>=targets.length){st.games.picture=true;st.xp+=10;save();ui.view='games';render();alert('🎉 ¡Completaste Picture Hunt!');return}g.answer=null;render();return}
 if(name==='quick'){startQuick();return}
 if(name==='speakQuick'){let {k,i}=ui.quick.qs[ui.quick.idx];speak(DB[k].items[i][4]||DB[k].items[i][0]);return}
 if(name==='quickAnswer'){let g=ui.quick;if(g.answer!==null)return;g.answer=Number(arg);let {k,i}=g.qs[g.idx],q=DB[k].items[i];if(g.answer===q[2]){g.score++;st.xp+=4}else{st.review[k+':'+i]=true}save();render();return}
 if(name==='quickNext'){let g=ui.quick;g.idx++;g.answer=null;if(g.idx===g.qs.length&&ui.view==='quick')st.games.quick=true;save();render();return}
 if(name==='startMock'){makeExam();return}
 if(name==='examAnswer'){ui.examAnswers[ui.index]=Number(arg);render();return}
 if(name==='sayMock'){let {k,i}=ui.examQs[ui.index],q=DB[k].items[i];speak(q[4]||q[0]);return}
 if(name==='mockBack'){ui.index=Math.max(0,ui.index-1);render();return}
 if(name==='mockNext'){if(ui.examAnswers[ui.index]===null){alert('Elige una respuesta antes de continuar.');return}if(ui.index===ui.examQs.length-1){finishMock()}else{ui.index++;render()}return}
 if(name==='printReport'){window.print();return}
 if(name==='writingSave'){ui.reflection=$('#writing')?.value||'';alert('Texto guardado durante esta sesión. No se envía a ningún servidor.');return}
 if(name==='resetConfirm'){if(confirm('¿Seguro que deseas borrar el avance en este dispositivo?')){localStorage.removeItem(KEY);st=getState();ui.view='home';render()}return}
}
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-a]');if(e){chooseAction(e.dataset.a)}});
document.addEventListener('input',ev=>{if(ev.target.id==='childName'){st.name=ev.target.value.slice(0,30);save()}if(ev.target.id==='writing'){ui.reflection=ev.target.value}});
render();
</script></body></html>
