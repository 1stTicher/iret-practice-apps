nest", "sociable", "cheerful"], 0, "Tells the truth."], ["She always helps new coworkers. She's ___.", ["helpful", "selfish", "serious"], 0, "Willing to help."], ["He wasn't afraid of the big dog. He was ___.", ["brave", "easygoing", "selfish"], 0, "No fear."], ["She smiles all day. She's ___.", ["cheerful", "serious", "selfish"], 0, "Happy and positive."]]}, {"title": "Life & Family", "cards": [["be into", "Be very interested in something.", "I'm really into music. I listen every night."], ["celebrate", "Do something fun for a special day.", "We celebrated my daughter's birthday at a restaurant."], ["live with family", "Share your home with relatives.", "I live with my family."], ["live alone", "Live without other people.", "My cousin lives alone downtown."], ["retire", "Stop working because of age.", "My parents retired last year."], ["be born", "Start life.", "I was born in Córdoba."], ["be raised", "Be looked after as a child until adult.", "I was raised by my grandparents."], ["be married", "Have a husband or wife.", "My sister has been married for three years."], ["be single", "Not be married.", "My cousin is single."]]}, {"title": "Information Questions", "hint": "question word + auxiliary + subject + verb.", "qs": [["___ are you like at work?", ["What", "How", "Which"], 0, "What... like? asks about character."], ["___ word describes you best: serious or easygoing?", ["Which", "What", "Whose"], 0, "Which = a choice."], ["___ personality is most like yours in your family?", ["Whose", "Who", "Which"], 0, "Whose = possession."], ["How ___ your best friend describe you?", ["would", "does", "is"], 0, "How would + subject + verb."], ["Which is correct?", ["What are you like with your family?", "What you are like with your family?", "What you like with your family?"], 0, "Auxiliary before the subject."], ["___ are you most sociable — mornings or evenings?", ["When", "Whose", "What"], 0, "Time → when."]]}, {"title": "Indirect Questions", "hint": "Polite questions keep statement word order.", "qs": [["Are you married? → Can you tell me ___?", ["if you're married", "are you married", "if are you married"], 0, "if + statement order."], ["Where were you born? → Do you know where ___?", ["she was born", "was she born", "she born"], 0, "Statement order: subject + verb."], ["How often do you visit your parents? → Could you tell me ___?", ["how often you visit your parents", "how often do you visit your parents", "how often visit you your parents"], 0, "No 'do' in indirect questions."], ["Why does he want to advance at work? → I wonder ___.", ["why he wants to advance at work", "why does he want to advance", "why he want to advance"], 0, "Subject + verb with -s."], ["Which is correct?", ["Do you know if she lives alone?", "Do you know if does she live alone?", "Do you know she if lives alone?"], 0, "if + subject + verb."], ["What apps do you use for work? → Could you tell me ___?", ["what apps you use for work", "what apps do you use for work", "what you apps use"], 0, "Statement order."]]}, {"title": "Introductions", "qs": [["Introducing a friend:", ["This is Nina, Jodi's coworker.", "He is Nina.", "Here Nina."], 0, "This is + name."], ["Asking about a connection:", ["How do you know Jodi?", "How you know Jodi?", "What you know Jodi?"], 0, "How do you know...?"], ["Answer: \"How do you know Ana?\"", ["I work with her.", "I work her.", "She work with me."], 0, "I work with her."], ["Checking if two people have met:", ["Have you two met before?", "Did you two meet before yet?", "You met before?"], 0, "Have you two met before?"], ["A natural answer when you don't know:", ["I have no idea, but let's find out.", "I not know.", "No know."], 0, "Natural reduced phrase."], ["Comparing yourself to someone:", ["We're both easygoing, but I'm single and you're married.", "We both are easygoing but I single.", "Both we easygoing."], 0, "We're both + adjective."]]}]};</script><script src="../assets/app.js"></script></body></html>
