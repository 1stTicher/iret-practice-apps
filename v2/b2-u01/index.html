<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 1 — A Family Affair Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title": "Unit 1 — A Family Affair Practice App", "tag": "B2 FIRST · UNIT 1", "sub": "Relationship phrasal verbs, personality adjectives, present perfect & make/do", "sections": [{"title": "Phrasal Verbs", "cards": [["hang out (with)", "Spend time with someone in a relaxed way.", "I hang out with my cousins every weekend."], ["count on", "Rely on someone.", "I know I can always count on my sister."], ["fall out (with)", "Argue and stop being friendly.", "He fell out with his best friend over a girl."], ["make up", "Become friends again after an argument.", "They argued, but they made up the next day."], ["take after", "Look or behave like an older family member.", "You take after your mother — you're both so kind."], ["look up to", "Admire and respect.", "I've always looked up to my older brother."], ["look down on", "Think someone is less important than you.", "Don't look down on people with less money."], ["let someone down", "Disappoint someone.", "I promised to help, and I won't let you down."], ["stick together", "Stay united and support each other.", "Our family always sticks together in hard times."], ["hit it off", "Become friends immediately.", "We hit it off the first time we met."], ["turn up", "Arrive, often unexpectedly.", "He didn't turn up to the party."], ["go off", "Stop liking something / make a sudden noise.", "I've gone off fast food. / The alarm went off at 6."]]}, {"title": "Phrasal Verb Quiz", "qs": [["My parents always support me. I can ___ them.", ["count on", "look down on", "fall out with"], 0, "count on = rely on."], ["We ___ immediately and talked for hours.", ["hit it off", "let down", "turned into"], 0, "hit it off = connect immediately."], ["She ___ her father: same eyes, same sense of humour.", ["takes after", "looks up to", "hangs out"], 0, "take after = resemble a parent."], ["I was so sorry I ___ my team ___ in the final.", ["let / down", "made / up", "turned / up"], 0, "let someone down = disappoint."], ["They had a big argument but ___ before the wedding.", ["made up", "went off", "carried on"], 0, "make up = reconcile."], ["I used to love pizza, but I've ___ it.", ["gone off", "counted on", "hit it off"], 0, "go off = stop liking."], ["Please ___ — don't stop because of me.", ["carry on", "fall out", "turn up"], 0, "carry on = continue."], ["Kids often ___ older siblings.", ["look up to", "look down on", "let down"], 0, "look up to = admire."], ["The caterpillar ___ a butterfly.", ["turned into", "took after", "counted on"], 0, "turn into = become."]]}, {"title": "Personality Adjectives", "hint": "Choose the correct opposite.", "qs": [["considerate →", ["inconsiderate", "unconsiderate", "disconsiderate"], 0, "in- + considerate."], ["responsible →", ["irresponsible", "unresponsible", "inresponsible"], 0, "ir- before r."], ["mature →", ["immature", "unmature", "dismature"], 0, "im- before m."], ["polite →", ["impolite", "unpolite", "dispolite"], 0, "im- before p."], ["organised →", ["disorganised", "unorganised", "inorganised"], 0, "dis- + organised."], ["enthusiastic →", ["unenthusiastic", "inenthusiastic", "disenthusiastic"], 0, "un- + enthusiastic."], ["sensitive →", ["insensitive", "unsensitive", "dissensitive"], 0, "in- + sensitive."], ["honest →", ["dishonest", "unhonest", "inhonest"], 0, "dis- + honest."], ["Someone who always tells others what to do is...", ["bossy", "reserved", "considerate"], 0, "bossy."], ["Someone who doesn't share feelings easily is...", ["reserved", "bad-tempered", "bright"], 0, "reserved."], ["Someone who is often angry is...", ["bad-tempered", "wise", "mature"], 0, "bad-tempered."], ["Someone with good judgement and experience is...", ["wise", "bossy", "unreliable"], 0, "wise."]]}, {"title": "Present Perfect", "hint": "Simple = result / how many. Continuous = ongoing activity / how long.", "qs": [["I ___ eight practice tests so far.", ["'ve done", "'ve been doing", "did"], 0, "How many → present perfect simple."], ["I ___ for the First exam since September.", ["'ve been studying", "studied", "'m studying"], 0, "Ongoing since a point → continuous."], ["She's tired. She ___ all morning.", ["'s been running", "has run", "runs"], 0, "Recent continuous activity with visible result."], ["Have you ever ___ to Paris?", ["been", "gone", "go"], 0, "been = went and came back."], ["She isn't here. She's ___ to Paris.", ["gone", "been", "went"], 0, "gone = she's still there."], ["I haven't eaten out ___ months.", ["in", "since", "for ago"], 0, "In + period in negative sentences."], ["He's been doing karate ___ nine years.", ["for", "since", "in"], 0, "for + period."], ["We've lived here ___ 2015.", ["since", "for", "in"], 0, "since + point in time."], ["How long ___ English?", ["have you been studying", "are you studying", "did you study"], 0, "How long → present perfect continuous."], ["I ___ this book yet.", ["haven't finished", "haven't been finishing", "didn't finish"], 0, "Result/completion → simple."]]}, {"title": "Make or Do?", "qs": [["___ a mistake", ["make", "do"], 0, "make a mistake."], ["___ some research", ["do", "make"], 0, "do research."], ["___ a decision", ["make", "do"], 0, "make a decision."], ["___ my best", ["do", "make"], 0, "do my best."], ["___ an effort", ["make", "do"], 0, "make an effort."], ["___ the washing up", ["do", "make"], 0, "do the washing up (chores)."], ["___ the beds", ["make", "do"], 0, "make the beds (exception)."], ["___ a difference", ["make", "do"], 0, "make a difference."], ["___ some volunteer work", ["do", "make"], 0, "do work."], ["___ up my mind", ["make", "do"], 0, "make up my mind = decide."], ["___ a good impression", ["make", "do"], 0, "make an impression."], ["___ the ironing", ["do", "make"], 0, "do the ironing."]]}, {"title": "Essay Linkers", "hint": "Contrast in a Writing Part 1 essay.", "qs": [["___ my parents call me every week, I still miss them.", ["Although", "However", "Whereas"], 0, "Although + clause."], ["___ the fact that we live 2,000 km apart, we talk every day.", ["Despite", "Although", "However"], 0, "Despite + noun / the fact that."], ["Adults worry about health, ___ young people worry about money.", ["whereas", "despite", "however,"], 0, "Whereas contrasts two facts in one sentence."], ["I enjoy TV. ___, I'm not keen on video games.", ["However", "Despite", "Although"], 0, "However starts a new sentence + comma."], ["Technology helps us communicate. ___, it can affect our sleep.", ["That being said", "Despite", "Whereas"], 0, "That being said = however."]]}]};</script><script src="../assets/app.js"></script></body></html>
