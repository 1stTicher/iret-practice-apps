ar park.\"", ["I saw a monument near the park.", "I saw the monument near a park.", "I saw an monument near park."], 0, "a + new thing, the + known place."], ["Fix it: \"It's upstairs on fifth floor.\"", ["It's upstairs, on the fifth floor.", "It's upstairs, on a fifth floor.", "It's upstairs on fifth the floor."], 0, "the + ordinal."]]}, {"title": "Transportation", "cards": [["arrival", "The moment you reach a place.", "My arrival was thirty minutes late."], ["departure", "The moment you leave.", "The departure time says 7:45."], ["fare", "The price you pay to travel.", "The bus fare is fifteen pesos."], ["reservation", "A booked seat or room.", "I made a reservation for the early train."], ["schedule", "A list of times.", "Check the schedule — the last bus leaves at ten."], ["direct", "Going straight, no changes.", "This is a direct flight — no stops."], ["line", "One path in a transport system.", "Take the green line downtown."], ["route", "The way from one place to another.", "The fastest route avoids the highway."], ["terminal", "Building where you get on a bus, train or plane.", "Your gate is in terminal two."], ["book", "Arrange something in advance.", "I booked my ticket online."]]}, {"title": "Words in Context", "qs": [["The bus ___ is fifteen pesos.", ["fare", "route", "terminal"], 0, "The price."], ["Check the ___ — the last bus leaves at ten.", ["schedule", "fare", "line"], 0, "List of times."], ["This is a ___ flight. No stops.", ["direct", "line", "terminal"], 0, "No changes."], ["Your gate is in ___ two.", ["terminal", "route", "fare"], 0, "The building."], ["I ___ my ticket online last night.", ["booked", "arrived", "departed"], 0, "Arranged in advance."], ["Take the red ___ to go downtown.", ["line", "fare", "arrival"], 0, "Part of the system."]]}, {"title": "Would & Should", "hint": "I would = my opinion · You should = advice. No 'to' after them.", "qs": [["You ___ take the direct line — it saves time.", ["should", "would", "shouldn't"], 0, "Advice
