-02","p":"¿Qué medida ayuda a preparar defensas ante ciertas enfermedades?","a":["vacunación","vacunacion","vacunas"],"h":"Consiste en recibir vacunas.","why":"Observa las pistas del tema y explica tu elección."},{"id":"prevencion-03","p":"¿En qué parte del brazo es mejor cubrirse al toser si no hay pañuelo?","a":["codo","antebrazo"],"h":"No uses las manos desnudas.","why":"Observa las pistas del tema y explica tu elección."},{"id":"prevencion-04","p":"¿Qué práctica renueva el aire en un salón cerrado?","a":["ventilación","ventilacion","ventilar"],"h":"Abrir ventanas para cambiar el aire.","why":"Observa las pistas del tema y explica tu elección."},{"id":"prevencion-05","p":"¿Qué tipo de agua es adecuada para beber?","a":["potable","agua potable"],"h":"Es agua segura para consumo.","why":"Observa las pistas del tema y explica tu elección."},{"id":"prevencion-06","p":"¿Qué debe evitarse compartir cuando hay riesgo de contagio?","a":["vasos","vaso"],"h":"Lo usamos para beber.","why":"Observa las pistas del tema y explica tu elección."},{"id":"prevencion-07","p":"¿Quién puede indicar un tratamiento responsable ante una enfermedad?","a":["médico","medico","personal de salud"],"h":"Es un profesional de salud.","why":"Observa las pistas del tema y explica tu elección."},{"id":"prevencion-08","p":"¿Los antibióticos curan enfermedades causadas por virus?","a":["no"],"h":"Una gripe viral no se trata con antibióticos.","why":"Observa las pistas del tema y explica tu elección."},{"id":"prevencion-09","p":"¿Qué actividad corporal regular ayuda a cuidar la salud?","a":["ejercicio","actividad física","actividad fisica"],"h":"Moverse con regularidad.","why":"Observa las pistas del tema y explica tu elección."},{"id":"prevencion-10","p":"¿Qué descanso nocturno ayuda a la salud?","a":["sueño","sueno","dormir"],"h":"Ocurre al dormir.","why":"Observa las pistas del tema y explica tu elección."},{"id":"prevencion-11","p":"¿Qué hay que eliminar para reducir criaderos de mosquitos?","a":["agua estancada","agua acumulada"],"h":"Agua que queda quieta en recipientes.","why":"Observa las pistas del tema y explica tu elección."},{"id":"prevencion-12","p":"¿Qué tipo de alimentación aporta distintos nutrientes?","a":["variada","equilibrada","balanceada"],"h":"Incluye diversos grupos de alimentos.","why":"Observa las pistas del tema y explica tu elección."}]},{"id":"virusits","title":"Virus e infecciones de transmisión sexual","short":"Microorganismos y salud","emoji":"🧫","color":"#806bc5","icon":"virus","expl":"Un virus es un agente infeccioso que necesita células para multiplicarse. Una bacteria es un organismo celular. Las ITS pueden causarlas virus, bacterias u otros microorganismos. Algunas ITS no producen síntomas; es importante hablar con personas adultas de confianza y consultar fuentes médicas. Existen vacunas contra VPH y hepatitis B.","steps":["Virus y bacterias no son iguales","Las ITS pueden tener diferentes causas","La prevención incluye información y vacunación","Los síntomas no siempre permiten reconocer una ITS"],"example":"Ejemplo: el VPH es un virus; la sífilis la causa una bacteria.","q":[{"id":"virusits-01","p":"¿Qué agente necesita células para multiplicarse?","a":["virus"],"h":"No tiene estructura celular completa.","why":"Observa las pistas del tema y explica tu elección."},{"id":"virusits-02","p":"¿Qué microorganismo posee estructura celular propia?","a":["bacteria"],"h":"No es un virus.","why":"Observa las pistas del tema y explica tu elección."},{"id":"virusits-03","p":"¿Qué siglas significan infecciones de transmisión sexual?","a":["ITS"],"h":"Son tres letras.","why":"Observa las pistas del tema y explica tu elección."},{"id":"virusits-04","p":"¿Qué significan las siglas VIH?","a":["virus de la inmunodeficiencia humana"],"h":"Es el nombre completo del virus.","why":"Observa las pistas del tema y explica tu elección."},{"id":"virusits-05","p":"¿Qué significan las siglas VPH?","a":["virus del papiloma humano"],"h":"Es el nombre completo.","why":"Observa las pistas del tema y explica tu elección."},{"id":"virusits-06","p":"¿Qué vacuna ayuda a prevenir ciertas infecciones por papilomavirus?","a":["VPH"],"h":"Tres letras.","why":"Observa las pistas del tema y explica tu elección."},{"id":"virusits-07","p":"¿Qué infección viral también tiene vacuna y afecta al hígado?","a":["hepatitis b"],"h":"Incluye la letra B.","why":"Observa las pistas del tema y explica tu elección."},{"id":"virusits-08","p":"¿Todas las ITS presentan síntomas visibles siempre?","a":["no"],"h":"Algunas no presentan síntomas.","why":"Observa las pistas del tema y explica tu elección."},{"id":"virusits-09","p":"¿Los antibióticos son tratamiento común de infecciones bacterianas?","a":["sí"],"h":"No los uses sin indicación médica.","why":"Observa las pistas del tema y explica tu elección."},{"id":"virusits-10","p":"¿La sífilis es causada por un virus o una bacteria?","a":["bacteria"],"h":"Una ITS bacteriana.","why":"Observa las pistas del tema y explica tu elección."},{"id":"virusits-11","p":"¿Qué tipo de agente causa la influenza?","a":["virus"],"h":"Su causa no es una bacteria.","why":"Observa las pistas del tema y explica tu elección."},{"id":"virusits-12","p":"¿A quién se debe consultar para resolver dudas sobre ITS?","a":["personal de salud","médico","medico","profesional de salud"],"h":"Una fuente profesional.","why":"Observa las pistas del tema y explica tu elección."}]},{"id":"anticoncepcion","title":"Métodos anticonceptivos","short":"Decisiones e información","emoji":"💬","color":"#bb6688","icon":"health","expl":"La anticoncepción reúne métodos para prevenir embarazos no planeados. Existen métodos de barrera (condón), hormonales (pastillas, implante) e intrauterinos (DIU). El condón, usado correctamente, también reduce el riesgo de ITS; los otros métodos anticonceptivos mencionados no las previenen. No se trata de elegir un método aquí, sino de reconocer información confiable.","steps":["Barrera: condón","Hormonales: pas function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){let t=String(s).toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9.,\s]/g,'').replace(/\s+/g,' ').trim();return t}
function check(v,answers){let a=norm(v);return answers.some(answer=>{let b=norm(answer);if(/^[-+]?\d+(?:[.,]\d+)?$/.test(a)&&/^[-+]?\d+(?:[.,]\d+)?$/.test(b))return Math.abs(Number(a.replace(',','.'))-Number(b.replace(',','.')))<1e-8;return a===b})}
function minutes(n){let m=Math.floor(n/60),s=n%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function count(){return MODULES.reduce((s,m)=>s+st.done[m.id],0)}
function tap(){lastActivity=Date.now()}
document.addEventListener('pointerdown',tap,{passive:true});document.addEventListener('keydown',tap,{passive:true});
setInterval(()=>{if(!document.hidden&&(screen==='question'||screen==='lesson'||screen==='review')&&Date.now()-lastActivity<50000){st.secs++;if(st.secs%5===0)save();updateHeader();if(st.secs%60===0&&screen==='home')render()}},1000);
function updateHeader(){document.getElementById('headscore').textContent=count()+' / '+ALL.length;document.getElementById('headtime').textContent='⏱ '+minutes(st.secs)}
function pct(v,max){return Math.round(100*v/max)}
function initSvg(k){
const a=(l1,l2,l3,labels)=>`<svg viewBox="0 0 580 180" role="img" aria-label="Diagrama sobre ${esc(k)}"><rect x="2" y="2" rx="19" width="576" height="176" fill="#ecf8f5"/><circle cx="103" cy="84" r="49" fill="#bce7e8"/><circle cx="287" cy="84" r="49" fill="#ceeede"/><circle cx="468" cy="84" r="49" fill="#ffe4aa"/><g stroke="#1696a2" stroke-width="4" fill="none"><path d="M156 84h74m-10-8 10 8-10 8M341 84h70m-10-8 10 8-10 8"/></g><g fill="#17364b" font-family="system-ui" font-weight="850" text-anchor="middle" font-size="18"><text x="103" y="89">${l1}</text><text x="287" y="89">${l2}</text><text x="468" y="89">${l3}</text></g><text x="290" y="160" fill="#476975" font-family="system-ui" font-size="14" text-anchor="middle">${labels}</text></svg>`;
switch(k){
case 'immune':return a('PIEL','CÉLULAS','MEMORIA','Primera barrera → respuesta → memoria');
case 'prevention':return a('HIGIENE','VACUNAS','SALUD','Hábitos de protección que se suman');
case 'virus':return a('VIRUS','CÉLULA','RESPUESTA','Los virus necesitan células para multiplicarse');
case 'health':return a('BARRERA','HORMONAL','DIU','Conocer métodos permite tomar decisiones informadas');
case 'eco':return a('SOL','PLANTA','ABEJA','La vida se sostiene en relaciones');
case 'mexico':return a('MÉXICO','AJOLOTE','CUIDAR','Endemismo y conservación de hábitats');
case 'water':return a('AGUA','SEGURA','DERECHO','Segura · Accesible · Asequible');
case 'network':return a('FLORES','ABEJAS','FRUTOS','Las especies dependen unas de otras');
case 'problems':return a('DATOS','PLAN','REVISIÓN','Un problema tiene pasos');
case 'decimal':return `<svg viewBox="0 0 580 180" role="img" aria-label="Suma de números decimales alineada"><rect width="580" height="180" rx="20" fill="#eaf8f7"/><text x="130" y="38" font-size="16" font-weight="800" fill="#1e5e6b">ALINEA DECIMALES</text><text x="210" y="85" font-size="32" fill="#17364b" font-family="monospace">12.50</text><text x="165" y="121" font-size="32" fill="#17364b" font-family="monospace">+  3.75</text><path d="M156 128H359" stroke="#24899b" stroke-width="3"/><text x="210" y="162" font-size="32" fill="#17364b" font-family="monospace">16.25</text><path d="M286 54V173" stroke="#ec9a58" stroke-dasharray="5 5" stroke-width="2"/></svg>`;
case 'roman':return `<svg viewBox="0 0 580 180" role="img" aria-label="Tabla de números romanos"><rect width="580" height="180" rx="20" fill="#eaf8f7"/>${[['I','1'],['V','5'],['X','10'],['L','50'],['C','100'],['D','500'],['M','1000']].map((v,i)=>`<rect x="${11+i*80}" y="38" width="72" height="100" rx="12" fill="${i%2?'#fff3d4':'#d4e9f1'}"/><text x="${47+i*80}" y="82" text-anchor="middle" fill="#163749" font-size="28" font-weight="900">${v[0]}</text><text x="${47+i*80}" y="119" text-anchor="middle" fill="#163749" font-size="15">${v[1]}</text>`).join('')}</svg>`;
}return a('LEER','PENSAR','EXPLICAR','Aprende paso a paso')}
function header(){updateHeader()}
function render(){header();if(screen==='home')return home();if(screen==='lesson')return lesson();if(screen==='question')return question();if(screen==='review')return review();if(screen==='report')return report()}
function home(){let done=count(),w=st.secs>=1800&&done===ALL.length;
 document.getElementById('app').innerHTML=`<section class="card hero"><div><div class="eyebrow">✦ 6.º de primaria · Noviembre 2026</div><h1>Tu libreta es una <span class="highlight">aventura.</span></h1><p>11 estaciones, 132 retos escritos y un objetivo: que Ethan aprenda de verdad. <b>Solo desbloqueas la siguiente pregunta después de escribir la respuesta correcta.</b></p><div class="actions"><button class="btn" data-act="resume">▶ Continuar mi aventura</button><button class="btn secondary" data-act="report">📊 Mi avance</button></div></div><div class="hero-art">${mascot()}</div></section><div class="statline"><div class="card stat"><b>${done}/132</b><span>Retos correctos</span></div><div class="card stat"><b>${MODULES.filter(m=>st.done[m.id]===12).length}/11</b><span>Estaciones terminadas</span></div><div class="card stat"><b>${minutes(st.secs)}</b><span>Práctica activa (meta 30:00)</span></div></div><div class="sectionhead"><div><h2>Elige tu estación</h2><p>Cada pregunta se resuelve escribiendo; no hay opciones para adivinar.</p></div></div><div class="grid">${MODULES.map((m,i)=>`<button class="tile" data-act="open" data-id="${m.id}" style="border-top:5px solid ${m.color}"><span class="emoji">${m.emoji}</span><strong>${i+1}. ${esc(m.short)}</strong><small>${esc(m.title)}</small><div class="bar"><span style="width:${pct(st.done[m.id],12)}%;background:${m.color}"></span></div><span class="count">${st.done[m.id]===12?'✓ Estación superada':st.done[m.id]+' de 12 retos'} </span></button>`).join('')}</div><div class="notice"><b>🔎 Fuente real:</b> foto de la libreta de Ethan. La app amplía esos temas con explicaciones verificadas. No conocemos las preguntas exactas ni el orden de exámenes.<p>🕒 Para la medalla final hacen falta los 132 aciertos y 30 minutos de actividad real: el reloj se pausa si dejas de interactuar.</p></div>${w?'<div class="finishbox"><h2>🏆 ¡Misión completada!</h2><p>Superaste todas las estaciones y el tiempo mínimo.</p><button class="btn" data-act="report">Ver diploma e informe</button></div>':''}`}
function mascot(){return `<svg viewBox="0 0 370 305" aria-hidden="true"><ellipse cx="185" cy="278" rx="137" ry="15" fill="#b3d7d2" opacity=".45"/><path d="M135 57Q100 3 184 18Q265 5 240 57" fill="#cfe6ef" stroke="#176b7c" stroke-width="6"/><rect x="82" y="61" width="206" height="189" rx="51" fill="#61bfd0" stroke="#1c738a" stroke-width="7"/><rect x="107" y="86" width="156" height="110" rx="30" fill="#f9fdfa"/><circle cx="151" cy="141" r="13" fill="#184254"/><circle cx="221" cy="141" r="13" fill="#184254"/><path d="M159 168Q187 186 212 168" fill="none" stroke="#184254" stroke-width="7" stroke-linecap="round"/><circle cx="113" cy="207" r="20" fill="#ffdd7f"/><circle cx="257" cy="207" r="20" fill="#ffdd7f"/><rect x="115" y="237" width="40" height="38" rx="15" fill="#3d95ab"/><rect x="216" y="237" width="40" height="38" rx="15" fill="#3d95ab"/><path d="M184 17V1" stroke="#176b7c" stroke-width="7"/><circle cx="184" cy="5" r="10" fill="#ffc45b"/><path d="M70 127q-49 11-43 64M301 127q49 11 43 64" stroke="#1c738a" stroke-width="19" stroke-linecap="round" fill="none"/><text x="185" y="233" text-anchor="middle" fill="#fff" font-weight="900" font-size="20">LUMI</text><g fill="#f5ba4c"><path d="M45 30l4 13 14 4-14 4-4 13-4-13-14-4 14-4z"/><path d="M313 51l3 10 11 3-11 3-3 10-3-10-11-3 11-3z"/></g></svg>`}
function openTopic(id){topic=MODULES.find(m=>m.id===id);if(!topic)return;screen=st.done[id]===12?'lesson':'lesson';justSolved=null;render();window.scrollTo(0,0)}
function lesson(){let m=topic;document.getElementById('app').innerHTML=`<div class="workspace"><button class="linkback" data-act="home">← Volver a las estaciones</button><div class="card lesson"><div class="eyebrow">ESTACIÓN ${MODULES.indexOf(m)+1} / 11</div><div class="heading"><span class="emoji">${m.emoji}</span><h2>${esc(m.title)}</h2></div><p>${esc(m.expl)}</p><div class="illustration">${initSvg(m.icon)}</div><h3>Cuatro ideas para recordar</h3><div class="steps">${m.steps.map((s,i)=>`<div class="step"><strong>${i+1}.</strong> ${esc(s)}</div>`).join('')}</div><div class="example"><b>🔎 Ejemplo:</b> ${esc(m.example)}</div><div class="actions"><button class="btn" data-act="begin">${st.done[m.id]===12?'🔁 Repasar preguntas':'✍️ Empezar retos ('+(st.done[m.id]+1)+'/12)'}</button><button class="btn secondary" data-act="home">Elegir otra estación</button></div></div></div>`}
function qvisual(m,index){let icon=m.icon;if(icon==='decimal'||icon==='roman')return `<div class="qvisual">${initSvg(icon)}</div>`;
if(icon==='immune'||icon==='virus'||icon==='eco'||icon==='mexico'||icon==='water'||icon==='network')return `<div class="qvisual"><strong>OBSERVA Y RELACIONA</strong><div class="illustration" style="margin:9px 0 0;min-height:auto;padding:4px">${initSvg(icon)}</div></div>`;
return `<div class="qvisual"><strong>${['🧠 PISTA VISUAL','🔍 BUSCA LA RELACIÓN','🛠️ USA LOS CONCEPTOS'][index%3]}</strong><p style="margin:6px 0 0">${esc(m.steps[index%4])}</p></div>`}
function question(){let m=topic;let countHere=st.done[m.id];if(countHere===12&&!justSolved){return winModule()};let idx=justSolved?justSolved.idx:countHere;let q=m.q[idx];if(!q)return winModule();
let attempts=st.mistakes[q.id]||0;document.getElementById('app').innerHTML=`<div class="workspace"><button class="linkback" data-act="lesson">← Volver a la explicación</button><div class="progress-top"><div style="display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:14px"><span>${esc(m.short)}</span><span>${Math.min(countHere+(justSolved?0:1),12)} de 12</span></div><div class="bar"><span style="width:${pct(countHere,12)}%;background:${m.color}"></span></div></div><div class="card question"><div class="qnum">RETO ${idx+1} · RESPUESTA ESCRITA</div><div class="qtext">${esc(q.p)}</div>${qvisual(m,idx)}<label for="answerfield" style="display:block;font-weight:800;margin-bottom:9px">Tu respuesta:</label><input id="answerfield" class="answer" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Escribe aquí la respuesta" ${justSolved?'disabled':''} aria-describedby="message"><div class="metacard">Se aceptan acentos opcionales y distintas formas equivalentes previstas.</div><div id="message" aria-live="polite">${justSolved?`<div class="feedback good"><strong>✓ ¡Respuesta correcta!</strong><p>${esc(q.a[0])}. ${esc(q.h)}</p></div>`:(attempts?`<div class="feedback"><strong>Inténtalo otra vez</strong><p>${attempts>=3?'Respuesta que debes escribir: '+esc(q.a[0]):'Pista: '+esc(q.h)}</p></div>`:'')}</div><div class="btnrow">${justSolved?`<button class="btn" data-act="next">${countHere===12?'Celebrar estación':'Siguiente reto →'}</button>`:`<button class="btn" data-act="check">Comprobar respuesta</button><button class="btn soft" data-act="hint">💡 Ver pista</button>`}<button class="btn secondary" data-act="home">Guardar y salir</button></div></div><p class="coach">💚 Aprender no es castigo. Puedes equivocarte, leer la pista y volver a intentarlo. El avance se guarda en este dispositivo.</p></div>`;
if(!justSolved){const input=document.getElementById('answerfield');setTimeout(()=>{if(screen==='question'&&input)input.focus({preventScroll:true})},20)}}
function checkAnswer(){if(screen!=='question'||justSolved)return;let m=topic,idx=st.done[m.id],q=m.q[idx];let input=document.getElementById('answerfield');if(!input)return;let val=input.value.trim();if(!val){input.focus();return}if(check(val,q.a)){justSolved={idx};st.done[m.id]=idx+1;save();question()}else{st.mistakes[q.id]=(st.mistakes[q.id]||0)+1;save();question();let i=document.getElementById('answerfield');i.value=val;i.focus();i.select()}}
function winModule(){let m=topic;document.getElementById('app').innerHTML=`<div class="workspace"><button class="linkback" data-act="home">← Volver</button><div class="card win"><div class="emoji">🏅</div><h2>¡Estación superada!</h2><p>Escribiste correctamente las 12 respuestas de <b>${esc(m.title)}</b>. Ahora puedes continuar con otra estación o repasar.</p><div class="actions" style="justify-content:center"><button class="btn" data-act="home">Elegir otra estación</button><button class="btn secondary" data-act="review">Modo memoria</button></div></div></div>`}
function review(){let cleared=MODULES.flatMap(m=>m.q.slice(0,st.done[m.id]));if(!cleared.length){screen='home';return render()};if(!reviewQuestion)reviewQuestion=cleared[Math.floor(Math.random()*cleared.length)];document.getElementById('app').innerHTML=`<div class="workspace"><button class="linkback" data-act="home">← Regresar</button><div class="card review"><div class="eyebrow">MODO MEMORIA · REPASO ESPACIADO</div><h2>¿Todavía lo recuerdas?</h2><p>Una pregunta ya dominada reaparece. Responde sin mirar la teoría; escribir vuelve a fortalecer tu memoria.</p><div class="qtext">${esc(reviewQuestion.p)}</div><input class="answer" id="reviewinput" autocomplete="off" placeholder="Escribe tu respuesta"><div id="reviewmsg" aria-live="polite"></div><div class="btnrow"><button class="btn" data-act="reviewcheck">Comprobar</button><button class="btn secondary" data-act="reviewnext">Otra pregunta</button></div></div></div>`}
function reviewCheck(){let input=document.getElementById('reviewinput');if(!input)return;let msg=document.getElementById('reviewmsg');let ok=check(input.value,reviewQuestion.a);if(ok){st.rev++;save();msg.innerHTML='<div class="feedback good"><strong>¡Lo recordaste!</strong><p>Ahora intenta otra.</p></div>'}else{msg.innerHTML=`<div class="feedback"><strong>No todavía.</strong><p>Pista: ${esc(reviewQuestion.h)} · Respuesta: ${esc(reviewQuestion.a[0])}</p></div>`}}
function report(){let done=count(),isFinished=done===132&&st.secs>=1800;document.getElementById('app').innerHTML=`<div class="workspace"><button class="linkback" data-act="home">← Volver al juego</button><div class="card review"><div class="eyebrow">INFORME PARA ACOMPAÑAR · GUARDADO LOCALMENTE</div><h2>Mi camino por la libreta</h2><p>Aquí se muestran respuestas correctas y temas que necesitaron más intentos. <b>Un acierto después de varias pistas no demuestra todavía dominio independiente</b>: conviene repasarlo mañana.</p><div class="statline" style="margin:22px 0"><div class="card stat"><b>${done}/132</b><span>Correctas</span></div><div class="card stat"><b>${minutes(st.secs)}</b><span>Tiempo activo</span></div><div class="card stat"><b>${Object.keys(st.mistakes).filter(k=>st.mistakes[k]>0).length}</b><span>Con errores previos</span></div></div><h3>Avance por tema</h3>${MODULES.map(m=>`<div style="display:flex;align-items:center;gap:11px;margin:13px 0"><span style="min-width:42%;font-weight:800;font-size:14px">${m.emoji} ${esc(m.short)}</span><div class="bar" style="flex:1;margin:0"><span style="width:${pct(st.done[m.id],12)}%;background:${m.color}"></span></div><span style="font-weight:800;font-size:13px">${st.done[m.id]}/12</span></div>`).join('')}<div class="modalinfo">Próximo repaso: vuelve a responder algunas preguntas difíciles sin pistas. El tiempo mínimo es 30 minutos de actividad real; si dejas de interactuar durante 50 segundos, el reloj no sigue contando.</div>${isFinished?`<div class="cert"><h2>🏆 DIPLOMA DE PERSEVERANCIA</h2><p>Completó los 132 retos escritos de la libreta y dedicó al menos 30 minutos de práctica activa.</p><p>Fecha: ${new Intl.DateTimeFormat('es-MX',{dateStyle:'long'}).format(new Date())}</p><p><strong>Esta medalla reconoce práctica, no sustituye la evaluación escolar.</strong></p></div>`:`<div class="finishbox"><b>La misión todavía continúa.</b><p>${132-done} respuestas pendientes · ${Math.max(0,1800-st.secs)} segundos activos pendientes. Cuando termines los temas, puedes usar el modo memoria para reforzar lo aprendido.</p></div>`}<div class="actions"><button class="btn" data-act="print">🖨️ Imprimir informe</button><button class="btn secondary" data-act="review">Modo memoria</button><button class="btn secondary" data-act="home">Volver</button></div></div></div>`}
function resume(){let first=MODULES.find(m=>st.done[m.id]<12);if(first)openTopic(first.id);else{screen='report';render()}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;tap();let act=b.dataset.act,id=b.dataset.id;if(act==='home'){screen='home';justSolved=null;render()}else if(act==='open'){openTopic(id)}else if(act==='lesson'){screen='lesson';justSolved=null;render()}else if(act==='begin'){if(st.done[topic.id]===12){screen='review';reviewQuestion=null}else{screen='question'}justSolved=null;render()}else if(act==='check'){checkAnswer()}else if(act==='next'){justSolved=null;question()}else if(act==='hint'){if(screen==='question'){let q=topic.q[st.done[topic.id]];st.mistakes[q.id]=(st.mistakes[q.id]||0)+1;save();question()}}else if(act==='resume'){resume()}else if(act==='report'){screen='report';render()}else if(act==='review'){screen='review';reviewQuestion=null;render()}else if(act==='reviewcheck'){reviewCheck()}else if(act==='reviewnext'){reviewQuestion=null;review()}else if(act==='print'){window.print()}window.scrollTo({top:0,behavior:'instant'})});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target?.id==='answerfield'){e.preventDefault();checkAnswer()}if(e.key==='Enter'&&e.target?.id==='reviewinput'){e.preventDefault();reviewCheck()}});
window.addEventListener('pagehide',save);render();
</script></body></html>
