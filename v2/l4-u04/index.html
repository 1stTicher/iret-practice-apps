<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 4 — Going Glocal Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title": "Unit 4 — Going Glocal Practice App", "tag": "LEVEL 4 · UNIT 4", "sub": "Advertising, people in the media, speculation, relative clauses & opinions", "sections": [{"title": "Advertising", "cards": [["ad / advertisement", "A picture, video or text that promotes a product.", "Times Square is full of large ads."], ["advertise", "Tell people about a product so they buy it.", "My cousin advertises her clothes with online videos."], ["brand", "A company's name for its products.", "There are many laptop brands. What's the difference?"], ["commercial", "An ad on TV or radio.", "I hate sitting through all the TV commercials."], ["fashion statement", "Clothes or a look that shows your personality.", "She dyed her hair blue to make a fashion statement."], ["logo", "A symbol that represents a company.", "Our new logo makes the company look modern."], ["merchandise", "Products that are sold.", "Our store's merchandise changes every season."], ["merchandising", "Selling products with a team's or brand's name.", "Many colleges make a good profit from merchandising."], ["product", "Something made to be sold.", "The store has a good variety of products."], ["slogan", "A short, memorable phrase used in advertising.", "\"Just do it\" is a famous slogan."], ["sponsor", "A company that pays to support an event (n.) / to pay to support (v.).", "The game is sponsored by an airline."], ["status symbol", "Something that shows you have money or importance.", "His sports car is a status symbol."]]}, {"title": "People in the Media", "qs": [["A person who tells jokes on stage.", ["comedian", "producer", "model"], 0, "Comedian."], ["The people watching a show.", ["audience", "entertainer", "icon"], 0, "Audience."], ["A person who plays music at a club or party.", ["DJ", "designer", "hero"], 0, "DJ."], ["A person who makes movies.", ["filmmaker", "performer", "model"], 0, "Filmmaker."], ["A person many people admire, a symbol of something.", ["icon", "audience", "DJ"], 0, "Icon."], ["A person who creates clothes or products.", ["designer", "comedian", "hero"], 0, "Designer."], ["Someone who does something brave to help others.", ["hero", "celebrity", "producer"], 0, "Hero."], ["A person responsible for the budget and people in a movie.", ["movie producer", "performer", "entertainer"], 0, "Movie producer."], ["A famous person.", ["celebrity", "audience", "logo"], 0, "Celebrity."], ["A person who sings, dances or acts for an audience.", ["performer", "designer", "sponsor"], 0, "Performer / entertainer."]]}, {"title": "Modals of Speculation", "hint": "must = sure it's true · might/could/may = not sure · can't/must not = sure it's not true.", "qs": [["The office lights are off. Everyone ___ have gone home.", ["must", "can", "can't"], 0, "You're sure → must."], ["She's not answering. She ___ be in a meeting.", ["might", "can", "must not"], 0, "Not sure → might."], ["That ___ be the CEO. He's too young!", ["can't", "must", "may"], 0, "Sure it's not true → can't."], ["He's wearing a jersey. He ___ be a fan of the team.", ["must", "can't", "can"], 0, "Strong conclusion → must."], ["Which word is NOT used for speculation?", ["can", "might", "could"], 0, "Don't use can for speculation."], ["The ad is everywhere. The company ___ have a big budget.", ["must", "can't", "can"], 0, "Logical conclusion → must."], ["I'm not sure where Ana is. She ___ be at lunch.", ["could", "must", "can't"], 0, "Possibility → could."], ["They ___ be at home — their car isn't there.", ["must not", "must", "might"], 0, "Sure it's not true → must not / can't."]]}, {"title": "Relative Clauses", "hint": "who = people · which = things · that = people/things · where = places.", "qs": [["There is a millionaire ___ travels all over the world to collect art.", ["who", "which", "where"], 0, "Person → who."], ["He's getting into a car ___ will take him to the airport.", ["which", "who", "where"], 0, "Thing → which/that."], ["That's the stadium ___ we saw the final.", ["where", "which", "who"], 0, "Place → where."], ["The brand ___ sponsors our team is from Mexico.", ["that", "who", "where"], 0, "Thing → that/which."], ["She's the designer ___ created our new logo.", ["who", "which", "where"], 0, "Person → who."], ["This is the store ___ sells vintage jerseys.", ["that", "where", "who"], 0, "Subject relative clause about a thing → that/which."], ["The city ___ I grew up is very small.", ["where", "which", "who"], 0, "Place → where."], ["I like ads ___ make me laugh.", ["that", "who", "where"], 0, "Things → that."]]}, {"title": "Opinions", "hint": "What is the speaker doing?", "qs": [["\"As I see it, ...\"", ["Giving an opinion", "Partly agreeing", "Strongly disagreeing"], 0, "Starts your opinion."], ["\"That's a good point, but...\"", ["Partly agreeing", "Giving an opinion", "Strongly disagreeing"], 0, "Accepts an idea, then contrasts."], ["\"I couldn't disagree more.\"", ["Strongly disagreeing", "Partly agreeing", "Giving an opinion"], 0, "Very strong disagreement."], ["\"I really think...\"", ["Giving an opinion", "Strongly disagreeing", "Partly agreeing"], 0, "Strong personal belief."], ["\"That's true, but...\"", ["Partly agreeing", "Strongly disagreeing", "Giving an opinion"], 0, "Partial agreement, then objection."], ["\"You have it all wrong.\"", ["Strongly disagreeing", "Giving an opinion", "Partly agreeing"], 0, "Complete disagreement."], ["\"It's not so much that I'm not interested, it's just that...\"", ["Giving an opinion", "Strongly disagreeing", "Partly agreeing"], 0, "Explains your real reason."], ["\"But the thing is, ...\"", ["Giving an opinion", "Partly agreeing", "Strongly disagreeing"], 0, "Introduces your main point."]]}]};</script><script src="../assets/app.js"></script></body></html>
