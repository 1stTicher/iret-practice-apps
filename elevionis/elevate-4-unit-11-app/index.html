ite","aliases":[],"ipa":"/waɪt/","meaning":"the color of snow","example":"My school shirt was white.","additionalExample":"Snow is white."},{"word":"orange","aliases":[],"ipa":"/ˈɔːrɪndʒ/","meaning":"the color of a carrot","example":"My favorite cup was orange.","additionalExample":"Carrots and pumpkins are orange."},{"word":"pink","aliases":[],"ipa":"/pɪŋk/","meaning":"a light red color","example":"Her dress was pink.","additionalExample":"Flamingos are pink."},{"word":"purple","aliases":[],"ipa":"/ˈpɜːrpəl/","meaning":"a color between red and blue","example":"The flowers were purple.","additionalExample":"Eggplants are usually purple before you cook them."}],"grammar":[["My house ___ small when I was a child.",["were","was","are"],1,"Use was with a singular house in the past."],["My grandparents ___ funny.",["was","were","is"],1,"Use were with plural grandparents."],["Choose the negative.",["It wasn't quiet.","It weren't quiet.","It not was quiet."],0,"It takes was/wasn't."],["They ___ ready yesterday.",["wasn't","weren't","isn't"],1,"They takes were/weren't."],["___ your bike blue?",["Was","Were","Did"],0,"Use was before the singular subject your bike."],["Were your shoes brown?",["Yes, they was.","Yes, they were.","Yes, it was."],1,"Shoes becomes they, and the answer repeats were."],["Was it new?",["No, it wasn't.","No, it weren't.","No, it didn't."],0,"Repeat was/wasn't in a short answer with be."],["Choose the information question.",["What color your walls were?","What color were your walls?","What color did your walls were?"],1,"Question word + were + subject."],["Where ___ your first school?",["was","were","did"],0,"The singular school takes was."],["How old ___ your friends then?",["was","were","is"],1,"The plural subject your friends takes were."],["Choose the past sentence.",["My room is white now.","My room was blue then.","My room are blue."],1,"Was and then mark the past."],["Choose the present sentence.",["My flowers were purple then.","My flowers was purple.","My flowers are green now."],2,"Plural flowers takes are in the present."]],"functions":[["You do not know the answer.",["I have no idea.","I'm going to visit.","Yes, it is."],0,"I have no idea expresses strong uncertainty."],["You have an uncertain memory.",["It was definitely green.","I think it was green.","It is always green."],1,"I think makes the claim less certain."],["You need a moment to remember.",["Let me think...","Let's meet downtown.","Here you are."],0,"Let me think gives you time to remember."],["You are unsure of a color.",["Maybe it was blue?","It was blue for sure.","It is blue every day."],0,"Maybe signals doubt."],["Choose a strong uncertainty phrase.",["I'm not sure.","It was red.","Yes, it was."],0,"I'm not sure clearly signals uncertainty."],["Continue: What was your first toy?",["I think it was a small car.","I am at home.","Let's eat rice."],0,"The response answers the memory question and marks uncertainty."]],"listening":[["Is the speaker describing a memory or making a plan?",["A memory","A plan","A recipe"],0,"She describes her grandmother's house in the past."],["What colors were the walls and the door?",["White walls and a red door","Yellow walls and a bright blue door","Green walls and a black door"],1,"Listen for yellow and bright blue."],["When was it quiet?",["In the morning","At night","All day"],1,"The birds were loud in the morning, but the house was quiet at night."],["How old does she think she was?",["About six","Exactly twelve","About sixteen"],0,"She says I think I was six years old, so this is uncertain."]],"reading":[["What color were the walls?",["Yellow","White","Green"],0,"The first paragraph says the walls were yellow."],["What color was the door?",["Purple","Bright blue","Black"],1,"The first paragraph says the door was bright blue."],["Was the kitchen warm or cold?",["Warm","Cold","The story doesn't say"],0,"The second paragraph describes a warm kitchen."],["How old was the writer?",["Definitely six","She re about the year. I think I was six years old. My favorite room was the kitchen. It was warm.","readingTitle":"My Grandmother's House","passage":["My grandmother's house was small, but it was beautiful. The walls were yellow, and the door was bright blue. In the garden, the flowers were purple and pink. It was noisy in the morning — the birds were loud! But at night, it was quiet.","I'm not sure about the year, but I think I was six years old. My favorite room was the kitchen. It was warm, and it always smelled wonderful. The kitchen table was old and brown, but it wasn't ugly. It was perfect for me.","Now the house is different. The walls aren't yellow anymore. But when I close my eyes, my grandmother's house is still yellow, blue, and purple — colorful, like my memory."],"wordOrder":[{"prompt":"Build a correct sentence or question.","words":["Was","your","bike","blue","?"],"answer":"Was your bike blue ?","seed":3,"explanation":"Was/were agrees with the subject. Put the helper before the subject in questions."},{"prompt":"Build a correct sentence or question.","words":["What","color","were","your","shoes","?"],"answer":"What color were your shoes ?","seed":4,"explanation":"Was/were agrees with the subject. Put the helper before the subject in questions."},{"prompt":"Build a correct sentence or question.","words":["They","weren't","quiet","."],"answer":"They weren't quiet .","seed":5,"explanation":"Was/were agrees with the subject. Put the helper before the subject in questions."}],"production":[{"title":"People, Places and Things","prompt":"Describe people, places, and things with adjectives. Use was and were to talk about the past.","criteria":["Vocabulary: 10 describing adjectives","Grammar: statements with was / were","Speaking: describe an object from your childhood"],"model":"My object was a school bag.\nIt was blue.\nIt was new, too.\nIt wasn't big."},{"title":"Colors","prompt":"Name colors, describe things you remember with colors, and ask questions with wa   if(S.section===4){h+='<p>'+esc(D.preListening)+'</p><audio controls preload="none" aria-label="Original unit listening recording" src="'+D.audio+'"></audio><p><small>'+(S.indexes[4]===0||!S.indexes[4]?'First listen: find the main idea.':'Second listen: listen again for details.')+'</small></p>';}
  if(S.section===5)h+='<details open><summary>'+esc(D.readingTitle)+'</summary><div class="reading">'+D.passage.map(p=>'<p>'+esc(p)+'</p>').join('')+'</div></details>';
  h+='<h2>'+esc(q[0])+'</h2>';
  const typed=S.section===0 || (S.section===1&&q[0].includes('___')&&q[1][q[2]].split(' ').length<3);
  if(typed)h+='<label for="typed">'+(S.section===0?'Type the word or phrase.':'Type the missing word or words.')+'</label><input id="typed" autocomplete="off" value="'+esc(S.typed[key()]||'')+'"><div class="controls"><button class="primary" data-action="check-typed">Check</button></div>';
  else h+='<div class="options">'+q[1].map((x,i)=>'<button data-action="choice" data-value="'+i+'">'+esc(x)+'</button>').join('')+'</div>';
 }
 if(S.showHint)h+='<p class="feedback"><b>Hint:</b> '+esc(S.section===0?'Think of the unit word. Singular and plural forms are shown in the word bank.':S.section===2?'Start with a question word or helper in questions. Keep the subject before the main verb in statements.':S.section===4?'Listen again for the words that answer this question.':S.section===5?'Find the sentence in the reading that gives this information.':S.section===3?'Decide whether you need to offer, request, accept, refuse or express uncertainty.':'Identify the subject and the time. Then choose the matching helper and verb form.')+'</p>';
 h+=feedback()+controls();
 if(S.section===4)h+='<div class="controls"><button data-action="transcript">'+(S.showTranscript?'Hide transcript':'Review complete transcript')+'</button></div>'+(S.showTranscript?'<div class="feedback model"><b>Complete transcript</b><br>'+esc(D.transcript)+'<p>Find words that support every answer.</p></div>':'');
 h+='</section>';
 if(S.section===0)h+=wordBank();el('main').innerHTML=h;
 el('progress').textContent=Object.keys(S.correct).length+' correct answers recorded';
}
function mark(correct,explanation){S.attempted[key()]=true;if(correct)S.correct[key()]=true;S.feedbackKind=correct?'ok':'bad';S.feedback=(correct?'<b>Correct.</b> ':'<b>Try again.</b> ')+esc(explanation);render();}
function clearView(){S.feedback='';S.feedbackKind='';S.showHint=false;S.showModel=false;S.showTranscript=false;}
document.addEventListener('input',e=>{if(e.target.id==='typed')S.typed[key()]=e.target.value;if(e.target.id==='draft')S.drafts[key()]=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='typed'){e.preventDefault();checkTyped();}});
function checkTyped(){const q=item(),answer=norm(S.typed[key()]||'');if(!answer){S.feedback='Write an answer first.';S.feedbackKind='bad';render();return;}const wanted=norm(q[1][q[2]]);const aliases=S.section===0?(q[4].aliases||[]).map(norm):[];mark(answer===wanted||aliases.includes(answer),answer===wanted||aliases.includes(answer)?q[3]:'Use the hint or review the word bank, then try again.');}
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;
 if(a==='section'){S.section=Number(v);clearView();render();return;}
 if(a==='choice'){const q=item(),right=Number(v)===q[2];mark(right,right?q[3]:'Check the subject, meaning or evidence, then try another answer.');return;}
 if(a==='check-typed'){checkTyped();return;}
 if(a==='hint'){S.showHint=!S.showHint;render();return;}
 if(a==='answer'){
  const q=item();S.reviewed[key()]=true;S.attempted[key()]=true;S.feedbackKind='';S.feedback=S.section===2?'<b>Answer:</b> '+esc(q.answer):S.section===6?'<b>Possible response:</b><br>'+esc(q.model).replace(/\n/g,'<br>'):'<b>Answer:</b> '+esc(q[1][q[2]])+'<br>'+esc(q[3]);render();return;
 }
 if(a==='next'||a==='prev'){
  if(a==='next'&&S.section<6&&!S.attempted[key()]){S.feedback='Try this question or choose Review answer before continuing.';S.feedbackKind='bad';render();return;}
  const next=(S.indexes[S.section]||0)+(a==='next'?1:-1);if(next>=bank().length){S.feedback='You reached the end of this section. Review it again or choose another section.';S.feedbackKind='ok';render();return;}
  S.indexes[S.section]=Math.max(0,next);clearView();render();return;
 }
 if(a==='transcript'){S.showTranscript=!S.showTranscript;render();return;}
 if(a==='word'){(S.words[key()]??=[]).push(Number(v));S.feedback='';render();return;}
 if(a==='undo'){(S.words[key()]||[]).pop();render();return;}
 if(a==='clear-words'){S.words[key()]=[];S.feedback='';render();return;}
 if(a==='check-order'){const q=item(),pieces=shuffle(q.words,q.seed),answer=(S.words[key()]||[]).map(n=>pieces[n]).join(' ');mark(norm(answer)===norm(q.answer),norm(answer)===norm(q.answer)?q.explanation:'Use every word once. Check the helper and subject order.');return;}
 if(a==='model'){S.showModel=!S.showModel;render();return;}
 if(a==='review-draft'){const draft=(S.drafts[key()]||'').trim();S.feedbackKind=draft?'':'bad';S.feedback=draft?'Read your response aloud. Check every item above and compare with a possible response. Ask your teacher about anything unclear.':'Write notes or a response first.';S.attempted[key()]=Boolean(draft);render();return;}
 if(a==='reset'||a==='reset-all'){
  const prefix=S.section+':';for(const name of ['correct','attempted','reviewed','typed','words','drafts'])for(const k of Object.keys(S[name]))if(a==='reset-all'||k.startsWith(prefix))delete S[name][k];
  if(a==='reset-all')S.indexes={};else S.indexes[S.section]=0;clearView();render();return;
 }
});
render();
</script></body></html>
