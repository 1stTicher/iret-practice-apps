<script>
(()=>{'use strict';
const KEY='mision-agua-v1', APP='Misión Agua';const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mods=[{id:'leer',emoji:'📖',name:'Detectives de lectura',desc:'Pistas, ideas principales y comprensión.',tag:'Lenguajes'},{id:'mates',emoji:'🧮',name:'Matemáticas en acción',desc:'Fracciones, operaciones y problemas.',tag:'Saberes'},{id:'ciencia',emoji:'🔬',name:'Laboratorio del agua',desc:'El ciclo del agua y experimentos.',tag:'Ciencias'},{id:'mapas',emoji:'🧭',name:'Exploradores del mapa',desc:'Coordenadas y puntos cardinales.',tag:'Geografía'},{id:'comunidad',emoji:'🤝',name:'Guardianes del barrio',desc:'Decisiones, hechos y soluciones.',tag:'Comunidad'},{id:'ingles',emoji:'🌍',name:'Water Heroes!',desc:'Palabras y expresiones en inglés.',tag:'Opcional'}];
const story=`<p>El lunes, <strong>Maya</strong> encontró las plantas del huerto escolar con las hojas caídas. La tierra estaba seca, aunque el viernes había llovido mucho. «¿A dónde se fue el agua?», preguntó.</p><p>Su amigo Tomás pensó que alguien olvidó regar. Maya observó que el suelo era arenoso. La maestra explicó que parte del agua había entrado en la tierra: a ese proceso se le llama <strong>infiltración</strong>.</p><p>Juntos descubrieron que un grifo cercano goteaba. Tomás propuso recoger el agua temporalmente mientras un adulto reparaba la llave. Maya sugirió usarla para regar si era adecuada para las plantas.</p><p>También acordaron revisar la humedad de la tierra antes de regar. Una semana después, las hojas se veían más firmes. Aprendieron que cuidar un huerto significa <strong>observar, preguntar y actuar con responsabilidad</strong>.</p>`;
const qs=[
['leer','¿Qué problema observó Maya el lunes?',['El huerto tenía hojas caídas y tierra seca','La escuela estaba cerrada','Había demasiados árboles'],0,'Maya observó las hojas caídas y la tierra seca. La respuesta está al inicio del texto.','Busca una pista en el primer párrafo.'],
['leer','¿Qué significa infiltración?',['Que llueve mucho','Que el agua entra en el suelo','Que el agua se convierte en vapor'],1,'La infiltración ocurre cuando el agua penetra en el suelo.','La maestra explica esta palabra en el texto.'],
['leer','¿Qué observación apoyó la explicación de Maya?',['El suelo era arenoso','Era lunes','El cartel era bonito'],0,'El suelo arenoso ayudó a explicar por qué el agua entró en la tierra.','Busca una característica del suelo.'],
['leer','¿Por qué revisaban la humedad antes de regar?',['Para no regar sin necesidad','Para hacer lodo','Para gastar más agua'],0,'Regar de más puede perjudicar algunas plantas y desperdiciar agua.','Piensa si más agua siempre es mejor.'],
['leer','¿Cuál es la idea principal de la historia?',['Hay que observar y tomar decisiones para cuidar el huerto','Las cubetas sirven para jugar','Siempre debemos regar todas las plantas a diario'],0,'La historia muestra cómo observar un problema y actuar con cuidado.','Piensa qué aprendieron los personajes.'],
['leer','¿Qué frase es una opinión?',['El grifo estaba goteando','El jardín de Maya es el más hermoso del mundo','La maestra habló de infiltración'],1,'«Más hermoso» es una valoración personal. Los otros enunciados cuentan hechos del relato.','Una opinión expresa lo que alguien piensa o siente.'],
['mates','¿Qué fracción equivale a 1/2?',['1/4','2/4','3/4'],1,'Dos de cuatro partes iguales representan la mitad del entero.','Imagina partir una pizza en cuatro y tomar dos.'],
['mates','¿Cuál es mayor, si las pizzas son iguales?',['1/4','Son iguales','1/2'],2,'La mitad es mayor que un cuarto cuando ambos enteros tienen el mismo tamaño.','Compara las partes sombreadas.'],
['mates','Maya bebe 1/4 de una botella llena. ¿Qué fracción queda?',['3/4','1/4','4/4'],0,'Quedaban cuatro cuartos; si bebió uno, quedan tres.','1 entero = 4/4.'],
['mates','Cinco macetas cuestan $24 cada una. ¿Cuánto pagas?',['$120','$29','$100'],0,'5 × 24 = 120 pesos.','Puedes sumar 24 cinco veces.'],
['mates','Si pagas esas macetas con $200, ¿cuánto te devuelven?',['$120','$80','$75'],1,'200 − 120 = 80 pesos de cambio.','Resta el costo de la cantidad entregada.'],
['mates','Doce plantas cuestan $18 cada una. ¿Cuál es el total?',['$206','$216','$126'],1,'12 × 18 = 216 pesos.','10 × 18 más 2 × 18.'],
['mates','Lun 4 L, Mar 6 L, Mié 3 L, Jue 7 L. ¿Cuántos litros suman?',['18 litros','20 litros','24 litros'],1,'4 + 6 + 3 + 7 = 20 litros.','Suma por parejas.'],
['mates','Se compran 6 cubetas de $23. ¿Cuánto se paga?',['$138','$29','$132'],0,'6 × 23 = 138 pesos.','6 × 20 y 6 × 3, luego suma.'],
['ciencia','El Sol calienta un charco y el agua pasa a vapor. ¿Qué sucede?',['Condensación','Evaporación','Precipitación'],1,'Evaporación: parte del agua líquida pasa a vapor.','El agua se está convirtiendo en gas.'],
['ciencia','El vapor se enfría y forma pequeñas gotas. Esto es…',['Condensación','Infiltración','Acumulación'],0,'La condensación forma gotitas a partir del vapor de agua.','Ocurre, por ejemplo, al formarse una nube.'],
['ciencia','La lluvia que cae de una nube es…',['Evaporación','Precipitación','Filtración'],1,'La precipitación incluye lluvia, nieve y granizo.','Es agua que cae desde la atmósfera.'],
['ciencia','Una parte de la lluvia entra en el suelo. ¿Cómo se llama?',['Infiltración','Evaporación','Condensación'],0,'La infiltración es la entrada de agua en el suelo.','Piensa en la tierra después de llover.'],
['ciencia','¿Filtrar agua con arena la vuelve segura para beber?',['Sí, siempre','Solo cuando está fría','No, puede conservar microorganismos'],2,'La arena puede retener partículas, pero no garantiza agua potable. No bebas agua de experimentos.','Agua clara no siempre significa agua potable.'],
['ciencia','En una comparación de arena y tierra, ¿qué cantidad debe mantenerse igual?',['La cantidad de agua vertida','El color del vaso','El nombre del experimento'],0,'Usar la misma cantidad de agua ayuda a realizar una comparación justa.','Una prueba justa cambia una variable a la vez.'],
['ciencia','¿Qué conviene hacer antes de regar una planta?',['Comprobar la humedad del suelo','Llenar la maceta hasta arriba','Regarla cinco veces siempre'],0,'Observar la humedad ayuda a evitar exceso de riego.','Recuerda lo que descubrieron Maya y Tomás.'],
['mapas','En el plano, ¿qué lugar está en B2?',['Biblioteca','Plaza','Cancha'],0,'La columna B y la fila 2 se cruzan en la biblioteca.','Busca columna B, luego fila 2.'],
['mapas','¿Qué hay al norte de la plaza C2?',['Parque C1','Clínica C3','Escuela A2'],0,'Al norte es hacia arriba en el plano: C1 es el parque.','Norte = arriba.'],
['mapas','Desde la escuela A2 avanzas dos casillas al este. Llegas a…',['Biblioteca B2','Plaza C2','Cancha D2'],1,'A2 → B2 → C2; llegas a la plaza.','Este = derecha.'],
['mapas','¿Qué está al sur de la tienda B3?',['Casa B1','Puente B4','Biblioteca B2'],1,'Al sur de B3 está B4: puente.','Sur = abajo.'],
['mapas','¿Qué punto cardinal es opuesto al norte?',['Este','Oeste','Sur'],2,'El sur está en dirección opuesta al norte.','Piensa en una brújula.'],
['comunidad','«El grifo goteó durante el recreo». ¿Qué tipo de afirmación es?',['Una opinión','Un hecho comprobable','Un consejo'],1,'Es un hecho que puede observarse o comprobarse.','¿Se puede verificar?'],
['comunidad','«El cartel azul es el más bonito». ¿Qué tipo es?',['Opinión','Hecho','Medición'],0,'«Más bonito» depende de las preferencias de cada persona.','¿Todo el mundo estaría de acuerdo?'],
['comunidad','¿Qué acción ayuda a resolver una fuga en la escuela?',['Ignorarla','Avisar a un adulto responsable','Dejar la llave abierta'],1,'Avisar al personal responsable permite que la fuga sea atendida de manera segura.','Un niño no debe reparar instalaciones por su cuenta.'],
['comunidad','Cartulina $20, marcadores $35 y cinta $15. ¿Cuál es el total?',['$70','$65','$80'],0,'20 + 35 + 15 = 70 pesos.','Suma primero 20 y 15.'],
['comunidad','Si tienes $150 y gastas $70, ¿cuánto te queda?',['$90','$80','$70'],1,'150 − 70 = 80 pesos.','Resta los materiales del presupuesto.'],
['ingles','Choose: water significa…',['agua','sol','nube'],0,'Water /ˈwɔːtər/ significa agua.','Es lo que bebemos.'],
['ingles','Choose: cloud significa…',['jardín','nube','árbol'],1,'Cloud significa nube.','Aparece en el cielo.'],
['ingles','Complete: There ___ two clouds.',['is','are','am'],1,'There are se usa con elementos plurales.','Two = dos, plural.'],

function cardFlip(i){if(game.lock||game.matched.has(i)||game.flipped.includes(i))return;game.flipped.push(i);if(game.flipped.length===2){game.moves++;let [a,b]=game.flipped;if(game.cards[a].match===game.cards[b].match){game.matched.add(a);game.matched.add(b);game.flipped=[];game.score++;state.xp+=10;save();if(game.matched.size===12){game.done=true;saveGame();return}}else{game.lock=true;render();setTimeout(()=>{game.flipped=[];game.lock=false;if(page==='game'&&game.type==='memory')render()},950);return}}render()}
function review(){const correct=Object.values(state.answers).filter(x=>x.correct).length,seen=Object.keys(state.answers).length,due=reviewPool().length;frame(`<div class="surface"><div class="section-head"><div><span class="eyebrow">Fortalece tu memoria</span><h2>Repaso inteligente 🧠</h2><p>Una explicación no basta. Recordar en distintos días fortalece lo aprendido.</p></div></div><section class="hero card" style="grid-template-columns:1fr auto"><div><h2>Hoy toca recordar</h2><p>Te mostraremos siete preguntas nuevas, pendientes o que antes fueron difíciles. Recibirás una pista si la necesitas.</p><div class="actions"><button class="btn" data-action="startReview">Empezar 7 preguntas →</button></div></div><div style="font-size:80px">🧠</div></section><div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat card"><b>${seen}</b><span>Preguntas practicadas</span></div><div class="stat card"><b>${correct}</b><span>Preguntas acertadas en el último intento</span></div></div><div class="ribbon"><div><b>⏰ Repasa mañana</b><p>Las preguntas acertadas reaparecen después de 1, 3, 7 o 14 días. Las que cuestan vuelven antes.</p></div></div></div>`)}
const badgeData=[['🎒','Primer paso','Resuelve una pregunta',Object.keys(state.answers).length>0],['📖','Lector curioso','Logra 80% en lectura',(state.modules.leer?.best||0)>=80],['🧮','Mente matemática','Logra 80% en matemáticas',(state.modules.mates?.best||0)>=80],['🔬','Investigador','Logra 80% en ciencias',(state.modules.ciencia?.best||0)>=80],['🎮','Maestro de juegos','Supera tres minijuegos',completeGames()>=3],['🌈','Guardián del agua','Domina las cinco misiones principales',mods.filter(m=>m.id!=='ingles'&&(state.modules[m.id]?.best||0)>=80).length>=5]];
function report(){frame(`<div class="surface"><div class="section-head"><div><span class="eyebrow">Tu cuaderno de logros</span><h2>Así va tu aventura 🏅</h2><p>El progreso se guarda en este navegador. No se envía información a ningún servidor.</p></div></div><section class="card" style="padding:23px"><label for="studentName" style="font-weight:850;display:block;margin-bottom:8px">Nombre del explorador (opcional)</label><input id="studentName" class="name-input" maxlength="40" autocomplete="off" placeholder="Escribe tu nombre" value="${esc(state.name)}"><div class="stats" style="margin:21px 0 12px"><div class="stat"><b>${state.xp} ⭐</b><span>Puntos</span></div><div class="stat"><b>${mastered()}/6</b><span>Misiones</span></div><div class="stat"><b>${completeGames()}/5</b><span>Juegos</span></div></div><h3>Misiones por área</h3><table class="report-table"><thead><tr><th>Tema</th><th>Mejor resultado</th></tr></thead><tbody>${mods.map(m=>`<tr><td>${m.emoji} ${m.name}</td><td>${state.modules[m.id]?`${state.modules[m.id].best}%`:'Sin empezar'}</td></tr>`).join('')}</tbody></table><h3>Insignias conquistadas</h3><div class="badge-grid">${badgeData.map(b=>`<div class="award ${b[3]?'':'dim'}"><span class="symbol">${b[0]}</span><div><b>${b[1]}</b><small>${b[2]}</small></div></div>`).join('')}</div><p class="note" style="margin-top:22px">Una calificación del 80% en un intento es una meta de práctica, no una certificación oficial. Para comprobar comprensión, pide al niño explicar con sus palabras una respuesta y resolver un reto nuevo en otro día.</p><div class="actions noprint"><button class="btn" data-action="print">🖨️ Imprimir reporte</button><button class="btn secondary" data-go="adults">Guía para adultos</button></div></section></div>`)}
function adults(){frame(`<div class="surface"><button class="back" data-go="home">← Inicio</button><section class="card" style="padding:28px"><span class="eyebrow">Para familias y docentes</span><h2>Cómo acompañar sin dar las respuestas</h2><p>Esta herramienta complementa el cuadernillo «Misión Agua». No sustituye el programa escolar ni evalúa por sí sola la preparación para un examen.</p><h3>Una sesión de 20 a 30 minutos</h3><ol><li><b>Activar (3 min):</b> pregunta qué recuerda del tema.</li><li><b>Practicar (10 min):</b> una misión o un juego, dejando que piense antes de ayudar.</li><li><b>Explicar (5 min):</b> pide «¿cómo lo sabes?» y «¿qué pista utilizaste?».</li><li><b>Aplicar (5 min):</b> inventen un problema similar con objetos de casa.</li><li><b>Recordar otro día:</b> usar Repaso inteligente.</li></ol><h3>Interpretar los resultados</h3><p>El porcentaje muestra aciertos en una sesión. El récord conserva el mejor resultado, por lo que conviene observar también si puede resolver ejercicios nuevos y justificar su respuesta. El niño puede acceder a pistas y explicaciones.</p><h3>Privacidad y accesibilidad</h3><p>Sin registro, sin publicidad, sin rankings públicos ni recopilación de datos. El nombre es opcional. Los datos se guardan en el almacenamiento local del navegador y podrían borrarse si se limpian los datos del sitio o se usa otro dispositivo. Los juegos funcionan con clic o toque y no requieren velocidad.</p><h3>Fundamento didáctico</h3><p>Preguntas de recuperación, repetición espaciada simple (1, 3, 7 y 14 días), representaciones gráficas, pistas graduales, explicación de errores y seguimiento formativo. El calendario es una implementación didáctica sencilla, no un algoritmo de aprendizaje validado individualmente.</p><div class="ribbon"><div><b>⚠️ Seguridad en el laboratorio</b><p>Un experimento casero con arena no potabiliza el agua. Los experimentos físicos deben realizarse con supervisión de un adulto.</p></div></div><div class="actions"><button class="btn" data-go="report">Ver avance →</button><button class="btn secondary" data-action="export">⬇ Exportar progreso (.json)</button></div><details style="margin-top:25px"><summary style="color:#a34536;font-weight:800;cursor:pointer">Borrar los avances de este dispositivo</summary><p>Esta acción elimina los puntos, resultados y nombre guardados en este navegador.</p><button class="btn accent small" data-action="reset">Eliminar progreso</button></details></section></div>`)}
function confetti(){const el=$('#confetti'),colors=['#2bbdb3','#ffce69','#e97b70','#6ebbd4'];el.innerHTML=Array.from({length:33},(_,i)=>`<i style="left:${Math.random()*100}%;background:${colors[i%4]};animation-delay:${Math.random()*.35}s;transform:rotate(${Math.random()*70}deg)"></i>`).join('');setTimeout(()=>{el.innerHTML=''},2000)}
function render(){window.scrollTo({top:0,behavior:'instant'});({home,missions,games,review,report,adults,quiz:drawQuiz,'quiz-finished':quizFinished,game:drawGame}[page]||home)()}
function go(p){page=p;session=null;game=null;render()}function handleGameClick(t){if(!game||game.done||game.choice)return;const id=game.type;if(id==='fraction'&&t.hasAttribute('data-slice')){let i=+t.dataset.slice;game.selected.has(i)?game.selected.delete(i):game.selected.add(i);render()}else if(id==='cycle'&&t.dataset.cycle){let ans=waterSteps[game.idx][1],ok=t.dataset.cycle===ans;gameAnswer(ok,ok?`${ans}: ¡has identificado el proceso!`:`La pista describe ${ans.toLowerCase()}. Lee qué cambia en el agua.`)}else if(id==='graph'&&t.hasAttribute('data-graph')){let q=graphs[game.idx],ok=+t.dataset.graph===q[2];gameAnswer(ok,q[3])}else if(id==='map'&&t.hasAttribute('data-cell')){let [desc,target]=game.rounds[game.idx],ok=+t.dataset.cell===target;gameAnswer(ok,ok?`¡Bien! ${desc.replace('Encuentra ','')} está en la casilla correcta.`:'Lee primero la letra (columna) y luego el número (fila).')}else if(id==='memory'&&t.hasAttribute('data-card'))cardFlip(+t.dataset.card)}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-go],a[data-go],svg path[data-slice]');if(!t)return;if(t.tagName==='A')e.preventDefault();if(t.dataset.go){go(t.dataset.go);return}if(t.dataset.module){startQuiz(t.dataset.module);return}if(t.dataset.game){startGame(t.dataset.game);return}if(t.hasAttribute('data-answer')){answerQuiz(+t.dataset.answer);return}if(t.hasAttribute('data-slice')||t.hasAttribute('data-cycle')||t.hasAttribute('data-graph')||t.hasAttribute('data-cell')||t.hasAttribute('data-card')){handleGameClick(t);return}const a=t.dataset.action;if(a==='hint'&&session){session.showHint=true;render()}if(a==='next'&&session){session.index++;session.answered=false;session.selected=null;session.showHint=false;if(session.index>=session.questions.length)finishQuiz();else render()}if(a==='retry'&&session)startQuiz(session.mod,session.review);if(a==='startReview')startQuiz(null,true);if(a==='clearSlices'&&game){game.selected=new Set();game.feedback='';render()}if(a==='checkGame'&&game){let [n,d]=game.rounds[game.idx],ok=game.selected.size===n;gameAnswer(ok,ok?`¡Correcto! Pintaste ${n} de ${d} partes iguales.`:`Necesitas ${n} porciones coloreadas; ahora tienes ${game.selected.size}.`)}if(a==='gameNext')gameNext();if(a==='replayGame'&&game)startGame(game.type);if(a==='print')window.print();if(a==='reset'&&confirm('¿Borrar todos los avances guardados en este dispositivo?')){state=fresh();save();go('home')}if(a==='export'){const blob=new Blob([JSON.stringify({app:APP,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download='mision-agua-progreso.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}});
document.addEventListener('input',e=>{if(e.target.id==='studentName'){state.name=e.target.value.slice(0,40);save()}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('path[data-slice]')){e.preventDefault();handleGameClick(e.target)}});render();
})();
</script></body></html>
