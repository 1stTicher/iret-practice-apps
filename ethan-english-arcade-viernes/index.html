const spelling=words.filter(v=>['book','apple','chair','dog','cat','water','school','teacher','friend','family','house','pencil','window','mother','happy','yellow','blue','green','bird','fish','shoes'].includes(v[0]));
const positions=[{pos:'on',name:'on',es:'encima de'},{pos:'under',name:'under',es:'debajo de'},{pos:'in',name:'in',es:'dentro de'},{pos:'next to',name:'next to',es:'junto a'}];
const reviewFallback=[{q:'I ___ happy.',ans:'am',why:'I am: con I usamos am.'},{q:'She ___ my friend.',ans:'is',why:'She is: con she usamos is.'}];
let state=readState();let screen='home',session=null,timer=null,audioEnabled=true,toastTimer=null;
function readState(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return{xp:Number(x.xp)||0,results:x.results||{},correct:Number(x.correct)||0,attempts:Number(x.attempts)||0,mistakes:Array.isArray(x.mistakes)?x.mistakes:[],streak:Number(x.streak)||0}}catch{return{xp:0,results:{},correct:0,attempts:0,mistakes:[],streak:0}}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
const el=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(arr,n){return shuffle(arr).slice(0,n)}
function toast(s){const t=document.getElementById('announce');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),1900)}
function sound(happy){if(!audioEnabled)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(happy?530:260,a.currentTime);o.frequency.exponentialRampToValueAtTime(happy?760:180,a.currentTime+.15);g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.22);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.23);setTimeout(()=>a.close(),450)}catch{}}
function report(answer,truth,explanation,area){state.attempts++;if(answer===truth){state.correct++;state.streak++;state.xp+=state.streak%5===0?15:10;sound(true)}else{state.streak=0;state.mistakes.unshift({q:area,got:String(answer),right:String(truth),why:explanation,date:new Date().toISOString()});state.mistakes=state.mistakes.slice(0,35);sound(false)}store()}
function finishGame(id,good,total){const prev=state.results[id]?.best||0;const pct=total?Math.round(good/total*100):0;state.results[id]={best:Math.max(prev,pct),last:pct,played:(state.results[id]?.played||0)+1};state.xp+=pct>=80?35:15;store();clearInterval(timer);timer=null;session={id,kind:'result',good,total,pct}}
function header(){return `<div class="header-bg"><header class="site"><button class="logo" data-go="home"><span class="logo-icon">🎮</span><span>ENGLISH ARCADE</span></button><div class="topactions"><span class="pill">⭐ <b>${state.xp}</b> XP</span><button class="audio-switch" data-action="toggleAudio">${audioEnabled?'🔊 Sonido':'🔇 Sonido'}</button></div></header>${screen==='home'?hero():''}</div>`}
function mascot(){return `<svg class="mascot" viewBox="0 0 420 335" role="img" aria-label="Robot morado y naranja amigable con una estrella"><ellipse cx="208" cy="308" rx="148" ry="19" fill="#080c24" opacity=".25"/><path d="M145 223Q117 251 138 277L167 274L176 232M271 232L282 278L310 270Q312 242 280 216" fill="#9182ec" stroke="#211c5b" stroke-width="8" stroke-linejoin="round"/><path d="M112 185Q82 173 68 198Q61 221 99 229L126 218M306 182Q338 169 349 193Q359 217 320 232L296 220" fill="#8beed4" stroke="#211c5b" stroke-width="8" stroke-linecap="round"/><rect x="125" y="156" width="175" height="100" rx="39" fill="#746dea" stroke="#211c5b" stroke-width="9"/><rect x="163" y="189" width="100" height="31" rx="15" fill="#27234e"/><circle cx="184" cy="205" r="7" fill="#a4ffde"/><circle cx="242" cy="205" r="7" fill="#a4ffde"/><rect x="105" y="61" width="209" height="145" rx="54" fill="#ffce75" stroke="#211c5b" stroke-width="9"/><rect x="130" y="88" width="160" height="95" rx="30" fill="#332b68"/><ellipse cx="172" cy="126" rx="16" ry="24" fill="#bafae7"/><ellipse cx="249" cy="126" rx="16" ry="24" fill="#bafae7"/><path d="M187 157Q211 174 234 157" stroke="#bafae7" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M210 61V30" stroke="#211c5b" stroke-width="9" stroke-linecap="round"/><circle cx="210" cy="27" r="16" fill="#ff6c91" stroke="#211c5b" stroke-width="6"/><path d="m335 55 12 23 26 4-19 18 5 27-24-13-23 13 4-27-19-18 26-4z" fill="#ffe285" stroke="#5d48a0" stroke-width="6"/><path d="m49 80 6 13 15 2-10 10 3 14-14-7-13 7 2-14-10-10 15-2z" fill="#9ef3dc" stroke="#403a85" stroke-width="4"/></svg>`}
function hero(){return `<section class="site hero"><div><span class="kicker">Tu entrenamiento de inglés · 10 años</span><h1>¡Juega.<br><span>Aprende.</span><br>Gana!</h1><p>Ocho videojuegos cortitos para practicar vocabulario, listening, spelling y gramática antes del examen del viernes. ¡Pixel te acompaña!</p><div class="hero-actions"><button class="btn primary" data-action="startRandom">🚀 ¡Empezar a jugar!</button><button class="btn ghost" data-go="review">📈 Ver mi avance</button></div></div><div class="hero-visual">${mascot()}</div></section>`}
function home(){const done=Object.keys(state.results).length;return `${header()}<main class="site arcade-floor"><div class="score-strip"><div class="score-item"><strong>${done}/8</strong><small>Juegos completados</small></div><div class="score-item"><strong>${state.correct}</strong><small>Respuestas acertadas</small></div><div class="score-item"><strong>${state.xp}</strong><small>Puntos de experiencia</small></div></div><div class="sectionline"><div><h2>🕹️ Elige tu juego</h2><p>No necesitas registrarte. Puedes repetir los juegos cuantas veces quieras.</p></div></div><div class="games">${GAME_META.map((g,i)=>`<button class="tile" data-game="${g.id}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="art">${g.ico}</span><h3>${g.name}</h3><p>${g.sub}</p><div class="tile-bottom"><span>${g.level} · ${g.min}</span><span>${state.results[g.id]?state.results[g.id].best+'%':'Jugar →'}</span></div></button>`).join('')}</div><div class="helper"><div><h3>🧠 Una buena estrategia para el examen</h3><p>Primero juega sin pistas. Después revisa los errores y vuelve a jugar más tarde. No hace falta correr: comprender vale más que ganar puntos.</p></div><button class="btn secondary" data-go="review">Revisar mis errores</button></div><p class="footer">Material de práctica A1 aproximado para primaria. No sustituye el temario oficial de la escuela. Los resultados solo se guardan en este dispositivo; no se envían a ningún servidor.</p></main>`}
function wrapGame(inner,title,desc,progress=0,total=0){return `${header()}<main class="site screen"><button class="back" data-go="home">← Volver a los juegos</button><section class="game-shell"><div class="game-top"><div><h1 class="game-title">${title}</h1><p class="explain">${desc}</p></div><span class="stamp">${total?Math.min(progress+1,total)+' / '+total:'Arcade'}</span></div>${total?`<div class="track" aria-label="Progreso"><span style="width:${Math.max(0,progress/total*100)}%"></span></div>`:''}${inner}</section></main>`}
function gameStart(id){clearInterval(timer);timer=null;const s={id,kind:'play',i:0,good:0,errors:0,locked:false};if(id==='memory'){s.pairs=pick(words,6).map((w,i)=>({i,en:w[0],es:w[1]}));s.deck=shuffle(s.pairs.flatMap(p=>[{id:p.i,text:p.en},{id:p.i,text:p.es}]));s.open=[];s.matched=[];s.moves=0;s.busy=false}
if(id==='builder'){s.items=pick(sentences,7);s.pool=[];s.placed=[];loadBuild(s)}
if(id==='gates'){s.items=pick(grammar,10)}
if(id==='listen'){s.items=pick(listening,8);s.reveal=false}
if(id==='spell'){s.items=pick(spelling,8);loadSpell(s)}
if(id==='map'){s.items=shuffle([...positions,...positions]).slice(0,8)}
if(id==='speed'){s.items=shuffle([...words,...words]);s.i=0;s.seconds=60;s.started=false}
if(id==='boss'){s.items=pick(grammar,8).concat(pick(listening,4));s.items=shuffle(s.items);s.lives=3}
session=s;screen='game';render();}
function scoreText(){return `<span class="badge">⭐ ${session.good||0} aciertos</span>`}
function maybeNext(){if(!session||session.kind!=='play')return;const n=session.id==='memory'?6:session.id==='speed'?12:session.items.length;if(session.i>=n){const total=session.id==='memory'?6:session.id==='speed'?Math.max(session.i,1):session.items.length;finishGame(session.id,session.good,total);render();return}session.locked=false;session.reveal=false;if(session.id==='builder')loadBuild(session);if(session.id==='spell')loadSpell(session);render()}
function loadBuild(s){if(!s.items[s.i])return;s.pool=shuffle(s.items[s.i].words.map((word,idx)=>({idx,word})));s.placed=[]}
function loadSpell(s){if(!s.items[s.i])return;s.pool=shuffle(s.items[s.i][0].toUpperCase().split('').map((letter,idx)=>({idx,letter})));s.placed=[]}
function gameMarkup(){const s=session;if(!s)return home();if(s.kind==='result')return resultScreen();switch(s.id){case'memory':return memoryMarkup();case'builder':return builderMarkup();case'gates':return gatesMarkup();case'listen':return listenMarkup();case'spell':return spellMarkup();case'map':return mapMarkup();case'speed':return speedMarkup();case'boss':return bossMarkup();}return home()}
function memoryMarkup(){const s=session;const matched=s.matched.length;const cards=s.deck.map((c,j)=>{const open=s.open.includes(j),done=s.matched.includes(c.id);return `<button class="flip ${done?'done':open?'open':''}" data-memory="${j}" aria-label="${done||open?esc(c.text):'Carta boca abajo'}" ${done?'disabled':''}>${done||open?esc(c.text):'✦'}</button>`}).join('');return wrapGame(`<div class="prompt">Encuentra 6 pares: inglés ↔ español.</div><div class="cards">${cards}</div><div class="row-actions"><span class="note">${matched}/6 pares · ${s.moves} intentos</span><button class="btn secondary small" data-game="memory">Mezclar de nuevo</button></div>${matched===6?`<div class="feedback">🎉 ¡Todos los pares encontrados! Gran trabajo.</div><div class="row-actions"><button class="btn primary" data-action="memoryFinish">Recoger estrellas →</button></div>`:''}`,'🃏 Memory Match','Toca dos cartas y descubre si significan lo mismo.',matched,6)}
function flipCard(j){const s=session;if(!s||s.busy||s.matched.length===6||s.open.includes(j)||s.matched.includes(s.deck[j].id))return;s.open.push(j);if(s.open.length===2){s.moves++;const a=s.deck[s.open[0]],b=s.deck[s.open[1]];if(a.id===b.id){s.matched.push(a.id);s.good++;report('match','match','Pareja correcta: '+s.pairs.find(p=>p.i===a.id).en+' = '+s.pairs.find(p=>p.i===a.id).es,'Memorama: '+a.text);s.open=[];toast('¡Pareja encontrada! 🌟');render()}else{s.errors++;s.busy=true;render();setTimeout(()=>{if(session!==s)return;s.open=[];s.busy=false;render()},850)}}else render()}
function builderMarkup(){const s=session,v=s.items[s.i];const chosen=s.placed.map(idx=>s.pool.find(w=>w.idx===idx));let body=`<div class="prompt">🇪🇸 ${esc(v.es)}</div><p class="note">Toca las palabras en el orden correcto. Puedes retirar una ficha tocándola.</p><div class="sentence-drop" aria-label="Oración que estás formando">${chosen.length?chosen.map(w=>`<button class="word placed" data-remove="${w.idx}">${esc(w.word)}</button>`).join(''):'<span class="note">Las palabras aparecerán aquí…</span>'}</div><div class="wordpool">${s.pool.map(w=>`<button class="word ${s.placed.includes(w.idx)?'used':''}" data-place="${w.idx}" ${s.placed.includes(w.idx)||s.locked?'disabled':''}>${esc(w.word)}</button>`).join('')}</div>${s.locked?`<div class="feedback ${s.correct?'':'bad'}">${s.correct?'✅ ¡Frase perfecta!':'🔎 Vamos a mejorar.'}<br><b>${esc(v.words.join(' '))}</b><br>${esc(v.why)}</div>`:''}<div class="row-actions"><span>${scoreText()}</span>${s.locked?`<button class="btn primary" data-action="next">Siguiente oración →</button>`:`<div><button class="btn secondary small" data-action="buildHint">💡 Pista</button> <button class="btn" data-action="checkBuilder">Comprobar</button></div>`}</div>`;return wrapGame(body,'🧱 Sentence Factory','Construye una oración correcta en inglés.',s.i,s.items.length)}
function checkBuilder(){const s=session;if(s.locked)return;const item=s.items[s.i];if(s.placed.length!==item.words.length){toast('Primero coloca todas las fichas.');return}const answer=s.placed.join(',');const correct=item.words.map((_,idx)=>idx).join(',');s.correct=answer===correct;s.locked=true;report(s.placed.map(idx=>s.pool.find(w=>w.idx===idx).word).join(' '),item.words.join(' '),item.why+' Respuesta: '+item.words.join(' '),'Sentence Factory: '+item.es);if(s.correct)s.good++;render()}
function gatesMarkup(){const s=session,v=s.items[s.i];return wrapGame(`<span class="badge">Tema: ${esc(v.topic)}</span><div class="prompt">${esc(v.q)}</div><p class="note">Escoge la puerta con la palabra correcta.</p><div class="answer-grid">${v.a.map((a,i)=>`<button class="answer ${s.locked?(i===v.right?'good':i===s.choice?'bad':''):''}" data-choice="${i}" ${s.locked?'disabled':''}>🚪 ${esc(a)}</button>`).join('')}</div>${s.locked?`<div class="feedback ${s.choice===v.right?'':'bad'}">${s.choice===v.right?'¡Puerta abierta! ✅':'Aún no. La puerta correcta es '+esc(v.a[v.right])+'.'}<br>${esc(v.why)}</div><div class="row-actions"><span>${scoreText()}</span><button class="btn primary" data-action="next">Siguiente puerta →</button></div>`:''}`,'🚪 Grammar Gates','Explora diez habitaciones y aprende de cada elección.',s.i,s.items.length)}
function listenMarkup(){const s=session,v=s.items[s.i];const disabled=typeof window.speechSynthesis==='undefined';return wrapGame(`<div class="listen-hero"><div class="listen-big">${v.icon}</div><div><button class="listen-btn" data-action="speak" ${disabled?'disabled':''}>🔊 Escuchar frase</button><div class="note">${disabled?'Tu navegador no tiene voz disponible. Usa «Leer frase».':'Puedes escucharla las veces que necesites.'}</div></div></div><button class="btn secondary small" data-action="revealListen">👀 ${s.reveal?'Ocultar texto':'Leer frase (opción accesible)'}</button>${s.reveal||s.locked?`<p class="listen-text">“${esc(v.en)}”</p>`:'<p class="note">Escucha y elige la traducción correcta.</p>'}<div class="answer-grid">${v.options.map((a,i)=>`<button class="answer ${s.locked?(i===v.right?'good':i===s.choice?'bad':''):''}" data-choice="${i}" ${s.locked?'disabled':''}>${esc(a)}</button>`).join('')}</div>${s.locked?`<div class="feedback ${s.choice===v.right?'':'bad'}">${s.choice===v.right?'¡Bien escuchado! 🎧':'Veamos qué decía la frase.'}<br>${esc(v.ex)}</div><div class="row-actions"><span>${scoreText()}</span><button class="btn primary" data-action="next">Siguiente audio →</button></div>`:''}`,'🎧 Listen & Catch','Escucha, identifica la información y elige su significado.',s.i,s.items.length)}
function speak(){if(!session?.items||!window.speechSynthesis)return;const v=session.items[session.i];const msg=new SpeechSynthesisUtterance(v.en||v.q||'Hello!');msg.lang='en-US';msg.rate=.78;msg.pitch=1.08;window.speechSynthesis.cancel();window.speechSynthesis.speak(msg)}
function spellMarkup(){const s=session,v=s.items[s.i],letter=v[0].toUpperCase();return wrapGame(`<div class="large-emoji" aria-label="Ilustración del objeto">${v[2]}</div><div class="prompt" style="text-align:center">¿Cómo se escribe «${esc(v[1])}»?</div><div class="spelling-box">${s.placed.length?s.placed.map(idx=>{const t=s.pool.find(w=>w.idx===idx);return `<button class="letter placed" data-remove="${t.idx}">${esc(t.letter)}</button>`}).join(''):`<span class="note">Toca las letras para formar la palabra</span>`}</div><div class="letters">${s.pool.map(t=>`<button class="letter ${s.placed.includes(t.idx)?'used':''}" data-place="${t.idx}" ${s.placed.includes(t.idx)||s.locked?'disabled':''}>${esc(t.letter)}</button>`).join('')}</div>${s.locked?`<div class="feedback ${s.correct?'':'bad'}">${s.correct?'¡Excelente spelling! 🐝':'La escritura correcta es '+esc(letter)+'.'}<br>Recuerda decir las letras en voz alta.</div>`:''}<div class="row-actions"><span>${scoreText()}</span>${s.locked?`<button class="btn primary" data-action="next">Siguiente palabra →</button>`:`<div><button class="btn secondary small" data-action="spellHint">💡 Primera letra</button> <button class="btn" data-action="checkSpell">Revisar</button></div>`}</div>`,'🐝 Spelling Bee','Observa la imagen y construye la palabra letra por letra.',s.i,s.items.length)}
function checkSpell(){const s=session;if(s.locked)return;const target=s.items[s.i][0].toUpperCase();if(s.placed.length!==target.length){toast('Utiliza todas las letras para formar la palabra.');return}s.correct=s.placed.map(i=>s.pool.find(t=>t.idx===i).letter).join('')===target;s.locked=true;if(s.correct)s.good++;report(s.correct?target:'otro orden',target,'Ortografía: '+target,'Spelling: '+s.items[s.i][1]);render()}
function sceneSVG(pos){const c={on:{x:223,y:70},under:{x:223,y:246},in:{x:223,y:136},'next to':{x:84,y:176}}[pos]||{x:223,y:136};return `<svg class="scene" viewBox="0 0 440 285" role="img" aria-label="Una pelota y una caja; observa su posición"><rect width="440" height="285" fill="#f1faff"/><ellipse cx="220" cy="266" rx="160" ry="12" fill="#daeafa"/><rect x="146" y="100" width="152" height="103" rx="4" fill="#c58d59" stroke="#975f3d" stroke-width="7"/><path d="M147 100l-27-27h152l26 27z" fill="#ecc492" stroke="#975f3d" stroke-width="6"/><rect x="156" y="102" width="132" height="49" fill="#895233" rx="4"/><path d="M298 100l29-27v129l-29 1z" fill="#d99c68" stroke="#975f3d" stroke-width="6"/><circle cx="${c.x}" cy="${c.y}" r="29" fill="#ee688c" stroke="#832f59" stroke-width="5"/><path d="M${c.x-22} ${c.y-17}Q${c.x+18} ${c.y+9} ${c.x+3} ${c.y+26}" stroke="#ffe5ee" stroke-width="7" fill="none"/><circle cx="${c.x-10}" cy="${c.y-10}" r="8" fill="#ffd3e2"/>${pos==='in'?'<rect x="146" y="150" width="152" height="54" fill="#c58d59" stroke="#975f3d" stroke-width="6"/>':''}<rect x="13" y="17" width="107" height="32" rx="15" fill="#fff" stroke="#c4dbef"/><text x="67" y="39" font-size="16" text-anchor="middle" fill="#384f74" font-weight="bold">Look! 👀</text></svg>`}
function mapMarkup(){const s=session,v=s.items[s.i];const opts=shuffle(positions.map(x=>x.name));if(!s.opts)s.opts=opts;return wrapGame(`<div class="prompt">Where is the ball? ⚽</div>${sceneSVG(v.pos)}<div class="answer-grid">${s.opts.map((o,i)=>`<button class="answer ${s.locked?(o===v.pos?'good':i===s.choice?'bad':''):''}" data-choice="${i}" ${s.locked?'disabled':''}>It is <b>${esc(o)}</b> the box.</button>`).join('')}</div>${s.locked?`<div class="feedback ${s.correct?'':'bad'}">${s.correct?'¡Muy bien!':'Observa con atención la pelota.'}<br><b>${esc(v.name)}</b> = ${esc(v.es)}.</div><div class="row-actions"><span>${scoreText()}</span><button class="btn primary" data-action="next">Siguiente escena →</button></div>`:''}`,'🗺️ Where Is It?','Mira el dibujo y elige la preposición correcta.',s.i,s.items.length)}
function speedMarkup(){const s=session,v=s.items[s.i% s.items.length];if(!s.options){const other=pick(words.filter(w=>w[1]!==v[1]),3);s.options=shuffle([v,...other])}return wrapGame(`<div class="speedclock">⏳ ${s.seconds} segundos</div><div class="prompt" style="text-align:center">${s.started?'¿Qué significa «'+esc(v[0])+'»?':'¿Listo para un reto de 60 segundos?'}</div>${s.started?`<div class="speed-bubbles">${s.options.map((o,i)=>`<button class="bubble" data-speed="${i}">${esc(o[1])}</button>`).join('')}</div>`:`<p class="note" style="text-align:center">Practica palabras a tu ritmo dentro de 60 segundos. Equivocarte no te resta puntos.</p><div style="text-align:center"><button class="btn primary" data-action="beginSpeed">⚡ Empezar</button></div>`}<div class="row-actions"><span>${scoreText()}</span><span class="note">Palabras resueltas: ${s.i}</span></div>`,'⚡ Word Rush','Elige la traducción correcta. Los errores son oportunidades de aprender.',Math.min(s.i,12),12)}
function beginSpeed(){const s=session;s.started=true;timer=setInterval(()=>{if(session!==s){clearInterval(timer);return}s.seconds--;if(s.seconds<=0){finishGame('speed',s.good,Math.max(s.i,1))}render()},1000);render()}
function speedChoose(i){const s=session,v=s.items[s.i % s.items.length],chosen=s.options[i];const correct=chosen[1]===v[1];report(chosen[1],v[1],v[0]+' = '+v[1],'Word Rush: '+v[0]);if(correct)s.good++;else toast('Era: '+v[1]);s.i++;s.options=null;if(s.i>=12){finishGame('speed',s.good,s.i)}render()}
function bossMarkup(){const s=session;const v=s.items[s.i];const opts=v.a||v.options;return wrapGame(`<div class="boss-lives">${'❤️'.repeat(s.lives)}${'🩶'.repeat(3-s.lives)} <span class="note">Vidas restantes</span></div><div class="prompt">${esc(v.q||'¿Qué significa esta frase?')}</div>${v.en?`<div class="listen-hero"><div class="listen-big">🎧</div><button class="listen-btn" data-action="speak">🔊 Escucha el audio</button></div><button class="btn secondary small" data-action="revealListen">👀 Mostrar frase</button>${s.reveal||s.locked?`<p class="listen-text">${esc(v.en)}</p>`:''}`:''}<div class="answer-grid">${opts.map((o,i)=>`<button class="answer ${s.locked?(i===v.right?'good':i===s.choice?'bad':''):''}" data-choice="${i}" ${s.locked?'disabled':''}>${esc(o)}</button>`).join('')}</div>${s.locked?`<div class="feedback ${s.correct?'':'bad'}">${s.correct?'¡Impacto! ✨':'Has perdido una vida, pero ya conoces la respuesta.'}<br>${esc(v.why||v.ex)}</div><div class="row-actions"><span>${scoreText()}</span><button class="btn primary" data-action="next">${s.lives===0?'Ver resultado':'Continuar'}</button></div>`:''}`,'👾 Final Boss','Doce desafíos mixtos. Tienes tres corazones, pero puedes volver a intentarlo.',s.i,s.items.length)}
function choice(i){const s=session;if(s.locked)return;let v=s.items[s.i];if(s.id==='gates'||s.id==='listen'||s.id==='boss'){s.choice=i;s.correct=i===v.right;s.locked=true;if(s.correct)s.good++;else s.errors++;report((v.a||v.options)[i],(v.a||v.options)[v.right],v.why||v.ex,(v.q||v.en));if(s.id==='boss'&&!s.correct)s.lives--;render()}else if(s.id==='map'){const val=s.opts[i],good=val===v.pos;s.choice=i;s.correct=good;s.locked=true;if(good)s.good++;report(val,v.pos,v.pos+' = '+v.es,'Preposiciones: pelota');render()}}
function next(){const s=session;if(!s)return;if(s.id==='boss'&&s.lives===0){finishGame('boss',s.good,s.i+1);render();return}s.i++;s.opts=null;maybeNext()}
function resultScreen(){const s=session,g=GAME_META.find(g=>g.id===s.id);const msg=s.pct>=80?'¡Gran trabajo! Tu esfuerzo se nota.':s.pct>=50?'¡Vas por buen camino! Revisa lo que te costó.':'Cada intento te enseña algo nuevo. Practica sin prisa.';return wrapGame(`<div class="result"><div class="trophy">${s.pct>=80?'🏆':s.pct>=50?'🌟':'🌱'}</div><h2>¡Misión terminada!</h2><p>${msg}</p><h2 style="color:#5a4ec7">${s.good} / ${s.total}</h2><p><b>${s.pct}%</b> de aciertos en ${esc(g.name)}.</p><div class="badge-list"><span class="badge">⭐ +${s.pct>=80?35:15} XP extra</span>${s.pct>=80?'<span class="badge">🥇 Insignia conquistada</span>':''}</div><div class="row-actions" style="justify-content:center"><button class="btn secondary" data-go="review">Ver mis errores</button><button class="btn primary" data-game="${s.id}">Jugar otra vez</button><button class="btn" data-go="home">Otros juegos →</button></div></div>`,g.ico+' '+g.name,'Has terminado este desafío. Puedes repetirlo para mejorar.')}
function review(){const done=Object.keys(state.results).length;return `${header()}<main class="site screen"><button class="back" data-go="home">← Volver al arcade</button><section class="game-shell"><h1 class="game-title">📈 Mi entrenamiento</h1><p class="explain">Los datos se guardan en este navegador. Se pierden si borras sus datos o cambias de dispositivo.</p><div class="review-stats"><div class="item"><strong>${done} / 8</strong><small>Juegos explorados</small></div><div class="item"><strong>${state.attempts?Math.round(state.correct/state.attempts*100):0}%</strong><small>Aciertos acumulados</small></div><div class="item"><strong>${state.xp}</strong><small>Estrellas XP</small></div></div><h2>🎯 ¿Qué vale la pena repetir?</h2><div class="review-list">${GAME_META.map(g=>`<div class="review-card"><strong>${g.ico} ${g.name} · ${state.results[g.id]?state.results[g.id].best+'% mejor puntuación':'Sin intentar'}</strong><p>${esc(g.level)} · <button class="btn small secondary" data-game="${g.id}">Jugar</button></p></div>`).join('')}</div><h2 style="margin-top:27px">🔎 Mis últimos errores</h2><p class="note">Repasa estas correcciones en voz alta y vuelve al juego correspondiente.</p><div class="review-list">${(state.mistakes.length?state.mistakes:reviewFallback).slice(0,10).map(e=>`<div class="review-card"><strong>${esc(e.q)}</strong><p><b>Respuesta correcta:</b> ${esc(e.right||'')}</p><p>${esc(e.why||'')}</p></div>`).join('')}</div><div class="row-actions"><button class="btn secondary" data-action="print">🖨️ Imprimir progreso</button><button class="btn secondary" data-action="reset">Borrar mi progreso</button><button class="btn primary" data-go="home">¡Seguir jugando!</button></div></section></main>`}
function render(){document.body.style.background=screen==='home'?'#f4f6ff':'#f7f8ff';el.innerHTML=screen==='home'?home():screen==='review'?review():gameMarkup()}
function act(action){if(action==='toggleAudio'){audioEnabled=!audioEnabled;render();return}if(action==='startRandom'){gameStart('memory');return}if(action==='memoryFinish'){finishGame('memory',session.good,6);render();return}if(action==='checkBuilder'){checkBuilder();return}if(action==='checkSpell'){checkSpell();return}if(action==='buildHint'){toast('La oración comienza con: '+session.items[session.i].words[0]);return}if(action==='spellHint'){toast('La palabra empieza con: '+session.items[session.i][0][0].toUpperCase());return}if(action==='next'){next();return}if(action==='speak'){speak();return}if(action==='revealListen'){session.reveal=!session.reveal;render();return}if(action==='beginSpeed'){beginSpeed();return}if(action==='reset'){if(confirm('¿Quieres borrar todos los puntos, resultados y errores guardados en este dispositivo?')){state={xp:0,results:{},correct:0,attempts:0,mistakes:[],streak:0};store();render()}return}if(action==='print'){window.print();return}}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){clearInterval(timer);timer=null;screen=b.dataset.go;session=null;render();window.scrollTo(0,0);return}if(b.dataset.game){gameStart(b.dataset.game);window.scrollTo(0,0);return}if(b.dataset.action){act(b.dataset.action);return}if(!session||session.kind!=='play')return;const s=session;
if(b.dataset.memory!=null){flipCard(Number(b.dataset.memory));return}
if(b.dataset.place!=null){if(!s.locked){s.placed.push(Number(b.dataset.place));render()}return}
if(b.dataset.remove!=null){if(!s.locked){s.placed=s.placed.filter(n=>n!==Number(b.dataset.remove));render()}return}
if(b.dataset.choice!=null){choice(Number(b.dataset.choice));return}
if(b.dataset.speed!=null){speedChoose(Number(b.dataset.speed));return}
});
window.addEventListener('pagehide',()=>{if(window.speechSynthesis)window.speechSynthesis.cancel()});
render();
})();
</script>
</body>
</html>
