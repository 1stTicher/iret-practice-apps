: [["Start catching up with a friend:", ["What have you been up to?", "What you been doing up?", "What are you up been?"], 0, "Natural opener."], ["Nothing new to report:", ["Not much has changed.", "Quite a lot has changed!", "I've been dealing with delays."], 0, "Same as usual."], ["Lots of news:", ["Actually, quite a lot has changed!", "The same as usual.", "Not much."], 0, "Big change."], ["Friend: \"My train was cancelled twice.\" You:", ["Oh no, that's rough.", "What have you been up to?", "Go straight."], 0, "Sympathy (falling tone)."], ["Asking about a commute:", ["How have you been getting to work?", "How you been get to work?", "How have you get to work?"], 0, "have + been + -ing."]]}, {"title": "Directions", "qs": [["Polite request for help:", ["Could you tell me how to get to Reforma Street?", "Where is Reforma Street go?", "Tell me the street."], 0, "Could you tell me how to get to...?"], ["Giving directions:", ["Go straight for two blocks, then turn left.", "Going straight two blocks, then turned left.", "You went straight."], 0, "Imperatives in order."], ["\"It's next to the church\" means...", ["beside the church", "inside the church", "far from the church"], 0, "next to = beside."]]}]};</script><script src="../assets/app.js"></script></body></html>
