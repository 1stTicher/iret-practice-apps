<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>So Much Stuff</title>
<style>
:root { --wine:#722F37; --gold:#C5A059; --bg:#FFFAF0; --card:#fff; --soft:#F6ECE4; --text:#1A1A1A; --muted:#555;
        --ok:#2D7A4A; --okbg:#E3F1E8; --bad:#B04545; --badbg:#F8E5E5; --line:#EADFC8; }
* { box-sizing:border-box; }
body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); font-size:16px; }
header.app { background:var(--wine); color:#fff; padding:14px 18px; }
header.app h1 { margin:0; font-size:22px; }
header.app p { margin:4px 0 0; font-size:14px; opacity:.9; }
main { max-width:860px; margin:0 auto; padding:16px; }
.progress { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 14px; }
.dot { width:34px; height:34px; border-radius:50%; border:2px solid var(--gold); background:#fff; color:var(--wine); font-weight:bold; cursor:pointer; }
.dot.active { background:var(--wine); color:#fff; border-color:var(--wine); }
.dot.done { background:var(--okbg); }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
.card h2 { margin:0 0 4px; color:var(--wine); font-size:20px; }
.instr { margin:0 0 14px; color:var(--muted); }
.item { border-top:1px solid var(--line); padding:12px 0; }
.item:first-of-type { border-top:none; }
.q { font-weight:bold; margin-bottom:8px; }
.opts { display:flex; flex-wrap:wrap; gap:8px; }
.opt { border:2px solid var(--line); background:#fff; border-radius:20px; padding:8px 14px; cursor:pointer; font-size:15px; text-align:left; }
.opt.sel { border-color:var(--wine); background:var(--soft); }
.item.correct .opt.sel, .item.correct .answerline, .item.correct input, .item.correct select { border-color:var(--ok); background:var(--okbg); }
.item.wrong .opt.sel, .item.wrong .answerline, .item.wrong input, .item.wrong select { border-color:var(--bad); background:var(--badbg); }
.fb { margin-top:6px; font-size:14px; min-height:18px; }
.item.correct .fb { color:var(--ok); } .item.wrong .fb { color:var(--bad); }
.hint { display:none; margin-top:6px; font-size:14px; color:var(--wine); background:var(--soft); padding:6px 10px; border-radius:8px; }
.showhints .hint { display:block; }
.tiles { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.tile { border:1px solid var(--gold); background:#FBF3E4; border-radius:6px; padding:7px 10px; cursor:pointer; font-size:15px; }
.tile.used { visibility:hidden; }
.answerline { min-height:42px; border:2px dashed var(--line); border-radius:8px; padding:6px; display:flex; flex-wrap:wrap; gap:6px; }
.answerline .tile { background:#fff; }
input.gap, select.match, textarea { font:inherit; border:2px solid var(--line); border-radius:8px; padding:7px 10px; }
input.gap { width:min(260px, 100%); }
select.match { min-width:180px; max-width:100%; }
.matchrow { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.matchrow .left { flex:1 1 220px; }
textarea { width:100%; min-height:120px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
.vcard { border:1px solid var(--line); border-radius:10px; padding:14px; background:#fff; cursor:pointer; min-height:120px; }
.vcard .w { font-size:20px; font-weight:bold; color:var(--wine); }
.vcard .ipa { color:var(--muted); margin:2px 0 8px; }
.vcard .back { display:none; } .vcard.flipped .back { display:block; } .vcard.flipped .tap { display:none; }
.tap { color:var(--muted); font-size:13px; }
.audio { display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:var(--soft); border-radius:10px; padding:10px 12px; margin-bottom:12px; }
.audio a.listen { background:var(--wine); color:#fff; text-decoration:none; padding:8px 14px; border-radius:8px; font-weight:bold; }
.audio .transcript-toggle { margin-left:auto; }
.audio .transcript { flex:1 1 100%; max-height:260px; overflow:auto; white-space:pre-wrap; line-height:1.65; background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; }
.audio .transcript[hidden] { display:none; }
button:disabled { opacity:.55; cursor:not-allowed; }
.model { display:none; background:var(--soft); border-radius:10px; padding:12px; margin-top:10px; white-space:pre-wrap; }
.revealed .model { display:block; }
.checklist label { display:block; margin:4px 0; }
.timer { font-weight:bold; color:var(--wine); font-size:18px; }
.controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
button.ctl { font-family:inherit; font-size:15px; border-radius:8px; padding:9px 14px; cursor:pointer; border:2px solid var(--wine); background:#fff; color:var(--wine); }
button.ctl.primary { background:var(--wine); color:#fff; }
.score { margin-top:10px; font-weight:bold; color:var(--wine); min-height:20px; }
.nav { display:flex; justify-content:space-between; margin-top:14px; }
table.sum { width:100%; border-collapse:collapse; margin-top:10px; }
table.sum td, table.sum th { border-bottom:1px solid var(--line); padding:8px; text-align:left; }
footer { text-align:center; color:var(--muted); font-size:12px; padding:18px; }
@media (max-width:480px) { main { padding:10px; } .card { padding:12px; } header.app h1 { font-size:19px; } .opt { width:100%; } }

</style>
</head>
<body>
<header class="app"><h1 id="app-title"></h1><p id="app-subtitle"></p></header>
<main>
  <div class="progress" id="progress"></div>
  <div class="card" id="stage"></div>
  <div class="nav"><button class="ctl" id="back">← Back</button><button class="ctl primary" id="next">Next →</button></div>
</main>
<footer>Irvin Romo · English Teacher</footer>
<script>window.IRET_CONTENT = {"title": "So Much Stuff", "subtitle": "Level 3 · Unit 2", "activities": [{"id": "A01", "type": "mcq", "title": "Describing Your Devices", "instr": "Read the description of a device and choose the word that best describes its condition or features.", "items": [{"q": "My phone is old and slow. It has no new features. Which word best describes it?", "options": ["brand new", "outdated", "fancy", "special"], "answer": "outdated", "hint": "Think about technology that is no longer modern."}]}, {"id": "A02", "type": "match", "title": "Tech Terms Match", "instr": "Match each definition to the correct technology term. Select an answer from the dropdown for each item, then click Check.", "items": [{"left": "An electronic tool used for a specific purpose, such as a phone or tablet.", "answer": "device", "hint": "This word is often paired with 'smart' or 'mobile'."}, {"left": "Space on a device for saving files", "answer": "storage", "hint": "Digital capacity"}, {"left": "To update data across devices automatically", "answer": "sync", "hint": "Often happens when you connect to Wi-Fi"}]}, {"id": "A03", "type": "cards", "title": "Possession Vocabulary Cards", "instr": "Flip each card to reveal the word, definition, and example. Use these terms to describe your possessions' condition and age.", "items": [{"word": "brand new", "ipa": "UK /ˌbrænd ˈnjuː/", "definition": "completely new; never used before", "example": "I bought a brand new phone yesterday."}, {"word": "damaged", "ipa": "UK /ˈdæm.ɪdʒd/", "definition": "broken or not working well because of an accident or rough use", "example": "My phone screen is damaged after I dropped it."}, {"word": "outdated", "ipa": "UK /ˌaʊtˈdeɪ.tɪd/", "definition": "no longer modern or useful because it is old", "example": "My phone is outdated; it cannot run the new apps."}]}, {"id": "A04", "type": "gap", "title": "Present Perfect Practice", "instr": "Complete the sentences about your devices using ever, never, for, since, already, or yet.", "items": [{"q": "Have you ___ tried syncing your new device to the cloud?", "answers": ["ever"], "hint": "Use this word in questions about life experiences."}, {"q": "I have ___ owned a fancy device.", "answers": ["never"], "hint": "Use the word for 'not at any time'."}, {"q": "I have had this modern device ___ two years.", "answers": ["for"], "hint": "Use the preposition that indicates a duration of time."}, {"q": "I have owned this modern device ___ I bought it last year.", "answers": ["since"], "hint": "Use this word to indicate the starting point of a duration."}, {"q": "I have ___ synced my new device to the cloud, so all my files are safe.", "answers": ["already"], "hint": "Place this adverb before the past participle to show an action is complete."}, {"q": "Have you tried syncing your new device with the cloud ___?", "answers": ["yet"], "hint": "This word is used at the end of questions to ask if something has happened up to now."}]}, {"id": "A05", "type": "order", "title": "Sync Your Device", "instr": "Arrange the words to form a complete question using a topic-switching phrase and the present perfect with 'already'.", "items": [{"tiles": ["By the way,", "have you already synced", "your new device?"], "answer": "By the way, have you already synced your new device?", "hint": "Start with the topic switcher, then form a question using present perfect."}]}, {"id": "A06", "type": "listening", "title": "Listening: Tech Talk", "instr": "Listen to the audio. Choose one option for each question about phone features and folder experiences, then click Check.", "items": [{"q": "What is the main reason Speaker A is excited about their new phone?", "options": ["It has a modern design and plenty of storage space.", "It is an outdated model that works perfectly.", "It is a plain device with very little memory.", "It is a damaged phone that needs repair."], "answer": "It has a modern design and plenty of storage space.", "hint": "Focus on the positive adjectives used to describe the phone's features in the conversation."}, {"q": "What past experience does Speaker B mention?", "options": ["Moving folders on a device", "Syncing photos to the cloud", "Deleting old applications", "Buying a brand new phone"], "answer": "Moving folders on a device", "hint": "Focus on what action B has done previously, not what A still needs to do."}], "audio": {"label": "Audio", "url": "media/L3U2-A01_phone-dialogue.wav", "kind": "file", "transcript": "A: Guess what! I finally bought a new phone.\nB: Really? What’s it like?\nA: It’s a modern model with a lot of storage.\nB: Have you synced your photos yet?\nA: Not yet. I haven’t had time. By the way, do you know how to move folders?\nB: Yes, I’ve done it before. It’s easy.\nA: Great, thanks. Anyway, I need to delete some old apps — my home screen is full!"}}, {"id": "A07", "type": "writing", "title": "Phone & Device Chat", "instr": "Describe your phone's condition or age. Then, use 'Before I forget,' to ask a complete question about another device you have tried using.", "items": [{"prompt": "Write a short message to a friend about your phone. Describe its condition or age. Then, use the exact phrase 'Before I forget,' followed by a complete question about another device you have tried using.", "checklist": ["Describes phone condition/age with detail", "Uses present perfect (already/yet) correctly", "Includes exact phrase 'Before I forget,'", "Follows phrase with complete question about another device"], "model": "My phone is in good condition but it is an older model. I haven't synced my new tablet yet. Before I forget, have you ever tried syncing files between two devices?"}]}, {"id": "A08", "type": "speaking", "title": "Possessions and Tech Talk", "instr": "Describe a possession using an adjective for condition or style. Use 'already' or 'yet' with the present perfect to discuss your experience with it. Then, switch topics naturally and ask a complete question about technology.", "items": [{"prompt": "Tell me about a possession you have. Use an adjective for its condition or style. Then, use 'already' or 'yet' with the present perfect to talk about using it. Finally, switch topics and ask a question about technology.", "checklist": ["Describes a possession with a precise adjective (e.g., brand new, damaged).", "Uses present perfect with 'already' or 'yet'.", "Switches topic naturally and asks a complete question."], "model": "I have a fancy phone. I have already synced my contacts. By the way, does your device work well?", "seconds": 60}]}]};</script>
<script>
/* IRET Practice App Engine v1 — static, no network/AI at runtime.
   Content: window.IRET_CONTENT = {title, subtitle, activities:[{id, type, title, instr, audio?, items:[...]}]}
   Checkable types: mcq, gap, order, match, listening (mcq items under an audio player).
   Open types (model reveal, not scored): cards, writing, speaking.
   Item formats:
     mcq/listening: {q, options:[...], answer, hint}
     gap:           {q:'text with ___', answers:['accepted', ...], hint}
     order:         {tiles:[...], answer:'tile tile tile', hint}
     match:         {left, answer, options?:[...]}  (options default = all answers of the activity)
     cards:         {word, ipa, definition, example}
     writing:       {prompt, checklist:[...], model, minWords?}
     speaking:      {prompt, seconds, checklist:[...], model}
   audio: {label, url, kind:'link'|'file'} — 'link' opens a verified Drive file (student account); 'file' plays inline. */
(function () {
  'use strict';
  const C = window.IRET_CONTENT, ACTS = C.activities;
  const CHECKABLE = new Set(['mcq', 'gap', 'order', 'match', 'listening']);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const norm = s => String(s).toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, ' ').replace(/[.!?]+$/, '').trim();
  function seeded(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; }; }
  function shuffle(arr, key) { const r = seeded(key), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const fresh = a => ({answers: a.items.map(() => a.type === 'order' ? [] : (a.type === 'gap' ? '' : null)), checked: false, revealed: false, transcriptRevealed: false, hints: false, score: null, flipped: {}, notes: a.items.map(() => '')});
  const state = ACTS.map(fresh);
  let current = 0, finished = false;
  const stage = document.getElementById('stage');
  document.getElementById('app-title').textContent = C.title;
  document.getElementById('app-subtitle').textContent = C.subtitle;
  document.title = C.title;

  function matchOptions(a, it) { return it.options || shuffle([...new Set(a.items.map(x => x.answer))], a.id + 'm'); }
  function tilesFor(a, i) { return shuffle(a.items[i].tiles, a.id + i); }
  function tileOrder(tiles, answer) {
    const out = [], used = new Set(); let rest = answer;
    while (rest.length) { const k = tiles.findIndex((t, j) => !used.has(j) && (rest === t || rest.startsWith(t + ' '))); if (k < 0) return out; out.push(k); used.add(k); rest = rest.slice(tiles[k].length).trimStart(); }
    return out;
  }
  function isCorrect(a, s, i) {
    const it = a.items[i];
    if (a.type === 'mcq' || a.type === 'listening') return s.answers[i] === it.answer;
    if (a.type === 'gap') return it.answers.some(x => norm(x) === norm(s.answers[i] || ''));
    if (a.type === 'order') { const t = tilesFor(a, i); return s.answers[i].map(k => t[k]).join(' ') === it.answer; }
    if (a.type === 'match') return s.answers[i] === it.answer;
    return false;
  }
  const rightAnswer = (a, i) => a.type === 'gap' ? a.items[i].answers[0] : a.items[i].answer;
  const countCorrect = (a, s) => a.items.reduce((n, _, i) => n + (isCorrect(a, s, i) ? 1 : 0), 0);
  const scoreText = (n, t) => `Score: ${n} / ${t}` + (n === t ? ' — excellent!' : '');

  function audioHTML(au, s) {
    if (!au) return '';
    const canReveal = s.checked || s.revealed;
    const media = au.kind === 'file'
      ? `<audio controls preload="none" src="${esc(au.url)}"></audio>`
      : `<a class="listen" href="${esc(au.url)}" target="_blank" rel="noopener">Listen</a>`;
    const transcript = au.transcript
      ? `<button class="ctl transcript-toggle" id="transcript" type="button" aria-expanded="${s.transcriptRevealed}" ${canReveal ? '' : 'disabled'}>${s.transcriptRevealed ? 'Hide transcript' : 'Show transcript'}</button><div class="transcript"${s.transcriptRevealed ? '' : ' hidden'}>${esc(au.transcript)}</div>`
      : '';
    return `<div class="audio">🎧 <strong>${esc(au.label)}</strong>${media}${transcript}</div>`;
  }

  function itemHTML(a, s, it, i) {
    const hint = it.hint && !s.checked ? `<div class="hint">Hint: ${esc(it.hint)}</div>` : '';
    if (a.type === 'mcq' || a.type === 'listening') {
      const opts = shuffle(it.options, a.id + i);
      return `<div class="item" data-i="${i}"><div class="q">${i + 1}. ${esc(it.q)}</div><div class="opts">${opts.map(o => `<button class="opt${s.answers[i] === o ? ' sel' : ''}" data-v="${encodeURIComponent(o)}">${esc(o)}</button>`).join('')}</div>${hint}<div class="fb"></div></div>`;
    }
    if (a.type === 'gap') return `<div class="item" data-i="${i}"><div class="q">${i + 1}. ${esc(it.q)}</div><input class="gap" aria-label="answer ${i + 1}" value="${esc(s.answers[i])}">${hint}<div class="fb"></div></div>`;
    if (a.type === 'order') {
      const tiles = tilesFor(a, i), used = s.answers[i];
      return `<div class="item" data-i="${i}"><div class="q">${i + 1}.</div><div class="tiles">${tiles.map((w, k) => `<button class="tile${used.includes(k) ? ' used' : ''}" data-k="${k}">${esc(w)}</button>`).join('')}</div><div class="answerline">${used.map(k => `<button class="tile placed" data-k="${k}">${esc(tiles[k])}</button>`).join('')}</div>${hint}<div class="fb"></div></div>`;
    }
    if (a.type === 'match') return `<div class="item" data-i="${i}"><div class="matchrow"><div class="left q">${i + 1}. ${esc(it.left)}</div><select class="match" aria-label="match ${i + 1}"><option value="">— choose —</option>${matchOptions(a, it).map(o => `<option${s.answers[i] === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></div>${hint}<div class="fb"></div></div>`;
    if (a.type === 'writing' || a.type === 'speaking') {
      const timer = a.type === 'speaking' ? `<div class="timer" data-secs="${it.seconds || 60}">⏱ ${it.seconds || 60} s</div><div class="controls"><button class="ctl timerbtn">Start timer</button></div>` : '';
      const box = a.type === 'writing' ? `<textarea aria-label="your answer ${i + 1}" placeholder="Write here…">${esc(s.notes[i])}</textarea><div class="tap wc">0 words</div>` : '';
      return `<div class="item open" data-i="${i}"><div class="q">${i + 1}. ${esc(it.prompt)}</div>${timer}${box}<div class="checklist">${(it.checklist || []).map((c, k) => `<label><input type="checkbox" data-k="${k}"> ${esc(c)}</label>`).join('')}</div><div class="model"><strong>Possible model</strong>\n${esc(it.model)}</div></div>`;
    }
    return '';
  }

  function render() {
    renderProgress();
    if (finished) return renderSummary();
    const a = ACTS[current], s = state[current];
    let html = `<h2>${current + 1}. ${esc(a.title)}</h2><p class="instr">${esc(a.instr)}</p>${audioHTML(a.audio, s)}`;
    if (a.type === 'cards') html += `<div class="cards">${a.items.map((it, i) => `<div class="vcard${s.flipped[i] ? ' flipped' : ''}" data-i="${i}" tabindex="0"><div class="w">${esc(it.word)}</div><div class="ipa">${esc(it.ipa || '')}</div><div class="tap">Tap to see the meaning</div><div class="back"><div>${esc(it.definition)}</div><p><em>${esc(it.example)}</em></p></div></div>`).join('')}</div>`;
    else html += `<div class="items${s.hints ? ' showhints' : ''}${s.revealed ? ' revealed' : ''}" data-activity="${esc(a.id)}">${a.items.map((it, i) => itemHTML(a, s, it, i)).join('')}</div>`;
    if (CHECKABLE.has(a.type)) html += `<div class="controls"><button class="ctl" id="hint">Hint</button><button class="ctl primary" id="check">Check</button><button class="ctl" id="show">Show answers</button><button class="ctl" id="retry">Try again</button></div><div class="score" id="score">${s.score !== null ? scoreText(s.score, a.items.length) : ''}</div>`;
    else if (a.type !== 'cards') html += `<div class="controls"><button class="ctl primary" id="reveal">${s.revealed ? 'Hide model' : 'Show model'}</button><button class="ctl" id="retry">Start again</button></div>`;
    stage.innerHTML = html;
    if (s.checked) paintCheck(a, s);
    bind(a, s);
    document.getElementById('back').disabled = current === 0;
    document.getElementById('next').textContent = current === ACTS.length - 1 ? 'Finish ✓' : 'Next →';
  }

  function renderProgress() {
    const p = document.getElementById('progress');
    p.innerHTML = ACTS.map((a, i) => `<button class="dot${i === current && !finished ? ' active' : ''}${state[i].checked || state[i].revealed ? ' done' : ''}" data-go="${i}" title="${esc(a.title)}">${i + 1}</button>`).join('');
    p.querySelectorAll('.dot').forEach(d => d.onclick = () => { finished = false; current = +d.dataset.go; render(); });
  }

  function bind(a, s) {
    const reset = () => { s.checked = false; s.score = null; s.transcriptRevealed = false; };
    stage.querySelectorAll('.opt').forEach(b => b.onclick = () => { s.answers[+b.closest('.item').dataset.i] = decodeURIComponent(b.dataset.v); reset(); render(); });
    stage.querySelectorAll('input.gap').forEach(inp => inp.oninput = () => { s.answers[+inp.closest('.item').dataset.i] = inp.value; reset(); const sc = document.getElementById('score'); if (sc) sc.textContent = ''; inp.closest('.item').classList.remove('correct', 'wrong'); });
    stage.querySelectorAll('select.match').forEach(sel => sel.onchange = () => { s.answers[+sel.closest('.item').dataset.i] = sel.value || null; reset(); render(); });
    stage.querySelectorAll('.tiles .tile').forEach(b => b.onclick = () => { const i = +b.closest('.item').dataset.i, k = +b.dataset.k; if (!s.answers[i].includes(k)) s.answers[i].push(k); reset(); render(); });
    stage.querySelectorAll('.answerline .tile').forEach(b => b.onclick = () => { const i = +b.closest('.item').dataset.i, k = +b.dataset.k; s.answers[i] = s.answers[i].filter(x => x !== k); reset(); render(); });
    stage.querySelectorAll('.vcard').forEach(c => c.onclick = c.onkeydown = e => { if (e.type === 'keydown' && e.key !== 'Enter') return; const i = +c.dataset.i; s.flipped[i] = !s.flipped[i]; s.revealed = Object.keys(s.flipped).length === a.items.length; render(); });
    stage.querySelectorAll('textarea').forEach(t => { const upd = () => { const i = +t.closest('.item').dataset.i; s.notes[i] = t.value; t.parentElement.querySelector('.wc').textContent = (t.value.trim() ? t.value.trim().split(/\s+/).length : 0) + ' words'; }; t.oninput = upd; upd(); });
    stage.querySelectorAll('.timerbtn').forEach(b => b.onclick = () => { const el = b.closest('.item').querySelector('.timer'); let left = +el.dataset.secs; clearInterval(el._t); el.textContent = `⏱ ${left} s`; el._t = setInterval(() => { left--; el.textContent = left > 0 ? `⏱ ${left} s` : '⏱ Time!'; if (left <= 0) clearInterval(el._t); }, 1000); });
    const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
    on('hint', () => { s.hints = !s.hints; render(); });
    on('check', () => { s.checked = true; s.score = countCorrect(a, s); render(); });
    on('show', () => { a.items.forEach((it, i) => { s.answers[i] = a.type === 'gap' ? it.answers[0] : a.type === 'order' ? tileOrder(tilesFor(a, i), it.answer) : it.answer; }); s.revealed = true; s.checked = true; s.score = countCorrect(a, s); render(); });
    on('retry', () => { state[current] = fresh(a); render(); });
    on('reveal', () => { s.revealed = !s.revealed; render(); });
    on('transcript', () => { if (s.checked || s.revealed) { s.transcriptRevealed = !s.transcriptRevealed; render(); } });
  }

  function paintCheck(a, s) {
    stage.querySelectorAll('.item').forEach(el => {
      const i = +el.dataset.i, ok = isCorrect(a, s, i);
      const v = s.answers[i], empty = v === null || v === '' || (Array.isArray(v) && !v.length);
      el.classList.add(ok ? 'correct' : 'wrong');
      const message = ok ? 'Correct!' : (empty ? 'Answer this one.' : 'Not yet.');
      const item = a.items[i];
      const explanation = item.hint ? ' ' + item.hint : '';
      const answer = s.revealed ? ' Answer: ' + rightAnswer(a, i) : '';
      el.querySelector('.fb').textContent = message + explanation + answer;
    });
  }

  function renderSummary() {
    const rows = ACTS.map((a, i) => { const s = state[i]; const r = CHECKABLE.has(a.type) ? (s.score === null ? 'not checked' : `${s.score} / ${a.items.length}`) : (s.revealed ? 'done' : 'not done'); return `<tr><td>${i + 1}. ${esc(a.title)}</td><td>${r}</td></tr>`; }).join('');
    const tot = ACTS.reduce((n, a, i) => n + (CHECKABLE.has(a.type) && state[i].score !== null ? state[i].score : 0), 0);
    const max = ACTS.reduce((n, a) => n + (CHECKABLE.has(a.type) ? a.items.length : 0), 0);
    stage.innerHTML = `<h2>Well done!</h2><p class="instr">Your results:</p><table class="sum"><tr><th>Activity</th><th>Result</th></tr>${rows}</table><p class="score">Total: <span id="total">${tot} / ${max}</span></p><div class="controls"><button class="ctl primary" id="restart">Start again</button></div>`;
    document.getElementById('restart').onclick = () => { ACTS.forEach((a, i) => state[i] = fresh(a)); finished = false; current = 0; render(); };
    document.getElementById('next').textContent = 'Finish ✓';
  }

  document.getElementById('back').onclick = () => { if (finished) { finished = false; } else if (current > 0) current--; render(); };
  document.getElementById('next').onclick = () => { if (current < ACTS.length - 1) { current++; } else { finished = true; } render(); };
  window.IRET_ENGINE = {version: '1.0.0', state, tileOrder, tilesFor: i => tilesFor(ACTS[current], i), goto: i => { finished = false; current = i; render(); }};
  render();
})();

</script>
</body>
</html>
