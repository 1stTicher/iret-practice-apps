function clock(){return `${pad(Math.floor(state.active/60))}:${pad(Math.floor(state.active%60))}`}
const icon=`<svg viewBox="0 0 230 230" aria-label="Mascota de estudio, una estrella exploradora" role="img"><circle cx="115" cy="114" r="92" fill="#f1e7ff"/><path d="M115 20l28 58 64 9-46 45 10 64-56-30-57 30 11-64-46-45 63-9z" fill="#ffd36b" stroke="#b97a25" stroke-width="5" stroke-linejoin="round"/><circle cx="91" cy="111" r="8" fill="#244d62"/><circle cx="137" cy="111" r="8" fill="#244d62"/><path d="M97 137q18 18 36 0" fill="none" stroke="#244d62" stroke-width="6" stroke-linecap="round"/><path d="M45 173l-17 19m147-21l20 18" stroke="#6971bc" stroke-width="6" stroke-linecap="round"/></svg>`;
function art(mi){const m=MODULES[mi];if(mi===2)return `<div class="art"><svg viewBox="0 0 570 175" role="img" aria-label="Fracciones coloreadas de 1/2 y 1/4"><circle cx="150" cy="85" r="64" fill="#ffdf9a" stroke="#175671" stroke-width="3"/><path d="M150 21 A64 64 0 0 0 150 149 Z" fill="#f48a54"/><line x1="150" y1="21" x2="150" y2="149" stroke="#175671" stroke-width="3"/><text x="132" y="167" font-size="16" fill="#173a4d">1/2</text><circle cx="410" cy="85" r="64" fill="#ffdf9a" stroke="#175671" stroke-width="3"/><path d="M410 85L410 21A64 64 0 0 1 474 85 Z" fill="#f48a54"/><path d="M410 21V149M346 85H474" stroke="#175671" stroke-width="3"/><text x="392" y="167" font-size="16" fill="#173a4d">1/4</text></svg><div class="small">Comparar fracciones es más fácil con dibujos del mismo entero.</div></div>`;
if(mi===4)return `<div class="art"><svg viewBox="0 0 560 175" role="img" aria-label="Gráfica de barras de libros leídos"><text x="10" y="19" fill="#355d72" font-size="16" font-weight="bold">Libros leídos por grupo</text>${[12,9,15,6].map((v,i)=>`<rect x="${75+i*112}" y="${150-v*7}" width="62" height="${v*7}" fill="${['#42b5a9','#f2ad52','#69a2d2','#b995e9'][i]}" rx="5"/><text x="${89+i*112}" y="165" fill="#315366" font-size="15">${'ABCD'[i]}</text><text x="${92+i*112}" y="${144-v*7}" fill="#173a4d" font-size="13">${v}</text>`).join('')}</svg></div>`;
if(mi===5)return `<div class="art"><svg viewBox="0 0 560 160" role="img" aria-label="Esquema de cadena alimentaria"><circle cx="90" cy="78" r="40" fill="#a6d884"/><text x="48" y="81" font-size="23">🌿</text><text x="52" y="140" font-size="15" fill="#315366">Planta</text><path d="M143 78H226" stroke="#156e8d" stroke-width="5"/><path d="M226 78l-14-8v16z" fill="#156e8d"/><circle cx="289" cy="78" r="40" fill="#ffdfa0"/><text x="262" y="87" font-size="26">🦗</text><text x="248" y="140" font-size="15" fill="#315366">Consumidor</text><path d="M336 78H424" stroke="#156e8d" stroke-width="5"/><path d="M424 78l-14-8v16z" fill="#156e8d"/><circle cx="476" cy="78" r="40" fill="#c5e2ef"/><text x="458" y="86" font-size="23">🐦</text></svg><div class="small">Las flechas muestran hacia dónde pasa la energía al alimentarse.</div></div>`;
if(mi===6)return `<div class="art"><svg viewBox="0 0 550 165" role="img" aria-label="Rosa de los vientos N, S, E y O"><circle cx="270" cy="85" r="65" fill="#e8f5ff" stroke="#83b4d0" stroke-width="2"/><path d="M270 26L254 85 270 76 286 85Z" fill="#ed8c61"/><path d="M270 144L254 85 270 96 286 85Z" fill="#81c3bd"/><path d="M211 85L270 69 261 85 270 101Z" fill="#b4a0e7"/><path d="M329 85L270 69 279 85 270 101Z" fill="#f6cc72"/><text x="264" y="16" font-weight="900" fill="#173a4d">N</text><text x="265" y="163" font-weight="900" fill="#173a4d">S</text><text x="191" y="91" font-weight="900" fill="#173a4d">O</text><text x="344" y="91" font-weight="900" fill="#173a4d">E</text></svg></div>`;
return `<div class="art"><div style="font-weight:800;color:#36778c">${escapeHtml(m.emoji)} Observa, comprende, escribe y comprueba: cada acierto es un avance.</div></div>`}
function navHome(){view='home';message='';hintShown=false;render()}
function navExercise(){view='exercise';message='';hintShown=false;justCorrect=false;render()}
function stats(){return `<div class="stats"><div class="stat">🎯 ${state.i}/96 respuestas correctas</div><div class="stat">⏱️ ${clock()} de 30:00 mínimo</div><div class="stat">🛠️ ${Object.keys(state.wrong).length} temas con correcciones</div></div>`}
function home(){return `<section class="card hero"><div><div class="eyebrow">Entrenamiento interactivo · 6.º de primaria</div><h1>¡Conquista los retos de noviembre!</h1><p>96 retos originales. Cada respuesta se <b>escribe</b> y el siguiente reto solo se abre cuando la respuesta es correcta. Sin inglés: ese examen ya pasó.</p><div class="actions"><button class="btn" id="start">${state.i?'Continuar mi misión':'Comenzar los desafíos'}</button><button class="btn secondary" id="report">Mi progreso</button></div></div><div class="mascot">${icon}</div></section>${stats()}<div class="alert">🔎 <b>Guía predictiva, no temario oficial.</b> Basada en contenidos de Fase 5 (SEP). No sabemos qué asignatura toca cada día. El objetivo es practicar de manera amplia sin confundir una predicción con un aviso de la escuela.</div><h2>Las ocho estaciones</h2><div class="grid">${MODULES.map((m,mi)=>`<div class="card mission ${mi>Math.floor(state.i/12)?'locked':''}"><div class="emoji">${m.emoji}</div><h3>${escapeHtml(m.title)}</h3><p>${escapeHtml(m.subtitle)}</p><span>${Math.max(0,Math.min(12,state.i-mi*12))}/12 retos</span></div>`).join('')}</div><div class="alert">🧠 <b>Consejo:</b> si te equivocas, lee la pista, razona y corrige. No importa que tardes: importa que aprendas.</div>`}
function exercise(){if(state.i>=ALL.length)return finish();const q=ALL[state.i],m=MODULES[q.mi],p=(state.i/ALL.length*100).toFixed(2);return `<div class="main"><aside class="card sidebar"><h3>Estaciones</h3>${MODULES.map((x,mi)=>`<div class="step ${mi===q.mi?'active':''} ${mi<q.mi?'complete':''} ${mi>q.mi?'lock':''}"><span>${x.emoji}</span><span>${escapeHtml(x.title)}<br><small>${mi<q.mi?'Completada':mi===q.mi?`${q.qi+1}/12`:'Bloqueada'}</small></span></div>`).join('')}</aside><section><button class="btn secondary" id="backHome" style="padding:8px 13px;box-shadow:none">← Inicio</button><div class="card qcard"><div class="eyebrow">${m.emoji} Estación ${q.mi+1}/8 · Reto ${q.qi+1}/12</div><div class="progress" role="progressbar" aria-label="Avance" aria-valuenow="${state.i}" aria-valuemin="0" aria-valuemax="96"><span style="width:${p}%"></span></div><div class="small">Respuesta ${state.i+1} de 96 · Tiempo activo ${clock()}</div>${q.qi===0&&m.passage?`<div class="passage">${escapeHtml(m.passage)}</div>`:''}${q.mi===0?`<details style="margin-top:10px"><summary style="color:#13709b;font-weight:750;cursor:pointer">Volver a leer el texto del arroyo</summary><div class="passage">${escapeHtml(m.passage)}</div></details>`:''}${q.mi===4?`<details style="margin-top:10px"><summary style="color:#13709b;font-weight:750;cursor:pointer">Ver datos de la encuesta</summary><div class="passage">${escapeHtml(m.passage)}</div></details>`:''}${art(q.mi)}<h2 class="qtitle">${escapeHtml(q.q)}</h2><div class="answer"><input id="answer" type="text" autocomplete="off" inputmode="${/^[0-9]/.test(q.a)?'decimal':'text'}" placeholder="Escribe tu respuesta aquí" value="${escapeHtml(currentInput)}" ${justCorrect?'disabled':''} aria-label="Escribe tu respuesta correcta"><button class="btn" id="check" ${justCorrect?'disabled':''}>Comprobar</button></div>${message?`<div class="feed ${justCorrect?'good':''}" role="status">${message}</div>`:''}${hintShown&&!justCorrect?`<div class="hint"><b>Pista:</b> ${escapeHtml(q.hint)}</div>`:''}<div class="actions after"><button class="btn secondary" id="hint" ${justCorrect?'disabled':''}>💡 Necesito una pista</button><button class="btn" id="next" ${justCorrect?'':'disabled'}>${state.i===95?'Terminar retos':'Siguiente reto →'}</button></div><p class="small" style="margin-top:17px">No hay botón de saltar. Revisa, escribe y corrige para avanzar. No se castigan los intentos.</p></div></section></div>`}
function finish(){let timeok=state.active>=MIN_TIME;return `<div class="card finish"><div class="big">${timeok?'🏆':'🌟'}</div><h1>${timeok?'¡Misión completada!':'¡96 retos resueltos!'}</h1><p>${timeok?'Completaste el reto de práctica escrita.':'¡Muy bien! Para cerrar tu reto faltan '+Math.ceil((MIN_TIME-state.active)/60)+' minutos de estudio activo. Revisa las pistas y escribe una reflexión sobre lo que más aprendiste.'}</p>${stats()}<div class="actions" style="justify-content:center"><button class="btn" id="report">Ver mi reporte</button><button class="btn secondary" id="home">Volver al inicio</button></div><p class="small">Tiempo mínimo de práctica para recibir la insignia final: 30 minutos. El cronómetro solo avanza cuando esta pestaña está visible y activa.</p></div><div class="card reflections"><h2>Lo que aprendí</h2><p>Escribe dos ideas que recuerdes y un error que lograste corregir.</p><textarea id="reflection" placeholder="Hoy aprendí que..."></textarea><div class="actions" style="margin-top:12px"><button class="btn secondary" id="saveReflection">Guardar reflexión</button></div></div>`}
function report(){const errors=Object.entries(state.wrong).sort((a,b)=>b[1]-a[1]);return `<div class="card report"><div class="eyebrow">Avance guardado en tu dispositivo</div><h1>Mi bitácora de aprendizaje</h1>${stats()}<p>Los intentos no bajan puntos: sirven para aprender. Si una respuesta costó trabajo, vuelve a practicarla en el PDF.</p><div class="progress"><span style="width:${state.i/96*100}%"></span></div><h2>Estaciones</h2>${MODULES.map((m,i)=>`<div class="reportline">${m.emoji} ${escapeHtml(m.title)} — <b>${Math.max(0,Math.min(12,state.i-i*12))}/12</b></div>`).join('')}<h2>Errores que corregí</h2>${errors.length?errors.slice(0,20).map(([i,n])=>`<div class="reportline">${escapeHtml(ALL[Number(i)].q)} · Intentos erróneos: ${n}</div>`).join(''):'<p>Todavía no hay intentos incorrectos registrados.</p>'}<div class="actions" style="margin-top:24px"><button class="btn" id="continue">Seguir estudiando</button><button class="btn secondary" onclick="window.print()">Imprimir reporte</button></div><div class="alert" style="margin-top:20px">El avance no viaja a internet ni se sincroniza. Si se borran los datos del navegador, también puede perderse el progreso.</div></div>`}
function onCheck(){const q=ALL[state.i];const inp=document.getElementById('answer');if(!inp)return;const value=inp.value;currentInput=value;lastAction=Date.now();if(!value.trim()){message='✏️ Escribe algo para intentarlo. Puedes pedir una pista.';render();return}state.tries++;if([q.a,...q.also].some(a=>eq(value,a))){justCorrect=true;message='✅ ¡Correcto! '+escapeHtml(q.hint)+' Ya puedes continuar.';persist()}else{state.wrong[state.i]=(state.wrong[state.i]||0)+1;hintShown=true;message='🔍 Todavía no es esa respuesta. Revisa la pista y vuelve a intentarlo. ¡Puedes lograrlo!';persist()}render();if(!justCorrect){const el=document.getElementById('answer');if(el){el.focus();el.select()}}}
function next(){if(!justCorrect)return;state.i++;state.correct=state.i;currentInput='';hintShown=false;justCorrect=false;message='';persist();render();const el=document.getElementById('answer');if(el)el.focus()}
function render(){document.getElementById('count').textContent=`${state.i}/96`;document.getElementById('timer').textContent=`⏱️ ${clock()}`;document.getElementById('app').innerHTML=view==='home'?home():view==='report'?report():exercise();bind()}
function bind(){const on=(id,fn)=>{const x=document.getElementById(id);if(x)x.addEventListener('click',fn)};on('start',navExercise);on('backHome',navHome);on('home',navHome);on('continue',navExercise);on('report',()=>{view='report';render()});on('check',onCheck);on('next',next);on('hint',()=>{hintShown=true;lastAction=Date.now();render()});on('saveReflection',()=>{state.reflect=document.getElementById('reflection').value;persist();message='Reflexión guardada';render()});const inp=document.getElementById('answer');if(inp){inp.addEventListener('input',e=>{currentInput=e.target.value;lastAction=Date.now()});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();onCheck()}})}const ref=document.getElementById('reflection');if(ref){ref.value=state.reflect||'';ref.addEventListener('input',()=>lastAction=Date.now())}}
setInterval(()=>{const now=Date.now(),delta=Math.min((now-lastClock)/1000,3);lastClock=now;if(document.visibilityState==='visible'&&now-lastAction<180000){state.active+=delta;persist()}const t=document.getElementById('timer');if(t)t.textContent=`⏱️ ${clock()}`;if(state.i>=ALL.length&&view==='exercise'&&Math.floor(state.active)%15===0)render()},1000);
document.addEventListener('pointerdown',()=>lastAction=Date.now(),{passive:true});document.addEventListener('keydown',()=>lastAction=Date.now(),{passive:true});render();
</script></body></html>
