<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 9 — The Power of the Mind Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title":"Unit 9 — The Power of the Mind Practice App","tag":"B2 FIRST · UNIT 9","sub":"Happiness, collocations, modal verbs, reading, speaking and exam transformations","sections":[{"title":"Vocabulary in Context","hint":"Flip the card to review a useful B2 phrase.","cards":[["achieve a goal","Succeed in doing something you planned.","She achieved her goal of speaking more confidently."],["carry out research","Do a careful study or investigation.","Scientists carried out research into sleep habits."],["devote time to","Spend time on an activity that matters to you.","I devote time to reading every day."],["gain confidence","Become more sure of your abilities.","Practice helped him gain confidence."],["overcome a fear","Stop being controlled by something that frightens you.","She overcame her fear of public speaking."],["pursue happiness","Try to find or achieve happiness.","People pursue happiness in different ways."],["take part in","Join an activity.","He took part in a volunteering project."],["make progress","Improve or move closer to a goal.","She's making progress with her pronunciation."],["be capable of","Have the skill or ability to do something.","They are capable of solving the problem."],["reach a conclusion","Decide what is true after thinking carefully.","We reached a conclusion after reviewing the evidence."],["follow your passion","Spend effort doing something you care deeply about.","She followed her passion for music."],["sense of achievement","Feeling of satisfaction after succeeding.","Finishing the project gave him a sense of achievement."]]},{"title":"Collocations & Confusing Verbs","hint":"Choose the natural collocation.","qs":[["The researchers will ___ a study into what makes people happy.",["carry out","make up","reach on"],0,"Carry out research or a study means perform it."],["She ___ her ambition of becoming a pilot.",["achieved","won","made"],0,"You achieve a goal or ambition."],["I want to ___ more time to learning English.",["devote","achieve","gain"],0,"Devote time to is followed by a noun or -ing."],["Practice helped him ___ confidence before his exam.",["gain","do","arrive"],0,"Gain confidence is the standard collocation."],["She worked hard to ___ her fear of speaking in public.",["overcome","carry out","reach"],0,"Overcome a fear means deal with it successfully."],["The team finally ___ a conclusion after discussing the results.",["reached","made","carried"],0,"Reach a conclusion is a fixed collocation."],["Taking part in the competition gave her a sense of ___.",["achievement","achieving","achieve"],0,"The noun is achievement."],["You can ___ progress by practising a little every day.",["make","do","take"],0,"We say make progress, not do progress."],["They ___ an experiment to test their idea.",["carried out","achieved","devoted"],0,"Carry out an experiment means conduct it."],["Which phrase is correct?",["She's capable of managing the project.","She's capable to manage the project.","She's capable for manage the project."],0,"Capable of is followed by a noun or -ing form."]]},{"title":"Modals of Deduction","hint":"Distinguish strong certainty from possibility.","qs":[["She's been studying all night. She ___ be exhausted.",["must","can't","would"],0,"Must expresses a strong logical conclusion."],["His car is outside, so he ___ be nearby.",["might","mustn't","has to not"],0,"Might expresses possibility rather than certainty."],["That ___ be the correct address; the street number doesn't exist.",["can't","must","will"],0,"Can't expresses a strong belief that something is impossible."],["I don't know why she missed the call. She ___ have been driving.",["might","mustn't","should"],0,"Might have + past participle expresses a possible explanation for the past."],["The team won every game. They ___ have trained extremely hard.",["must","can't","would"],0,"Must have + past participle expresses a strong deduction about the past."],["He was in London that day, so he ___ have attended the meeting in Tokyo.",["can't","must","may"],0,"Can't have + past participle expresses an impossible past explanation."],["The results are uncertain. The treatment ___ work for some participants.",["may","mustn't","can't have"],0,"May signals possibility."],["The room is empty. Everyone ___ have gone home already.",["may","can't","shouldn't"],0,"May have gone is possible; the evidence doesn't prove it."],["Which form is correct?",["She could have misunderstood the question.","She could has misunderstood the question.","She could have misunderstand the question."],0,"A past modal takes have + past participle."],["You look happy. You ___ have received some good news!",["must","can't","shouldn't"],0,"Must have received is a strong deduction from the evidence."]]},{"title":"Key Word Transformations","hint":"Choose a sentence that preserves the meaning. B2 First transformations normally use 2–5 words.","qs":[["It's possible that she forgot the appointment. (MIGHT)",["She might have forgotten the appointment.","She must forgotten the appointment.","She might has forgotten the appointment."],0,"Might have forgotten expresses possibility in the past."],["I'm certain this isn't the right answer. (CAN'T)",["This can't be the right answer.","This can't to be the right answer.","This can't have to be the right answer."],0,"Can't + base verb expresses a strong negative deduction."],["They performed the investigation last month. (CARRIED)",["They carried out the investigation last month.","They carried on the investigation last month.","They carried of the investigation last month."],0,"Carry out means conduct or perform."],["He isn't able to finish this without help. (CAPABLE)",["He isn't capable of finishing this without help.","He isn't capable to finish this without help.","He isn't capable for finishing this without help."],0,"Capable of + -ing is the correct pattern."],["She succeeded in dealing with her fear. (OVERCOME)",["She managed to overcome her fear.","She managed overcoming her fear.","She managed overcome her fear."],0,"Manage to + base verb."],["Perhaps he was ill yesterday. (MAY)",["He may have been ill yesterday.","He may be ill yesterday.","He may has been ill yesterday."],0,"May have been refers to a possible past state."],["He spent most of his free time learning to play guitar. (DEVOTED)",["He devoted most of his free time to learning guitar.","He devoted most of his free time learn guitar.","He devoted most of his free time for learning guitar."],0,"Devote time to + -ing."],["I am sure she worked hard. (MUST)",["She must have worked hard.","She must worked hard.","She must has worked hard."],0,"Must have + past participle expresses a strong past deduction."]]},{"title":"Reading & Listening Strategy","hint":"B2 exam technique: choose evidence, not guesses.","qs":[["In B2 Reading Part 5, your answer should be based mainly on ___.",["evidence in the text","your personal opinion","the longest option"],0,"Find the sentence or idea that supports your choice."],["When two options sound similar, you should ___.",["compare how each matches the author's exact meaning","choose the most familiar words","guess immediately"],0,"Pay attention to meaning and paraphrase, not keywords alone."],["Before listening to B2 Part 1 recordings, you should ___.",["read the question and identify what to listen for","translate every possible word","ignore the options"],0,"Previewing the question focuses your listening."],["A speaker says 'I eventually got used to it.' Which idea is closest?",["At first it was difficult, but later it felt normal.","It was normal from the start.","The speaker never accepted it."],0,"Got used to means became accustomed to something."],["If a listening option repeats a word from the recording, it ___.",["is not necessarily correct","must be correct","cannot be correct"],0,"A repeated word can be a distractor; check meaning."],["When a question asks about a writer's attitude, focus on ___.",["evaluation, tone and supporting details","only dates and names","the first noun in the passage"],0,"Attitude is conveyed through tone and evaluation."],["After choosing a reading answer, a useful final check is ___.",["identify the textual evidence","change every answer","choose the shortest option"],0,"You should be able to justify each answer."],["For a difficult listening question, the best strategy is to ___.",["listen for the speaker's overall intention","wait for an identical phrase in the option","stop listening after one new word"],0,"Cambridge tasks often paraphrase the recording."]]},{"title":"Speaking Part 2 Toolkit","hint":"Flip each prompt and then speak for 45–60 seconds using the structure.","cards":[["Compare two photographs.","Both pictures show ___. However, in the first one ___, whereas in the second ___."],["Speculate about people's feelings.","They might be feeling ___ because ___. It's possible that ___."],["Answer an examiner's question.","I'd say ___ is more likely, mainly because ___."],["Add a contrast naturally.","Unlike the people in the first photo, those in the second seem to ___."],["Talk about happiness.","For me, happiness depends partly on ___, although ___."],["Use sentence stress.","Stress the word that changes your meaning: THEY might have made that decision."],["Extend your answer without rambling.","One reason for that might be ___. For example, ___."],["Give a final judgement.","Overall, I think ___ because ___, but the other situation could also ___."]]}]};</script><script src="../assets/app.js"></script></body></html>
