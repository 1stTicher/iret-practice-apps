<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>The Zoo · Kids 2</title><style>
:root{--wine:#6b1d2e;--gold:#c9a96e;--cream:#faf6ee;--sand:#f5f0e6;--ink:#2c1810;--green:#2e7d54;--red:#b33b3b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:18px Arial,sans-serif}
header{background:var(--wine);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}header h1{font-size:24px;margin:0}#score{color:#f5dcaa;font-weight:bold;font-size:20px}
main{max-width:820px;margin:auto;padding:16px}.bar{height:10px;border-radius:10px;background:#e9dfce;overflow:hidden;margin-bottom:16px}.bar div{height:100%;background:var(--gold);width:0;transition:width .3s}
.card{background:#fff;border:2px solid var(--gold);border-radius:22px;padding:22px;box-shadow:0 4px 16px #5a152522;text-align:center}
.game{color:var(--wine);font-size:14px;font-weight:bold;text-transform:uppercase;letter-spacing:.05em}.q{font-size:clamp(22px,5vw,30px);margin:12px 0}.big{font-size:72px;line-height:1.1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}button{font:inherit;cursor:pointer}
.opt,.w{border:2px solid #d7c6a5;background:#fff;border-radius:16px;padding:14px;font-size:20px;font-weight:bold;color:var(--ink)}.opt:hover,.w:hover{border-color:var(--wine)}
.opt.ok{background:#e8f5eb;border-color:var(--green)}.opt.no{background:#fff0ef;border-color:var(--red)}
.w{display:inline-block;margin:5px;padding:10px 14px;font-size:18px}.slot{min-height:58px;border:2px dashed var(--gold);border-radius:14px;padding:6px;margin:12px 0;background:var(--sand)}
.btn{border:0;border-radius:14px;padding:12px 20px;background:var(--wine);color:#fff;font-weight:bold;font-size:18px;margin:6px}.btn.alt{background:#fff;color:var(--wine);border:2px solid var(--wine)}
.fb{min-height:30px;font-weight:bold;margin-top:12px}.good{color:var(--green)}.bad{color:var(--red)}.hint{font-size:15px;color:#65564c;margin-top:8px}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.15)}}
</style></head><body><header><h1>The Zoo · Kids 2</h1><div id="score">⭐ 0</div></header><main><div class="bar"><div id="bar"></div></div><div class="card" id="card"></div>
<p class="hint" style="text-align:center">IRET · Irvin Romo English Training</p></main><script>
const D={"items": [{"t": "pick", "g": "Zoo animals", "e": "🦁", "q": "What animal is it?", "a": "lion", "o": ["lion", "tiger", "monkey"], "s": null}, {"t": "pick", "g": "Zoo animals", "e": "🐘", "q": "What animal is it?", "a": "elephant", "o": ["giraffe", "elephant", "hippo"], "s": null}, {"t": "pick", "g": "Zoo animals", "e": "🦒", "q": "What animal is it?", "a": "giraffe", "o": ["giraffe", "zebra", "snake"], "s": null}, {"t": "pick", "g": "Zoo animals", "e": "🐒", "q": "What animal is it?", "a": "monkey", "o": ["bear", "monkey", "penguin"], "s": null}, {"t": "pick", "g": "Zoo animals", "e": "🐧", "q": "What animal is it?", "a": "penguin", "o": ["penguin", "parrot", "crocodile"], "s": null}, {"t": "listen", "g": "Listen", "s": "crocodile", "a": "🐊 crocodile", "o": ["🐊 crocodile", "🐍 snake", "🦓 zebra"], "e": null}, {"t": "listen", "g": "Listen", "s": "zebra", "a": "🦓 zebra", "o": ["🐯 tiger", "🦓 zebra", "🦛 hippo"], "e": null}, {"t": "pick", "g": "Likes", "e": "🦁❤️🍖", "q": "The lion ___ meat.", "a": "likes", "o": ["likes", "like", "doesn't likes"], "s": null}, {"t": "pick", "g": "Doesn't like", "e": "🐒❌🥕", "q": "The monkey ___ carrots.", "a": "doesn't like", "o": ["doesn't like", "don't like", "not like"], "s": null}, {"t": "pick", "g": "I like", "e": "🙋❤️🐧", "q": "I ___ penguins.", "a": "like", "o": ["like", "likes", "liking"], "s": null}, {"t": "build", "g": "Build it", "q": "🐘❤️💧", "a": "The elephant likes water.", "e": null}, {"t": "build", "g": "Build it", "q": "🐍❌❄️", "a": "The snake doesn't like cold.", "e": null}, {"t": "build", "g": "Ask!", "q": "❓🦒", "a": "Does the giraffe like leaves?", "e": null}, {"t": "pick", "g": "Answer", "e": "🦒❤️🍃", "q": "Does the giraffe like leaves?", "a": "Yes, it does.", "o": ["Yes, it does.", "No, it doesn't.", "Yes, it like."], "s": null}, {"t": "pick", "g": "Answer", "e": "🐧❌☀️", "q": "Does the penguin like hot days?", "a": "No, it doesn't.", "o": ["Yes, it does.", "No, it doesn't.", "No, it don't."], "s": null}, {"t": "listen", "g": "My Day review", "s": "I get up at seven o'clock.", "a": "⏰ get up", "o": ["⏰ get up", "🛏️ go to bed", "🍽️ have lunch"], "e": null}, {"t": "speak", "g": "Your turn, Taleb!", "q": "🦁🐒🐧", "cue": "What is your favorite zoo animal? Why?", "model": "My favorite animal is the ___ . It likes ___ .", "e": "My favorite animal is the monkey. It likes bananas!"}, {"t": "speak", "g": "Your turn!", "q": "🍕🥦", "cue": "Tell me one food you like and one food you don't like.", "model": "I like ___ . I don't like ___ .", "e": "I like pizza. I don't like broccoli."}], "end": "Tell your teacher Irvin your favorite animal next class! 🦁"};
let i=0,stars=0,tries=0;const card=document.getElementById('card');
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function shuf(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function upd(){document.getElementById('score').textContent='⭐ '+stars;document.getElementById('bar').style.width=(i/D.items.length*100)+'%'}
function next(){i++;tries=0;render()}
function win(msg){stars+=tries===0?2:1;upd();const f=card.querySelector('.fb');f.className='fb good pop';f.textContent=(tries===0?'⭐⭐ ':'⭐ ')+msg;setTimeout(next,1300)}
function lose(){tries++;const f=card.querySelector('.fb');f.className='fb bad';f.textContent='Try again! 💪'}
function render(){upd();if(i>=D.items.length){const max=D.items.length*2;card.innerHTML=`<div class="big">🏆</div><div class="q">Great job!</div><p>You got <b>${stars}</b> of ${max} stars.</p><p>${D.end}</p><button class="btn" onclick="i=0;stars=0;tries=0;render()">Play again</button>`;return}
const it=D.items[i];
if(it.t==='pick'||it.t==='listen'){const opts=shuf(it.o);card.innerHTML=`<div class="game">${it.g}</div>${it.e?`<div class="big">${it.e}</div>`:''}<div class="q">${it.t==='listen'?'🔊 Listen and choose':it.q}</div>${it.t==='listen'?`<button class="btn alt" id="pl">▶ Play</button>`:''}<div class="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div><div class="fb"></div>`;
 if(it.t==='listen'){const p=()=>say(it.s);document.getElementById('pl').onclick=p;setTimeout(p,300)}
 card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.textContent===it.a){b.classList.add('ok');say(it.s||it.a);win(it.ok||'Correct!')}else{b.classList.add('no');lose()}})}
else if(it.t==='build'){const words=it.a.split(' ');let pool=shuf(words.map((w,k)=>({w,k})));let built=[];
 card.innerHTML=`<div class="game">${it.g}</div>${it.e?`<div class="big">${it.e}</div>`:''}<div class="q">${it.q}</div><div class="slot" id="slot"></div><div id="pool"></div><div><button class="btn alt" id="clr">↺ Clear</button><button class="btn" id="chk">Check</button></div><div class="fb"></div>`;
 const draw=()=>{document.getElementById('slot').innerHTML=built.map(x=>`<span class="w">${x.w}</span>`).join('');document.getElementById('pool').innerHTML=pool.map((x,k)=>`<button class="w" data-k="${k}">${x.w}</button>`).join('');document.querySelectorAll('#pool .w').forEach(b=>b.onclick=()=>{built.push(pool.splice(+b.dataset.k,1)[0]);draw()})};draw();
 document.getElementById('clr').onclick=()=>{pool=pool.concat(built);built=[];draw()};
 document.getElementById('chk').onclick=()=>{if(built.map(x=>x.w).join(' ')===it.a){say(it.a);win('Perfect sentence!')}else{lose();pool=pool.concat(built);built=[];draw()}}}
else if(it.t==='speak'){card.innerHTML=`<div class="game">${it.g}</div>${it.e?`<div class="big">${it.e}</div>`:''}<div class="q">${it.q}</div><p class="hint">Say it out loud! Need help?</p><button class="btn alt" id="h">💡 Help</button><button class="btn alt" id="m">🔊 Example</button><p id="hx" class="hint"></p><button class="btn" id="d">I said it! ✅</button><div class="fb"></div>`;
 document.getElementById('h').onclick=()=>{tries=1;document.getElementById('hx').textContent=it.cue};document.getElementById('m').onclick=()=>{tries=1;document.getElementById('hx').textContent=it.model;say(it.model)};document.getElementById('d').onclick=()=>win('Awesome speaking!')}}
render();
</script></body></html>
