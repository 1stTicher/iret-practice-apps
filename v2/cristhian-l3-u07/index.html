<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 7 — Entertain Us Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title":"Unit 7 — Entertain Us Practice App","tag":"LEVEL 3 · UNIT 7","sub":"Music, movies, used to, comparisons and polite invitations","sections":[{"title":"Entertainment Words","hint":"Tap a card to see the meaning and a natural example.","cards":[["classical","Music played by an orchestra, often without singing.","My sister likes classical music when she studies."],["country","A music style often featuring stories and guitars.","My parents used to listen to country music."],["folk","Traditional music from a place or culture.","The festival had folk music from Veracruz."],["heavy metal","Very loud rock music with powerful guitars.","Heavy metal isn't as relaxing as jazz."],["hip-hop","Music with strong beats, often featuring rap.","My friend is really into hip-hop."],["jazz","Music with improvisation and unusual rhythms.","I heard a jazz band at the café."],["reggae","Music with a relaxed rhythm, originally from Jamaica.","We listened to reggae on our trip."],["documentary","A film or show about facts or real events.","I watched a documentary about the ocean."],["science fiction","Stories about imagined technology or future worlds.","This science-fiction series is as exciting as the movie."],["sitcom","A funny television series about everyday situations.","I used to watch a sitcom after dinner."]]},{"title":"Past Habits — Used To","hint":"Choose the sentence that describes a habit in the past.","qs":[["When I was younger, I ___ pop music every day.",["used to listen to","use to listened to","was used listen"],0,"Used to + base verb describes a past habit."],["I didn't ___ jazz, but now I love it.",["use to like","used to liked","used liking"],0,"After didn't, use 'use to + base verb'."],["___ to watch cartoons on Saturday mornings?",["Did you use","Did you used","Do you used"],0,"Questions: Did + subject + use to + base verb."],["My brother ___ a lot of heavy metal, but not anymore.",["used to play","use to played","would used play"],0,"Used to describes something that changed."],["We ___ online movies when we were children; we watched DVDs.",["didn't use to stream","didn't used to streaming","weren't used to stream"],0,"Negative past habit: didn't use to."],["Which sentence is correct?",["I used to enjoy horror films.","I used to enjoying horror films.","I use to enjoyed horror films."],0,"Used to is followed by the base form."],["I ___ documentaries before, but now I watch them often.",["didn't use to watch","wasn't use to watching","didn't used watching"],0,"Use 'didn't use to' for an old habit that changed."],["My friends used to ___ at my house for movie nights.",["meet","met","meeting"],0,"Used to + base verb: meet."]]},{"title":"Movie Comparisons","hint":"Use (not) as + adjective + as for comparisons.","qs":[["This comedy is ___ the one we watched yesterday.",["as funny as","as funny than","so funny than"],0,"As + adjective + as compares two things."],["The sequel isn't ___ the first film.",["as good as","as better as","so good than"],0,"Not as good as means less good."],["Is the documentary ___ the trailer?",["as interesting as","as interested than","more interesting as"],0,"As + adjective + as works in questions, too."],["I don't watch ___ horror films as my cousin.",["as many","as much","as more"],0,"Use as many with plural countable nouns."],["I don't spend ___ time watching TV as I used to.",["as much","as many","as more"],0,"Use as much with uncountable time."],["The second episode is ___ the first one.",["as long as","so long than","as longer as"],0,"Do not add -er between the two as words."],["A science-fiction movie isn't always ___ a horror movie.",["as scary as","as scarier than","so scary than"],0,"The comparison is 'as scary as'."],["Which sentence is correct?",["This show isn't as exciting as the book.","This show isn't exciting as the book.","This show isn't more exciting as the book."],0,"The negative comparison needs 'not as ... as'."]]},{"title":"Invitations and Refusals","hint":"Choose polite, natural language.","qs":[["A: Do you want to see a movie tonight? B: ___",["I'd love to, but I already have plans.","I no can go.","No, you are wrong."],0,"A polite refusal starts positively and gives a short reason."],["A: Sorry, I can't make it. B: ___",["No problem. Maybe next time.","You must come.","What a mistake!"],0,"Respect the refusal and offer another time."],["Which phrase offers another day?",["How about Saturday instead?","Why you no come?","I don't agree with Saturday."],0,"How about + day is a natural suggestion."],["A: Would you like to come to the concert? B: ___",["Thanks for asking, but I can't tonight.","I can't nothing.","Never talk to me."],0,"Thanking someone softens a refusal."],["A: I can't come on Friday. B: ___",["That's OK. Some other time.","You should be ashamed.","I'm very wrong."],0,"React kindly and keep the invitation open."],["Which is a natural invitation?",["Would you like to watch a film with us?","You like watch movie with us?","Would you watching a film?"],0,"Would you like to + base verb is polite."],["A: I'm busy this evening. B: ___",["Don't worry about it.","You're kidding, come anyway.","This is your fault."],0,"Don't worry about it acknowledges the refusal."],["A: I can't come tonight. B: ___",["Could we try tomorrow instead?","I was watching yesterday instead?","Can I was tomorrow?"],0,"Could we + base verb makes a polite alternative."]]},{"title":"Unit 7 Review","hint":"Bring the grammar and vocabulary together.","qs":[["I ___ to watch cartoons, but now I prefer documentaries.",["used","was used","didn't used"],0,"Used to + base verb is a past habit; 'to' is already in the sentence."],["A film that tells a true story can be a ___.",["documentary","sitcom","heavy metal"],0,"A documentary is about factual events."],["The original film was ___ the remake.",["as good as","as good than","the good as"],0,"Use as ... as to compare."],["A: I can't make it. B: ___",["Maybe another time.","You never can.","That's no good from you."],0,"A warm reaction keeps the conversation friendly."],["Which is correct?",["I didn't use to like jazz.","I didn't used to like jazz.","I didn't use to liked jazz."],0,"After didn't, write use to + base verb."],["Which word describes a funny TV series?",["sitcom","reggae","documentary film score"],0,"A sitcom is a comedy television series."],["We used to go ___ every weekend.",["to the cinema","cinemaing","for the cinemad"],0,"Go to the cinema is a common phrase."],["Which sentence naturally recommends a show?",["It's not as famous as the others, but it's worth watching.","It's not famous than other, but watch.","It's good as other and worth to watch."],0,"Worth + -ing: worth watching."]]},{"title":"Speak It Out","hint":"Flip each card for a helpful starting phrase; say your own answer aloud.","cards":[["Talk about a kind of music you used to like.","I used to listen to ___, but these days I prefer ___."],["Compare two shows you know.","___ isn't as ___ as ___ because ___."],["Recommend a science-fiction or comedy series.","I'd recommend ___ because ___; it's as ___ as ___."],["Refuse an invitation politely.","I'd love to, but ___ . How about ___ instead?"],["React when someone cannot join you.","No problem at all. Maybe we could ___ instead."],["Plan a movie night with a friend.","How about ___? It's not as ___ as ___, but ___."]]}]};</script><script src="../assets/app.js"></script></body></html>
