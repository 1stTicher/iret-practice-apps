<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 11 — Contrasts Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title": "Unit 11 — Contrasts Practice App", "tag": "LEVEL 4 · UNIT 11", "sub": "University life, research words, gerunds vs infinitives & causative verbs", "sections": [{"title": "University Words", "cards": [["campus", "The land and buildings of a university.", "The business school is on the north side of the campus."], ["degree", "A qualification you get after finishing university.", "He has a degree in accounting and a master's in finance."], ["major", "The main subject you study at university.", "My major was public accounting."], ["faculty", "All the teachers of a university or department.", "The faculty of the business school is very experienced."], ["facilities", "Buildings and equipment for a purpose.", "The university has great sports facilities, including a gym and an ice rink."], ["freshman", "A student in the first year of university.", "As a freshman, I joined the hockey club."], ["dorm", "A building where university students live.", "I lived in a dorm during my first year."], ["professor", "A senior university teacher.", "My auditing professor always used real company cases."], ["grade", "A score that shows how good your work is.", "I got a good grade on my financial statements exam."], ["association", "A group of people with a shared purpose.", "She belongs to the association of public accountants."]]}, {"title": "Research & Proof", "hint": "Choose the correct word form.", "qs": [["There is no scientific ___ that this supplement works.", ["proof", "prove", "proven"], 0, "Proof is the noun."], ["Can you ___ that the numbers in the report are correct?", ["prove", "proof", "proven"], 0, "Prove is the verb."], ["This training method is ___ to build muscle faster.", ["proven", "proof", "prove"], 0, "Proven = shown to be true (adjective/participle)."], ["The study was ___ on data from 500 companies.", ["based", "base", "basis"], 0, "Be based on = use something as the starting point."], ["We pay bonuses on a monthly ___.", ["basis", "base", "based"], 0, "On a monthly basis = every month."], ["She did a lot of ___ before writing the audit report.", ["research", "researches", "researched"], 0, "Research is usually uncountable."], ["He's studying ___ because he wants to be a doctor.", ["medicine", "medical", "medically"], 0, "Medicine is the noun (the subject)."], ["You need a ___ certificate to play in the league.", ["medical", "medicine", "medically"], 0, "Medical is the adjective."], ["Only use products that are ___ approved.", ["medically", "medical", "medicine"], 0, "Medically (adverb) modifies the adjective approved."]]}, {"title": "Remember / Forget / Stop", "hint": "Gerund = a finished or real action. Infinitive = a general or future action.", "qs": [["I clearly remember ___ my keys on the table.", ["putting", "to put", "put"], 0, "A real action you did → gerund."], ["Please remember ___ the report before Friday.", ["to send", "sending", "send"], 0, "An action you need to do in the future → infinitive."], ["I'll never forget ___ my first NFL game in person.", ["watching", "to watch", "watch"], 0, "A memory of a real experience → gerund."], ["Don't forget ___ the client about the meeting.", ["to call", "calling", "call"], 0, "Something you need to do → infinitive."], ["Stop ___ so much! The audit will be fine.", ["worrying", "to worry", "worry"], 0, "Stop + gerund = end an activity."], ["On the way to the office, I stopped ___ a coffee.", ["to buy", "buying", "buy"], 0, "Stop + infinitive = stop one activity in order to do another."], ["He stopped ___ fast food and started going to the gym.", ["eating", "to eat", "eat"], 0, "He ended the habit → gerund."], ["I forgot ___ the door, so I went back home.", ["to lock", "locking", "lock"], 0, "You didn't do the action → infinitive."]]}, {"title": "Help, Let, Make", "hint": "Causative verb + object + base verb (no 'to').", "qs": [["My manager let me ___ home early on Friday.", ["leave", "to leave", "leaving"], 0, "Let + object + base verb."], ["The coach made the players ___ extra laps.", ["run", "to run", "running"], 0, "Make + object + base verb."], ["I came in on Saturday to help him ___ something.", ["finish", "finishing", "finished"], 0, "Help + object + base verb (to finish is also possible in British English)."], ["Which sentence is correct?", ["The new software makes the audit go faster.", "The new software makes the audit to go faster.", "The new software makes the audit going faster."], 0, "Make + object + base verb."], ["My parents didn't ___ me play hockey when I was a kid.", ["let", "make", "help"], 0, "Let = give permission."], ["Good music helps me ___ at the gym.", ["concentrate", "concentrating", "concentrated"], 0, "Help + object + base verb."], ["Which word goes between the two verbs?", ["the object (me, him, people...)", "the word 'to'", "nothing"], 0, "Structure: let/make/help + object + verb."]]}, {"title": "Asking for Options", "hint": "Classify each phrase.", "qs": [["\"Can you suggest an alternative?\"", ["Asking for options", "Suggesting an alternative"], 0, "You ask someone for other choices."], ["\"Another option would be...\"", ["Suggesting an alternative", "Asking for options"], 0, "You offer a different choice."], ["\"Do you have anything else?\"", ["Asking for options", "Suggesting an alternative"], 0, "You ask for other choices."], ["\"They're a good alternative.\"", ["Suggesting an alternative", "Asking for options"], 0, "You recommend something else."], ["\"I'm looking for something different.\"", ["Asking for options", "Suggesting an alternative"], 0, "You explain you want other choices."], ["\"You could also try...\"", ["Suggesting an alternative", "Asking for options"], 0, "You suggest another possibility."]]}]};</script><script src="../assets/app.js"></script></body></html>
