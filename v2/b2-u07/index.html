<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 7 — High Adventure Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title": "Unit 7 — High Adventure Practice App", "tag": "B2 FIRST · UNIT 7", "sub": "Sports collocations, infinitive vs -ing, look/see/watch & listen/hear", "sections": [{"title": "Sports Verbs", "cards": [["compete (in)", "Take part in a contest, trying to win.", "She competes in marathons all over the world."], ["take part in", "Participate.", "I took part in a charity football match."], ["hold", "Organise and have an event happen.", "The city holds a marathon every spring."], ["enter", "Put your name down to take part in a competition.", "Have you ever entered a competition?"], ["donate", "Give money or goods to help.", "I donated money to the animal shelter."], ["go + -ing", "For outdoor activities.", "go jogging · go cycling · go hiking"], ["play", "For games and ball sports.", "play football · play tennis · play golf"], ["do", "For sports that aren't games, and for exercise.", "do judo · do gymnastics · do exercise"]]}, {"title": "Collocation Quiz", "qs": [["I usually ___ running in the evening.", ["go", "play", "do"], 0, "go running."], ["She ___ judo three times a week.", ["does", "plays", "goes"], 0, "do judo."], ["We ___ tennis every Saturday.", ["play", "do", "go"], 0, "play + ball games."], ["The city ___ a marathon every spring.", ["holds", "does", "plays"], 0, "hold an event."], ["Local governments should ___ competitions for schools.", ["organise", "do", "play"], 0, "organise a competition."], ["I was asked to ___ money to the shelter.", ["donate", "enter", "hold"], 0, "donate money."], ["On the second day, we were ___ into two groups.", ["divided up", "taken part", "held"], 0, "divide up = separate."], ["You should ___ swimming two or three times a week.", ["go", "play", "do"], 0, "go swimming."], ["Have you ever ___ a competition?", ["entered", "played", "donated"], 0, "enter a competition."]]}, {"title": "Infinitive or -ing?", "hint": "to + verb: purpose, after too/enough, decide/agree/promise... · -ing: after prepositions, as subject, enjoy/mind/suggest/risk...", "qs": [["Carlos has suggested ___ a five-a-side team.", ["starting", "to start", "start"], 0, "suggest + -ing."], ["The weather isn't good enough ___ sailing.", ["to go", "going", "go"], 0, "enough + to."], ["We've decided ___ the race early.", ["to hold", "holding", "hold"], 0, "decide + to."], ["___ is essential if you want to perform well.", ["Training", "To training", "Train"], 0, "-ing as subject."], ["I've joined a gym ___ fitter.", ["to get", "getting", "for get"], 0, "Purpose → to."], ["I don't mind ___ up early.", ["getting", "to get", "get"], 0, "mind + -ing."], ["It's no good ___ a marathon without the right shoes.", ["running", "to run", "run"], 0, "It's no good + -ing."], ["She was disqualified for ___ an opponent.", ["pushing", "to push", "push"], 0, "Preposition + -ing."], ["Students are not allowed ___ along corridors.", ["to run", "running", "run"], 0, "be allowed + to."], ["Many people only think about ___ exercise when they're overweight.", ["taking", "take", "to take"], 0, "Preposition + -ing."], ["They won't succeed ___ unless they work as a team.", ["in winning", "to win", "win"], 0, "succeed in + -ing."], ["I risked ___ myself further.", ["injuring", "to injure", "injure"], 0, "risk + -ing."]]}, {"title": "Look, See or Watch?", "hint": "see/hear = not on purpose · look/watch/listen = with attention.", "qs": [["What type of films do you enjoy ___?", ["watching", "looking at", "seeing to"], 0, "Moving images → watch."], ["Do you enjoy ___ music while you study?", ["listening to", "hearing", "listening"], 0, "On purpose → listen to."], ["What photos do you like to ___ on social media?", ["look at", "watch", "see at"], 0, "Still images → look at."], ["What monuments did you ___ on holiday?", ["see", "watch", "look"], 0, "Visit/notice → see."], ["Do you always ___ your phone when it rings?", ["hear", "listen to", "listen"], 0, "Not on purpose → hear."], ["Is it popular to ___ sport on TV in your country?", ["watch", "see", "look at"], 0, "watch sport."], ["Do you find it easy to work when someone is ___ you?", ["watching", "seeing", "hearing"], 0, "Observing over time → watch."], ["Did you ___ that noise?", ["hear", "listen", "listen to"], 0, "Not on purpose."]]}, {"title": "Discussion Phrases", "hint": "What is the speaker doing?", "qs": [["\"I couldn't agree more.\"", ["Agreeing", "Disagreeing politely", "Asking for an opinion"], 0, "Strong agreement."], ["\"I suppose so, but...\"", ["Disagreeing politely", "Agreeing", "Suggesting an idea"], 0, "Partial / polite disagreement."], ["\"What are your thoughts on this?\"", ["Asking for an opinion", "Agreeing", "Disagreeing"], 0, "Invites your partner."], ["\"Playing sports is a great way to...\"", ["Suggesting an idea", "Disagreeing politely", "Asking for an opinion"], 0, "Introduces an idea."], ["\"That's not always the case...\"", ["Disagreeing politely", "Agreeing", "Suggesting"], 0, "Polite contrast."], ["\"Don't you agree?\"", ["Asking for an opinion", "Agreeing", "Disagreeing"], 0, "Checks your partner's view."]]}]};</script><script src="../assets/app.js"></script></body></html>
