ipa":"/steɪ hoʊm/","meaning":"to not leave the house","example":"He's going to stay home and rest.","additionalExample":null},{"word":"take a walk","aliases":[],"ipa":"/teɪk ə wɔːk/","meaning":"to walk for fun or exercise","example":"We're going to take a walk in the park.","additionalExample":null},{"word":"downtown","aliases":[],"ipa":"/ˌdaʊnˈtaʊn/","meaning":"the center of a city","example":"They're going to go downtown tonight.","additionalExample":null},{"word":"a party","aliases":[],"ipa":"/ə ˈpɑːrti/","meaning":"a fun event with music, food, and friends","example":"I'm going to go to a party on Saturday.","additionalExample":null},{"word":"the movies","aliases":[],"ipa":"/ðə ˈmuːviz/","meaning":"a place where you watch films","example":"He's going to go to the movies tonight.","additionalExample":null},{"word":"spring","aliases":[],"ipa":"/sprɪŋ/","meaning":"the season when the weather gets warmer and plants grow","example":"I love spring. All the flowers are beautiful.","additionalExample":"I love spring. All the flowers are so beautiful."},{"word":"summer","aliases":[],"ipa":"/ˈsʌmər/","meaning":"the warmest season of the year","example":"It's very hot here in the summer.","additionalExample":"It's so hot here in the summer. It's not my favorite season."},{"word":"fall","aliases":["autumn"],"ipa":"/fɔːl/","meaning":"the season when leaves fall and it gets colder","example":"The leaves turn orange in the fall.","additionalExample":"The leaves turn beautiful colors in the fall."},{"word":"winter","aliases":[],"ipa":"/ˈwɪntər/","meaning":"the coldest season of the year","example":"We get cold wind in the winter.","additionalExample":"We usually get a lot of snow in the winter."},{"word":"rainy season","aliases":[],"ipa":"/ˈreɪni ˈsiːzən/","meaning":"the time of year when it rains a lot","example":"It rains almost every day in the rainy season.","additionalExample":"During the rainy season, it rains almost every day."},{"word":"dry season","aliases":[],"ipa":"/draɪ ˈsiːzən/","meaning":"the time of year with little or no rain","example":"We get almost no rain in the dry season.","additionalExample":"We get almost no rain during the dry season."},{"word":"coat","aliases":[],"ipa":"/koʊt/","meaning":"clothing you wear over other clothes when it's cold","example":"I need a coat because it's cold outside.","additionalExample":"I bought a new coat because it is cold outside."},{"word":"boot","aliases":["boots"],"ipa":"/buːt/","meaning":"a shoe that covers your foot and part of your leg","example":"I bought new boots for the rainy season.","additionalExample":"I bought a new pair of boots yesterday. They are good for walking."},{"word":"hat","aliases":[],"ipa":"/hæt/","meaning":"something you wear to cover your head","example":"I wear a hat when it's cold or sunny.","additionalExample":"I wear a hat when it is cold, so my head does not get cold."},{"word":"dress","aliases":[],"ipa":"/drɛs/","meaning":"a piece of clothing that covers the body and hangs over the legs","example":"She's going to wear a dress to the party.","additionalExample":"I love this pink dress. I wear it when I go out with friends."}],"grammar":[["I ___ going to visit my cousin.",["am","is","are"],0,"Use am with I."],["She ___ going to wear a coat.",["are","is","am"],1,"Use is with she."],["They are going to ___ home.",["staying","stayed","stay"],2,"Use the base verb after going to."],["Choose the negative.",["I'm not going to go out.","I not going to go out.","I'm going not go out."],0,"Put not after am/is/are."],["___ you going to pack boots?",["Do","Are","Is"],1,"Start a going-to yes/no question with am/is/are."],["Is she going to visit her family?",["Yes, she does.","Yes, she is.","Yes, she going."],1,"The short answer repeats is."],["Are they going to stay home?",["No, they aren't.","No, they don't.","No, they isn't."],0,"Use are/aren't with they."],["Choose the information question.",["What you are going to wear?","What are you going to wear?","What do you going to wear?"],1,"Question word + am/is/are + subject + going to + verb."],["She ___ visit her family tonight.",["is going to","going to","are going to"],0,"Keep is before going to with she."],["Choose a future time expression.",["yesterday","last week","tomorrow"],2,"Tomorrow refers to a future day."],["Choose the correct suggestion.",["Let's to meet downtown.","Let's meet downtown.","Let's meeting downtown."],1,"Let's is followed by a base verb."],["Why don't we ___ a walk?",["take","taking","to take"],0,"Why don't we + base verb."],["Choose the correct question.",["Where he is going to go?","Where is he going to go?","Where does he going to go?"],1,"Put the question word before is and the subject."]],"functions":[["A friend suggests the movies. Accept the suggestion.",["Good idea!","Sorry, I can't.","Not today, thanks."],0,"Good idea accepts the plan."],["You cannot go out. Refuse politely.",["No. Bad idea.","Sorry, I can't. I'm going to visit my family.","Yes, sure."],1,"Give a polite refusal and, if useful, a reason."],["Make a suggestion to meet.",["Let's meet at the hotel.","We met at the hotel.","We are at the hotel."],0,"Let's + base verb proposes an action."],["Complete: How about ___?",["take a walk","a walk in the park","to taking a walk"],1,"How about can introduce a noun phrase. Here, a walk is the correct form."],["Accept and ask a follow-up question.",["Sounds good. What time?","I don't know.","Sorry, not today."],0,"The response accepts and asks for a time."],["Refuse today but suggest another time.",["Yes, sure.","Not today, thanks. Maybe next week.","Good idea."],1,"This politely refuses today's plan and offers another time."]],"listening":[["Is Marco preparing for a trip or looking for a new job?",["A trip","A new job","A cooking class"],0,"He says he is going to visit his cousin tomorrow."],["Who is he going to visit?",["His teacher","His cousin","His brother"],1,"Listen for visit my cousin."],["What is he going to pack?",["A coat, boots an  to go out tonight .","seed":5,"explanation":"Use am/is/are + subject in questions, and going to + base verb."}],"production":[{"title":"Going Out","prompt":"Talk about plans to go out using be going to. Say what you are going to do, what you are not going to do, and ask questions with be going to.","criteria":["Vocabulary: go out, eat, meet, visit, stay home, take a walk","Grammar: statements with be going to","Speaking: your plans for this weekend"],"model":"This weekend, I'm going to visit my family.\nI'm also going to take a walk.\nI'm not going to stay home all day."},{"title":"Seasons","prompt":"Name the four seasons and rainy/dry seasons, name basic clothes for each season, and ask and answer questions with be going to.","criteria":["Vocabulary: spring, summer, fall, winter, rainy season, dry season","Vocabulary: coat, boot, hat, dress","Grammar: questions with be going to"],"model":"A: Are you going to travel this summer?\nB: Yes, I am. I'm going to visit my family.\nA: What are you going to wear tomorrow?\nB: I'm going to wear a T-shirt.\nA: Are you going to go out this season?"},{"title":"Suggestions","prompt":"Make a suggestion, accept a suggestion, and refuse a suggestion politely, then negotiate a real plan.","criteria":["Functional language: Why don't we...? Let's... Good idea. Sorry, I can't.","Practice: a controlled dialogue and a freer role-play","Real task: plan an event together"],"model":"A: Why don't we take a walk after class?\nB: Good idea. Let's meet outside.\nA: How about five o'clock?\nB: Sounds good. See you then."},{"title":"Integrated Skills","prompt":"Read a short original story about getting ready for a trip, answer questions, notice new language, and speak and write about it.","criteria":["Reading: Ready for the Weekend","Language hunt: be going to and season/clothes words","Writing to speaking: your own before/after"],"model":"I'm going to visit the mountains.\nI'm going to pack a coat, boots and a hat.\nI'm not going to pack sandals because it's cold.\nQ: How are you going to get there?\nA: I'm going to take the bus."},{"title":"Review and Speak","prompt":"Use everything from this unit in one real conversation: plans, seasons, clothes, and suggestions.","criteria":["Review the useful language","Prepare short notes","Have a full getting-ready conversation"],"model":"A: Hi! I'm going to go to a party on Saturday.\nB: What are you going to wear?\nA: I'm going to wear a dress because it's warm.\nB: Why don't we eat downtown before the party?\nA: Good idea. Let's meet at six."}]}</script><script>
'use strict';
const D=JSON.parse(document.getElementById('unit-data').textContent);
const sections=['Vocabulary','Grammar','Word order','Useful phrases','Listening','Reading','Speaking and writing'];
const S={section:0,indexes:{},feedback:'',feedbackKind:'',showTranscript:false,showModel:false,showHint:false,correct:{},attempted:{},reviewed:{},typed:{},words:{},drafts:{}};
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
const key=()=>S.section+':'+(S.indexes[S.section]||0);
const shuffle=(xs,seed)=>xs.map((x,i)=>({x,v:((i+1)*109+seed*37)%101})).sort((a,b)=>a.v-b.v).map(x=>x.x);
const vocabulary=D.words.map((w,i)=>{const distractors=shuffle(D.words.filter((_,j)=>j!==i),i).slice(0,3).map(x=>x.word);const opts=shuffle([w.word,...distractors],i+7);return ['Which word or phrase means: '+w.meaning,opts,opts.indexOf(w.word),w.example,w];});
function bank(){return S.section===0?vocabulary:S.section===1?D.grammar:S.section===2?D.wordOrder:S.section===3?D.functions:S.section===4?D.listening:S.section===5?D.reading:D.production;}
function item(){return bank()[S.indexes[S.section]||0];}
function info(){return '<p class="eyebrow">'+esc(sections[S.section])+' · '+((S.indexes[S.section]||0)+1)+' / '+bank().length+'</p>';}
function feedback(){return '<div role="status" aria-live="polite" class="feedback '+esc(S.feedbackKind)+'">'+S.feedback+'</div>';}
function controls(){return '<div class="controls"><button data-action="prev"'+((S.indexes[S.section]||0)===0?' disabled':'')+'>Back</button><button data-action="hint">'+(S.showHint?'Hide hint':'Hint')+'</button><button data-action="answer">Review answer</button><button class="primary" data-action="next">Next</button></div>';}
function wordBank(){return '<details><summary>Review the word bank</summary><div class="wordbank">'+D.words.map(w=>'<article><b>'+esc(w.word)+'</b><br><small>'+esc(w.ipa)+'</small><p>'+esc(w.meaning)+'</p><p>'+esc(w.example)+'</p></article>').join('')+'</div></details>';}
function render(){
 el('logo').src=D.logo;el('meta').textContent='Elevate 4 · Level 1 · A1 · Unit '+D.unit;el('title').textContent=D.title;el('goal').textContent=D.goal;
 el('nav').innerHTML=sections.map((x,i)=>'<button data-action="section" data-value="'+i+'"'+(i===S.section?' aria-current="page"':'')+'>'+x+'</button>').join('');
 let h='<section class="card">'+info();const q=item();
 if(S.section===2){
  h+='<h2>Put the words in order</h2><p>'+esc(q.prompt)+'</p>';const pieces=shuffle(q.words,q.seed);const chosen=S.words[key()]||[];
  h+='<div class="sentence" aria-live="polite">'+chosen.map(n=>esc(pieces[n])).join(' ')+'</div><div>'+pieces.map((w,i)=>'<button class="word" data-action="word" data-value="'+i+'"'+(chosen.includes(i)?' disabled':'')+'>'+esc(w)+'</button>').join('')+'</div><div class="controls"><button data-action="undo">Undo</button><button data-action="clear-words">Clear words</button><button class="primary" data-action="check-order">Check</button></div>';
 }else if(S.section===6){
  h+='<h2>'+esc(q.title)+'</h2><p>'+esc(q.prompt)+'</p><ul>'+q.criteria.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><label for="draft">Say your answer aloud, then write notes or a short response.</label><textarea id="draft" placeholder="Write your own response here.">'+esc(S.drafts[key()]||'')+'</textarea><p><small>Use the checklist to review your work. Personal answers can differ from the model.</small></p><div class="controls"><button data-action="review-draft">Review checklist</button><button data-action="model">'+(S.showModel?'Hide model':'Review a possible response')+'</button></div>'+(S.showModel?'<div class="feedback model"><b>Possible response</b><br>'+esc(q.model)+'</div>':'');
 }else{
  if(S.section===4){h+='<p>'+esc(D.preListening)+'</p><audio controls preload="none" aria-label="Original unit listening recording" src="'+D.audio+'"></audio><p><small>'+(S.indexes[4]===0||!S.indexes[4]?'First listen: find the main idea.':'Second listen: listen again for details.')+'</small></p>';}
  if(S.section===5)h+='<details open><summary>'+esc(D.readingTitle)+'</summary><div class="reading">'+D.passage.map(p=>'<p>'+esc(p)+'</p>').join('')+'</div></details>';
  h+='<h2>'+esc(q[0])+'</h2>';
  const typed=S.section===0 || (S.section===1&&q[0].includes('___')&&q[1][q[2]].split(' ').length<3);
  if(typed)h+='<label for="typed">'+(S.section===0?'Type the word or phrase.':'Type the missing word or words.')+'</label><input id="typed" autocomplete="off" value="'+esc(S.typed[key()]||'')+'"><div class="controls"><button class="primary" data-action="check-typed">Check</button></div>';
  else h+='<div class="options">'+q[1].map((x,i)=>'<button data-action="choice" data-value="'+i+'">'+esc(x)+'</button>').join('')+'</div>';
 }
 if(S.showHint)h+='<p class="feedback"><b>Hint:</b> '+esc(S.section===0?'Think of the unit word. Singular and plural forms are shown in the word bank.':S.section===2?'Start with a question word or helper in questions. Keep the subject before the main verb in statements.':S.section===4?'Listen again for the words that answer this question.':S.section===5?'Find the sentence in the reading that gives this information.':S.section===3?'Decide whether you need to offer, request, accept, refuse or express uncertainty.':'Identify the subject and the time. Then choose the matching helper and verb form.')+'</p>';
 h+=feedback()+controls();
 if(S.section===4)h+='<div class="controls"><button data-action="transcript">'+(S.showTranscript?'Hide transcript':'Review complete transcript')+'</button></div>'+(S.showTranscript?'<div class="feedback model"><b>Complete transcript</b><br>'+esc(D.transcript)+'<p>Find words that support every answer.</p></div>':'');
 h+='</section>';
 if(S.section===0)h+=wordBank();el('main').innerHTML=h;
 el('progress').textContent=Object.keys(S.correct).length+' correct answers recorded';
}
function mark(correct,explanation){S.attempted[key()]=true;if(correct)S.correct[key()]=true;S.feedbackKind=correct?'ok':'bad';S.feedback=(correct?'<b>Correct.</b> ':'<b>Try again.</b> ')+esc(explanation);render();}
function clearView(){S.feedback='';S.feedbackKind='';S.showHint=false;S.showModel=false;S.showTranscript=false;}
document.addEventListener('input',e=>{if(e.target.id==='typed')S.typed[key()]=e.target.value;if(e.target.id==='draft')S.drafts[key()]=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='typed'){e.preventDefault();checkTyped();}});
function checkTyped(){const q=item(),answer=norm(S.typed[key()]||'');if(!answer){S.feedback='Write an answer first.';S.feedbackKind='bad';render();return;}const wanted=norm(q[1][q[2]]);const aliases=S.section===0?(q[4].aliases||[]).map(norm):[];mark(answer===wanted||aliases.includes(answer),answer===wanted||aliases.includes(answer)?q[3]:'Use the hint or review the word bank, then try again.');}
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;
 if(a==='section'){S.section=Number(v);clearView();render();return;}
 if(a==='choice'){const q=item(),right=Number(v)===q[2];mark(right,right?q[3]:'Check the subject, meaning or evidence, then try another answer.');return;}
 if(a==='check-typed'){checkTyped();return;}
 if(a==='hint'){S.showHint=!S.showHint;render();return;}
 if(a==='answer'){
  const q=item();S.reviewed[key()]=true;S.attempted[key()]=true;S.feedbackKind='';S.feedback=S.section===2?'<b>Answer:</b> '+esc(q.answer):S.section===6?'<b>Possible response:</b><br>'+esc(q.model).replace(/\n/g,'<br>'):'<b>Answer:</b> '+esc(q[1][q[2]])+'<br>'+esc(q[3]);render();return;
 }
 if(a==='next'||a==='prev'){
  if(a==='next'&&S.section<6&&!S.attempted[key()]){S.feedback='Try this question or choose Review answer before continuing.';S.feedbackKind='bad';render();return;}
  const next=(S.indexes[S.section]||0)+(a==='next'?1:-1);if(next>=bank().length){S.feedback='You reached the end of this section. Review it again or choose another section.';S.feedbackKind='ok';render();return;}
  S.indexes[S.section]=Math.max(0,next);clearView();render();return;
 }
 if(a==='transcript'){S.showTranscript=!S.showTranscript;render();return;}
 if(a==='word'){(S.words[key()]??=[]).push(Number(v));S.feedback='';render();return;}
 if(a==='undo'){(S.words[key()]||[]).pop();render();return;}
 if(a==='clear-words'){S.words[key()]=[];S.feedback='';render();return;}
 if(a==='check-order'){const q=item(),pieces=shuffle(q.words,q.seed),answer=(S.words[key()]||[]).map(n=>pieces[n]).join(' ');mark(norm(answer)===norm(q.answer),norm(answer)===norm(q.answer)?q.explanation:'Use every word once. Check the helper and subject order.');return;}
 if(a==='model'){S.showModel=!S.showModel;render();return;}
 if(a==='review-draft'){const draft=(S.drafts[key()]||'').trim();S.feedbackKind=draft?'':'bad';S.feedback=draft?'Read your response aloud. Check every item above and compare with a possible response. Ask your teacher about anything unclear.':'Write notes or a response first.';S.attempted[key()]=Boolean(draft);render();return;}
 if(a==='reset'||a==='reset-all'){
  const prefix=S.section+':';for(const name of ['correct','attempted','reviewed','typed','words','drafts'])for(const k of Object.keys(S[name]))if(a==='reset-all'||k.startsWith(prefix))delete S[name][k];
  if(a==='reset-all')S.indexes={};else S.indexes[S.section]=0;clearView();render();return;
 }
});
render();
</script></body></html>
