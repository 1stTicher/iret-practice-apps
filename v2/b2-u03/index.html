ked", "was walk"], 0, "Long action before → past perfect continuous."], ["By the time we arrived, the train ___.", ["had left", "left", "was leaving"], 0, "Finished before → past perfect."], ["She ___ just finished school two weeks earlier.", ["had", "has", "was"], 0, "Past perfect with just."]]}, {"title": "Travel, Journey, Trip or Way?", "qs": [["___ broadens the mind.", ["Travel", "A travel", "A journey"], 0, "Travel is uncountable."], ["The ___ back from New York was pleasant.", ["journey", "travel", "way"], 0, "journey = time/distance between places."], ["He's on a business ___ in Monterrey.", ["trip", "travel", "way"], 0, "trip = going and coming back."], ["I stopped at the supermarket on the ___ to school.", ["way", "trip", "travel"], 0, "way = route."], ["We went on a day ___ to the pyramids.", ["trip", "journey", "way"], 0, "day trip."], ["It was a long, dangerous ___ across the desert.", ["journey", "trip", "travel"], 0, "journey."]]}, {"title": "Word Formation", "hint": "Use the word in capitals to make the right form.", "qs": [["The roads were very ___. (DANGER)", ["dangerous", "dangerously", "endanger"], 0, "Adjective."], ["She has a fear of ___. (HIGH)", ["heights", "highness", "highly"], 0, "Noun."], ["The bed was really ___. (COMFORT)", ["uncomfortable", "discomfort", "comfortless"], 0, "Negative adjective."], ["Don't let one bad result ___ you. (COURAGE)", ["discourage", "encourage", "courageous"], 0, "Negative verb."], ["Is there an ___ route? (ALTERNATE)", ["alternative", "alternately", "alternation"], 0, "Adjective."], ["___ should drive carefully in the rain. (MOTOR)", ["Motorists", "Motors", "Motoring"], 0, "People → plural noun."], ["It was ___ the best trip of my life. (DOUBT)", ["undoubtedly", "doubtful", "doubtless"], 0, "Adverb."], ["Prices increased ___. (DRAMA)", ["dramatically", "dramatic", "drama"], 0, "Adverb."], ["The castle is the main tourist ___. (ATTRACT)", ["attraction", "attractive", "attracting"], 0, "Noun."], ["The hike was ___. (ADVENTURE)", ["adventurous", "adventured", "adventurer"], 0, "-ous adjective."]]}, {"title": "At, In or On?", "qs": [["___ five o'clock", ["at", "in", "on"], 0, "Clock time."], ["___ 2017", ["in", "on", "at"], 0, "Years."], ["___ Friday morning", ["on", "in", "at"], 0, "Day + part of day."], ["___ Easter", ["at", "on", "in"], 0, "Holiday period."], ["___ the summer", ["in", "at", "on"], 0, "Seasons."], ["___ my birthday", ["on", "in", "at"], 0, "Specific day."], ["The project will be finished ___ two weeks' time.", ["in", "on", "at"], 0, "in = after a period."], ["___ lunch", ["at", "on", "in"], 0, "Mealtimes."]]}, {"title": "Speaking Part 3", "hint": "Choose the best phrase.", "qs": [["To start the discussion:", ["Shall we start with...?", "I couldn't care less.", "Next question, please."], 0, "Take the initiative."], ["To react and add an idea:", ["That's a good point. I also think...", "No.", "Whatever."], 0, "Build on your partner's idea."], ["To disagree politely:", ["I see what you mean, but...", "You're wrong.", "That's stupid."], 0, "Polite disagreement."], ["To move toward a decision:", ["Shall we say that...?", "Let's not decide.", "I don't know."], 0, "Negotiate a conclusion."], ["What is NOT a good strategy?", ["Talking about only two of the five options", "Inviting your partner to speak", "Reaching a decision"], 0, "Cover all five options."]]}]};</script><script src="../assets/app.js"></script></body></html>
