<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 3 — Money Matters Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title": "Unit 3 — Money Matters Practice App", "tag": "BUSINESS B2+ · UNIT 3", "sub": "Banking vocabulary, money phrasal verbs, defending ideas & participle clauses", "sections": [{"title": "Banking Words", "cards": [["account", "An arrangement with a bank to keep your money.", "You can open an account online in ten minutes."], ["direct debit", "An automatic payment from your account to a company.", "Our rent is paid by direct debit every month."], ["transfer money", "Send money from one account to another.", "I transferred money to the supplier this morning."], ["top up", "Add more money to a card or phone balance.", "I need to top up my transport card."], ["transaction", "A single payment or exchange of money.", "The bank charges a fee for each international transaction."], ["overdraft", "An arrangement that lets you spend more than you have.", "The bank promised to increase our overdraft allowance."], ["overdrawn", "Having spent more money than is in your account.", "They charged us for being overdrawn."], ["financial inclusion", "Giving everyone access to banking services.", "Mobile banking improves financial inclusion."], ["unbanked", "Not having a bank account.", "Two billion adults worldwide are unbanked."], ["cash flow", "The money moving in and out of a business.", "A late payment caused a cash flow problem."]]}, {"title": "Money Phrasal Verbs", "hint": "Choose the correct phrasal verb.", "qs": [["We ___ a loan to buy new equipment.", ["took out", "put off", "eat out"], 0, "Take out a loan/mortgage."], ["She can ___ on very little money.", ["get by", "set up", "run up"], 0, "Get by = manage with little."], ["We need to ___ on travel expenses this quarter.", ["cut down", "pay back", "carry on"], 0, "Cut down on = reduce."], ["I'll ___ the loan in 12 monthly payments.", ["pay back", "put by", "look into"], 0, "Pay back = return money."], ["Try to ___ some money every month for emergencies.", ["put by", "run up", "fall behind"], 0, "Put by = save."], ["He ___ huge debts on his credit cards.", ["ran up", "got by", "set up"], 0, "Run up debts = accumulate."], ["Don't ___ with your mortgage payments.", ["fall behind", "look forward", "carry on"], 0, "Fall behind with = be late paying."], ["Our team will ___ the cause of the discrepancy.", ["look into", "put off", "eat out"], 0, "Look into = investigate."], ["They ___ a new business last year.", ["set up", "got by", "cut down"], 0, "Set up = start/establish."], ["We had to ___ the launch until next quarter.", ["put off", "pay back", "look into"], 0, "Put off = postpone."]]}, {"title": "Phrasal Verb Types", "hint": "Separable: verb + object + particle is OK.", "qs": [["\"pay back\" is...", ["transitive, separable", "transitive, non-separable", "intransitive"], 0, "Pay the money back / pay back the money."], ["\"look into\" is...", ["transitive, non-separable", "transitive, separable", "intransitive"], 0, "Look into the problem (not look the problem into)."], ["\"eat out\" is...", ["intransitive", "transitive, separable", "transitive, non-separable"], 0, "No object: We eat out on Fridays."], ["Which is correct?", ["We need to pay it back.", "We need to pay back it.", "We need to back pay it."], 0, "With a pronoun, separable verbs must split: pay it back."], ["Which is correct?", ["I'm looking forward to the meeting.", "I'm looking the meeting forward to.", "I'm looking forward the meeting to."], 0, "Look forward to is non-separable."], ["\"set up\" is...", ["transitive, separable", "intransitive", "transitive, non-separable"], 0, "Set up a company / set it up."]]}, {"title": "Defending Ideas", "hint": "Complete the phrase.", "qs": [["These are the reasons which ___ doing it this way.", ["warrant", "break", "back"], 0, "Reasons which warrant = reasons that justify."], ["When you consider the ___, you'll see our market share is shrinking.", ["big picture", "best opportunity", "main reasons"], 0, "Consider the big picture."], ["I can see why there might be ___. However, ...", ["objections", "backing", "opportunities"], 0, "Acknowledging possible objections."], ["Let me ___ the main reasons this proposal is the best.", ["break down", "back up", "carry on"], 0, "Break down = explain step by step."], ["You'll see I also have the ___ of others in the room.", ["backing", "objection", "picture"], 0, "Backing = support."], ["We should rethink our strategy, as otherwise ___.", ["we'll lose out to our competitors", "spread our focus", "the cost is lower"], 0, "Describing negative consequences."], ["If we fail to act, then ___.", ["we'll lose an opportunity to engage our customers", "committing to it", "taking on more"], 0, "Condition → consequence."], ["Committing to this action would mean ___.", ["taking on more things to do in your role", "we'll lose out", "consider the big picture"], 0, "Would mean + -ing."]]}, {"title": "Participle Clauses", "hint": "Use -ing / having + past participle / past participle to make sentences shorter and more formal.", "qs": [["___ informed you in advance, we expected no problems.", ["Having", "Being", "Have"], 0, "Having + past participle = action completed before."], ["___ worked here for very long, I was unaware of the problems.", ["Not having", "Having not being", "Don't having"], 0, "Negative: not + participle."], ["___ a long-standing customer, we request a quick resolution.", ["Being", "Been", "Having be"], 0, "State verbs can appear as -ing in participle clauses."], ["___ by one of our workers, the product became a best-seller.", ["Designed", "Designing", "Having design"], 0, "Passive meaning → past participle."], ["The report, ___ by the auditors now, will be ready on Friday.", ["being reviewed", "reviewed by", "reviewing"], 0, "Continuous passive → being + past participle."], ["Which is correct?", ["Receiving your assurance, we expected everything to be in order.", "Received your assurance, we expected everything to be in order.", "Receive your assurance, we expected everything to be in order."], 0, "Active -ing participle (we received)."], ["In a letter of complaint, which phrase is appropriate?", ["We are writing to express our deep dissatisfaction with your service.", "We are super angry with you guys.", "Your service is bad, fix it."], 0, "Formal register for complaints."]]}]};</script><script src="../assets/app.js"></script></body></html>
