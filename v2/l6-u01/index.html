<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 1 — Robot Revolution Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title": "Unit 1 — Robot Revolution Practice App", "tag": "LEVEL 6 · UNIT 1", "sub": "Commenting adverbs, tech vocabulary, future perfect & continuous, counterarguments", "sections": [{"title": "Stance Adverbs", "cards": [["certainly", "No doubt about it.", "She'll certainly get the job — she prepared so well."], ["clearly", "Obvious to anyone looking.", "This café is clearly popular — there's never a free table."], ["demonstrably", "Provable with evidence.", "Our results are demonstrably better this quarter."], ["evidently", "Easily noticed from what you see.", "It evidently rained all night — the streets are flooded."], ["feasibly", "Possibly; realistic to achieve.", "Electric trucks could feasibly cover the route by 2030."], ["presumably", "Probably, based on what you know.", "The interview will presumably take an hour."], ["comprehensively", "Completely; covering everything.", "The report comprehensively covers every branch."], ["dramatically", "In a sudden, very noticeable way.", "Our lives changed dramatically when we moved."], ["drastically", "In a sudden and extreme way.", "Vaccines drastically reduced measles worldwide."], ["eventually", "In the end, after a long time.", "We saved every month and eventually bought the house."], ["gradually", "Slowly, over a period of time.", "AI is gradually changing how recruiters work."], ["ultimately", "In the end; finally.", "The board will ultimately decide."]]}, {"title": "Adverbs in Context", "qs": [["Look at the long lines — the new app is ___ popular.", ["clearly", "feasibly", "eventually"], 0, "Obvious from what you see → clearly."], ["The data proves it: remote work has ___ improved productivity here.", ["demonstrably", "presumably", "gradually"], 0, "Provable with evidence → demonstrably."], ["Change is slow — the industry is ___ adopting AI.", ["gradually", "drastically", "certainly"], 0, "Slowly over time → gradually."], ["Prices fell ___ — 70% in one month.", ["drastically", "gradually", "presumably"], 0, "Sudden and extreme → drastically."], ["We could ___ finish the project by June, if we hire two people.", ["feasibly", "evidently", "demonstrably"], 0, "Realistic under conditions → feasibly."], ["He's not at his desk. He's ___ in the meeting.", ["presumably", "comprehensively", "drastically"], 0, "Probable, based on what you know → presumably."], ["After many attempts, they ___ found a solution.", ["eventually", "clearly", "feasibly"], 0, "In the end, after a long time → eventually."], ["The audit covered everything ___.", ["comprehensively", "gradually", "presumably"], 0, "Completely → comprehensively."]]}, {"title": "Where the Adverb Goes", "hint": "Affirmative: will + adverb + verb · Negative: adverb + won't.", "qs": [["Choose the correct forecast.", ["Offices will presumably disappear.", "Offices presumably will disappear not.", "Offices will disappear presumably not."], 0, "Affirmative: will + adverb + verb."], ["Choose the correct negative.", ["He presumably won't attend.", "He won't presumably attend.", "He will presumably not attending."], 0, "Negative: adverb before won't."], ["Prices will rise. (certainly)", ["Prices will certainly rise.", "Prices certainly will rising.", "Prices will rise certainly not."], 0, "will + certainly + verb."], ["The app will succeed. (evidently — negative)", ["The app evidently won't succeed.", "The app won't evidently succeed.", "The app evidently will succeed not."], 0, "Adverb + won't."], ["We will adapt. (gradually)", ["We will gradually adapt.", "We gradually will adapting.", "We will adapt gradually not."], 0, "will + adverb + verb (end position also possible: 'We will adapt gradually')."], ["They'll repeat that mistake. (certainly — negative)", ["They'll certainly not repeat that mistake.", "They'll not certainly repeat that mistake.", "They certainly'll not repeat."], 0, "'ll + certainly + not + verb."]]}, {"title": "Tech Vocabulary", "qs": [["A program designed to hold a conversation with a human.", ["chatbot", "operating system", "beta version"], 0, "Chatbot."], ["Software at the testing stage, released so users find problems.", ["beta version", "machine translation", "facial recognition"], 0, "Beta version."], ["Technology that identifies a person's face.", ["facial recognition", "image recognition", "speech to text"], 0, "Facial recognition."], ["Converting spoken words into digital text.", ["speech to text", "text to speech", "machine translation"], 0, "Speech to text."], ["Converting digital text into spoken words.", ["text to speech", "speech to text", "chatbot"], 0, "Text to speech."], ["The programs that control how a computer works.", ["operating system", "beta version", "AI"], 0, "Operating system."], ["Designed or produced by a computer program.", ["computer-generated", "image recognition", "chatbot"], 0, "Computer-generated."], ["Changing text from one language to another using a computer.", ["machine translation", "speech to text", "operating system"], 0, "Machine translation."], ["Technology that names objects or places in photos.", ["image recognition", "facial recognition", "text to speech"], 0, "Image recognition."]]}, {"title": "Two Futures", "hint": "Future perfect = done BEFORE a moment (by...). Future continuous = in progress AT a moment.", "qs": [["By 2030, I ___ paying for this phone.", ["will have finished", "will be finishing", "finish"], 0, "Deadline with 'by' → future perfect."], ["This time next year, we ___ to our refrigerators.", ["'ll be talking", "'ll have talked", "talk"], 0, "Snapshot at a future moment → future continuous."], ["By December, our company ___ AI tools.", ["will have adopted", "will be adopting", "adopts"], 0, "By + time → future perfect."], ["In five years, robots ___ food in my neighborhood.", ["will be delivering", "will have delivered", "deliver"], 0, "Snapshot in progress → future continuous."], ["This time next year, I ___ with cash.", ["won't be paying", "won't have paid", "don't pay"], 0, "Snapshot, negative → won't be + -ing."], ["By Friday, I probably ___ all these emails.", ["won't have answered", "won't be answering", "don't answer"], 0, "Deadline → future perfect negative."], ["By the time you arrive, the meeting ___.", ["will have started", "will be starting", "starts"], 0, "By the time → future perfect."], ["At 9 a.m. tomorrow, I ___ the client presentation.", ["'ll be giving", "'ll have given", "give"], 0, "In progress at a specific moment."]]}, {"title": "The Diplomat's Toolkit", "hint": "Acknowledge → concede → pivot. What is each phrase doing?", "qs": [["\"I get where you're coming from.\"", ["Acknowledging", "Conceding + pivoting", "Standing your ground"], 0, "Shows you heard the argument."], ["\"I can see how that might save money, but...\"", ["Conceding + pivoting", "Acknowledging", "Standing your ground"], 0, "Credits the point, then turns it."], ["\"I guess so, but I'm still not convinced.\"", ["Standing your ground", "Acknowledging", "Conceding + pivoting"], 0, "Polite but firm."], ["\"You have a good point there.\"", ["Acknowledging", "Standing your ground", "Conceding + pivoting"], 0, "Proof of listening."], ["\"It's a valid point, but consider the other side.\"", ["Conceding + pivoting", "Acknowledging", "Standing your ground"], 0, "Concede, then pivot with 'but'."], ["\"That's true as far as it goes, but...\"", ["Standing your ground", "Acknowledging", "Conceding + pivoting"], 0, "Limits the other argument."], ["\"I hadn't really thought of it like that.\"", ["Acknowledging", "Conceding + pivoting", "Standing your ground"], 0, "Shows openness."], ["Which is the WORST way to disagree?", ["\"You're wrong.\" (silence)", "\"I understand what you're saying, but...\"", "\"I get where you're coming from, but...\""], 0, "No acknowledgment — the 'wall'."]]}]};</script><script src="../assets/app.js"></script></body></html>
