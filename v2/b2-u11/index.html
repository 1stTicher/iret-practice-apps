<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 11 — Medical Matters Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title":"Unit 11 — Medical Matters Practice App","tag":"B2 FIRST · UNIT 11","sub":"Health vocabulary, relative clauses, word formation and Cambridge exam skills","sections":[{"title":"Health & Workplace Vocabulary","hint":"Flip each card to review a useful collocation.","cards":[["come down with","Start to become ill with something.","I think I'm coming down with a cold."],["recover from","Get better after an illness or injury.","She recovered from the injury in a few weeks."],["make an appointment","Arrange a time to see a professional.","I made an appointment with the dentist."],["get injured","Be hurt in an accident or during an activity.","Two players got injured during the match."],["feel under the weather","Feel slightly ill.","I'm feeling under the weather today."],["experience symptoms","Have signs of an illness or condition.","Some people experience mild symptoms."],["seek professional advice","Ask a qualified professional for guidance.","If the problem continues, seek professional advice."],["prevent an injury","Stop an injury from happening.","Good technique can help prevent an injury."],["take medication","Use a medicine according to appropriate instructions.","He takes medication prescribed by his doctor."],["health check-up","An appointment to check general health.","She booked a routine health check-up."],["rushed off your feet","Extremely busy.","We've been rushed off our feet at work this week."],["taken aback","Very surprised, usually by something unexpected.","I was taken aback by how quickly the plan changed."]]},{"title":"Relative Clauses","hint":"Choose a grammatically correct relative clause.","qs":[["The nurse ___ helped me was very kind.",["who","which","where"],0,"Who refers to people."],["The clinic, ___ opened last year, is near the station.",["which","that","who"],0,"Non-defining relative clauses use which, not that, after a comma."],["The doctor ___ advice I followed works at this hospital.",["whose","who","which"],0,"Whose expresses possession."],["This is the hospital ___ my sister works.",["where","who","whose"],0,"Where refers to a place."],["The person ___ I met yesterday is a physiotherapist.",["who","whose","where"],0,"Who can be the object in a defining relative clause."],["Choose a correct defining relative clause.",["The medicine that I bought was expensive.","The medicine, that I bought, was expensive.","The medicine who I bought was expensive."],0,"That is allowed in defining clauses, without separating commas."],["Which sentence is correct?",["My uncle, who lives nearby, is a doctor.","My uncle, that lives nearby, is a doctor.","My uncle which lives nearby is a doctor."],0,"Non-defining clauses describing people use who."],["When can we omit the relative pronoun?",["When it is the object in a defining relative clause.","When it is the subject in any clause.","Whenever there are commas."],0,"Object relative pronouns can be omitted in defining relative clauses."],["Choose the natural sentence.",["The report I read was helpful.","The report read I was helpful.","The report I read it was helpful."],0,"The object relative pronoun is omitted: the report (that) I read."],["My colleagues, ___ work remotely, meet online every Friday.",["who","that","where"],0,"Who is standard in non-defining relative clauses about people."]]},{"title":"Word Formation","hint":"Choose the correct form in a B2 exam sentence.","qs":[["The instructions were unclear and caused a lot of ___.",["confusion","confuse","confusingly"],0,"The sentence needs a noun."],["The information was completely ___; it contained several mistakes.",["unreliable","inreliable","disreliable"],0,"The adjective is unreliable."],["The customer became ___ after waiting for an hour.",["impatient","inpatient","unpatient"],0,"The negative form of patient is impatient."],["It would be ___ to ignore the warning signs.",["irresponsible","unresponsible","disresponsible"],0,"Responsible changes to irresponsible."],["The treatment was ___ in that particular study.",["ineffective","uneffective","diseffective"],0,"Ineffective means not producing the intended result."],["The patient expressed ___ with the long waiting time.",["dissatisfaction","unsatisfaction","insatisfied"],0,"The noun is dissatisfaction."],["The project was delayed because of poor ___.",["communication","communicate","communicative"],0,"We need the noun communication."],["Better training can increase public ___ of risks.",["awareness","aware","awarely"],0,"Awareness is the noun."],["The instructions were ___, so nobody knew what to do.",["incomplete","discomplete","uncompleting"],0,"Incomplete means missing information."],["The accident was completely ___ because the road was icy.",["unexpected","inexpected","disexpected"],0,"Unexpected is the correct negative adjective."]]},{"title":"Cohesion & Reading Part 6","hint":"Find the logical link between two ideas.","qs":[["A sentence begins 'However,'. What relationship does it usually introduce?",["A contrast","An identical example","A time and place"],0,"However introduces a contrast."],["'The nurse checked the results. She then called the doctor.' What does 'She' refer to?",["The nurse","The results","The doctor"],0,"Pronouns connect back to an earlier noun."],["Which sentence best follows 'The clinic introduced online appointments'?",["As a result, patients could book visits more easily.","Clinics have many windows.","Some buildings are old."],0,"As a result links a change to its consequence."],["What should you check when fitting a missing sentence into a text?",["The ideas before and after the gap","Only the first word of the option","Which option sounds most familiar"],0,"Part 6 depends on cohesion in both directions."],["A paragraph explains a general risk. The next sentence gives a detailed case. Which connector fits?",["For example","Nevertheless","On the other hand"],0,"For example introduces a supporting case."],["'This problem' in a paragraph usually refers to ___.",["an issue introduced in the preceding context","a topic not mentioned anywhere","only the following title"],0,"Demonstratives often refer back to previous content."],["A sentence starts 'Despite this,'. What does it signal?",["A surprising contrast with what came before","A guaranteed result","A direct quotation"],0,"Despite this contrasts with the prior situation."],["Which is the most helpful reading strategy?",["Track reference words and repeated or paraphrased ideas.","Choose the option with the longest words.","Ignore the sentence after the gap."],0,"Cohesion is about links across sentences."]]},{"title":"Writing & Speaking Skills","hint":"Exam practice with connectors, comparison and conclusions.","qs":[["Choose the grammatically correct sentence.",["Although he was tired, he finished his report.","Despite he was tired, he finished his report.","Although being tired, he finished his report."],0,"Although + a full clause."],["Which sentence uses 'despite' correctly?",["Despite feeling tired, she continued working.","Despite she felt tired, she continued working.","Despite of feeling tired, she continued working."],0,"Despite + a noun or -ing form; not despite of."],["Choose a correct contrast marker.",["The service was expensive. However, it was excellent.","The service was expensive however it was excellent.","However the service excellent."],0,"However can introduce a contrasting new sentence."],["A B2 essay conclusion should ___.",["summarise the argument and give a clear judgement","introduce an unrelated major idea","repeat the introduction word for word"],0,"A conclusion closes the argument."],["In Speaking Part 2, you should ___.",["compare both photos and answer the examiner's question","describe only one photo","avoid speculating about people"],0,"The task assesses comparison and relevant speculation."],["Which phrase speculates without sounding certain?",["They might be waiting for test results.","They certainly are receiving the worst news.","They are definitely ill."],0,"Might be + -ing expresses reasonable speculation."],["Which sentence compares two situations clearly?",["Whereas one person looks anxious, the other seems relaxed.","One person anxious other relaxed whereas.","Whereas one person is anxious other."],0,"Whereas joins contrasting clauses."],["What is a useful structure for a one-minute photo comparison?",["Set the scene, compare, speculate, answer the question.","Read out every visible object.","Give an unrelated long story."],0,"Keep structure purposeful and answer the prompt."]]},{"title":"Speak It Out","hint":"Flip for starting language and practise a complete answer aloud.","cards":[["Explain a workplace incident clearly.","First, ___ happened. Then ___. As a result, ___."],["Compare two health-related situations.","Both pictures show ___. However, in the first picture ___, whereas in the second ___."],["Describe someone's role using a relative clause.","A colleague who ___ is responsible for ___."],["Make a reasonable speculation.","The person might be feeling ___ because ___."],["Give a balanced opinion.","Although ___, I think ___ because ___."],["Finish a short health essay.","Overall, I believe ___ matters most, although ___."],["Describe being unexpectedly busy.","We were rushed off our feet when ___, so we ___."],["Explain a rule using a defining relative clause.","A procedure that ___ can help people ___."],["Paraphrase a problem and its result.","This issue affected ___ . As a result, ___."],["Give a 60-second comparison.","Both photos ___; unlike ___, ___; I'd say ___ because ___."]]}]};</script><script src="../assets/app.js"></script></body></html>
