<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 1 — Market Research Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title": "Unit 1 — Market Research Practice App", "tag": "BUSINESS B2+ · UNIT 1", "sub": "Research terms, collocations, reporting verb patterns & leading vs open questions", "sections": [{"title": "Research Terms", "cards": [["online survey", "Questions people answer through a web form.", "We ran an online survey with 500 customers."], ["focus group", "A small group that discusses a product with a moderator.", "The focus group loved the new design but hated the price."], ["in-depth interview", "A detailed one-on-one conversation to get qualitative data.", "We held in-depth interviews with ten ERP users."], ["desk research", "Secondary research using existing published sources.", "Desk research showed what our competitors charge."], ["primary data", "New information you collect yourself.", "Surveys and interviews give us primary data."], ["secondary data", "Information that already exists, collected by others.", "Government reports are a good source of secondary data."], ["customer satisfaction", "How well a product meets customer expectations.", "Customer satisfaction rose 12% after the redesign."], ["target audience", "The group most likely to buy a product.", "Our target audience is small business owners."], ["sample size", "The number of people included in a study.", "A bigger sample size gives more accurate results."], ["launch a product", "Introduce a new product to the market.", "We'll launch the product in Mexico first."]]}, {"title": "Collocations", "hint": "Complete the sentence.", "qs": [["Today it is very common to use ___ surveys.", ["online", "desk", "sample"], 0, "online surveys (adjective + noun)."], ["Although ___ groups are small, they can predict customer reactions.", ["focus", "target", "sample"], 0, "focus groups (noun + noun)."], ["Research helps measure the level of ___ satisfaction.", ["customer", "desk", "online"], 0, "customer satisfaction."], ["One primary method is to hold ___ interviews.", ["in-depth", "online", "target"], 0, "in-depth interviews."], ["Secondary research is also called ___ research.", ["desk", "focus", "sample"], 0, "desk research."], ["Knowing competitors helps when you plan to ___ a product.", ["launch", "sample", "target"], 0, "launch a product (verb + noun)."], ["The goal is to identify the ___ audience.", ["target", "sample", "desk"], 0, "target audience."], ["To make research cheaper, reduce the ___ size.", ["sample", "focus", "launch"], 0, "sample size."], ["\"Focus groups\" is a(n) ___ collocation.", ["noun + noun", "adjective + noun", "verb + noun"], 0, "focus (noun) + groups (noun)."], ["\"Launch a product\" is a(n) ___ collocation.", ["verb + noun", "noun + noun", "adjective + noun"], 0, "launch (verb) + product (noun)."]]}, {"title": "Reporting Verbs: that-clause", "hint": "say/announce/admit: no object · tell/inform/remind/warn: object needed.", "qs": [["They ___ that they were launching a new range.", ["announced", "told", "informed"], 0, "Announce has no object before the that-clause."], ["They ___ us that they were launching a new range.", ["informed", "announced", "said"], 0, "Inform needs an object (us)."], ["He ___ me the product was too expensive.", ["told", "said", "announced"], 0, "Tell + object."], ["She ___ that the survey results were disappointing.", ["admitted", "told", "warned"], 0, "Admit has no object."], ["The manager ___ the team that the deadline was Friday.", ["reminded", "said", "replied"], 0, "Remind + object."], ["Which sentence is correct?", ["He said that sales had fallen.", "He said me that sales had fallen.", "He told that sales had fallen."], 0, "Say: no object. Tell: object."]]}, {"title": "Reporting Verbs: to / -ing", "hint": "agree/offer/promise/refuse + to · ask/encourage/advise/warn + object + to · suggest/admit/discuss + -ing.", "qs": [["They agreed ___ the survey.", ["to complete", "completing", "us to complete"], 0, "Agree + to infinitive (no object)."], ["We encouraged customers ___ improvements.", ["to suggest", "suggesting", "suggest"], 0, "Encourage + object + to."], ["He suggested ___ the same logo.", ["keeping", "to keep", "us to keep"], 0, "Suggest + -ing (no object)."], ["We discussed ___ the packaging.", ["changing", "to change", "change"], 0, "Discuss + -ing."], ["They thanked us ___ the excellent service.", ["for", "of", "to"], 0, "Thank someone for + noun/-ing."], ["They accused us ___ selling poor-quality goods.", ["of", "for", "to"], 0, "Accuse someone of + -ing."], ["The supplier refused ___ the price.", ["to lower", "lowering", "us to lower"], 0, "Refuse + to (no object)."], ["Some people wanted ___ no packaging.", ["us to use", "to us use", "us using"], 0, "Want + object + to."], ["The CFO advised ___ the risk assessment first.", ["us to complete", "to complete us", "completing us"], 0, "Advise + object + to."], ["She apologised ___ the delay in the report.", ["for", "of", "to"], 0, "Apologise for + noun/-ing."]]}, {"title": "Leading or Open?", "hint": "Leading questions guide the answer. Open questions let the person decide.", "qs": [["\"What are your thoughts on a two-day conference in Berlin?\"", ["Leading", "Open"], 0, "It suggests a specific answer."], ["\"What are your thoughts on the kind of event you want?\"", ["Open", "Leading"], 0, "The client decides freely."], ["\"Have you considered holding the event in an art gallery?\"", ["Leading", "Open"], 0, "Directs to one option."], ["\"Have you considered what your team would like to do?\"", ["Open", "Leading"], 0, "No answer is suggested."], ["\"How about following the meal with a party?\"", ["Leading", "Open"], 0, "Proposes a specific idea."], ["\"How about some kind of entertainment?\"", ["Open", "Leading"], 0, "General, leaves options open."], ["\"What problems have you had with the new ERP?\"", ["Leading", "Open"], 0, "Assumes there were problems."], ["\"What do you think about the new ERP?\"", ["Open", "Leading"], 0, "Neutral question."], ["Leading questions can be useful in ___.", ["negotiations", "anonymous surveys", "scientific studies"], 0, "They help steer decisions — but use them carefully."]]}]};</script><script src="../assets/app.js"></script></body></html>
