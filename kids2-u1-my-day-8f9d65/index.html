<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kids Level 2 — My Day</title><style>
:root{--wine:#6b1d2e;--gold:#c9a96e;--cream:#faf6ee;--sand:#f5f0e6;--ink:#2c1810;--green:#2e7d54;--red:#b33b3b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:18px Arial,sans-serif}header{background:var(--wine);color:white;padding:14px clamp(14px,4vw,42px);display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{font-size:clamp(20px,4vw,28px);margin:0}header span{color:#f5dcaa;font-size:15px}main{max-width:900px;margin:auto;padding:20px}.progress{height:10px;border-radius:10px;background:#e9dfce;overflow:hidden;margin:0 0 20px}.progress div{height:100%;background:var(--gold);width:0;transition:width .2s}.card{background:white;border:2px solid var(--gold);border-radius:20px;padding:clamp(18px,4vw,32px);box-shadow:0 4px 16px #5a152522}.eyebrow{color:var(--wine);font-size:14px;font-weight:bold;letter-spacing:.04em;text-transform:uppercase}.hero{font-size:clamp(24px,5vw,36px);margin:8px 0 12px;color:var(--wine)}.copy{line-height:1.45}.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn,.choice,.say{border:2px solid var(--wine);border-radius:14px;padding:12px 16px;background:white;color:var(--wine);font-size:17px;font-weight:bold;cursor:pointer}.btn.primary{background:var(--wine);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.choice{display:block;text-align:left;width:100%;margin:8px 0;border-color:#d7c6a5;color:var(--ink)}.choice.selected{outline:3px solid var(--gold);background:#fff8e8}.choice.correct{border-color:var(--green);background:#e8f5eb}.choice.wrong{border-color:var(--red);background:#fff0ef}.feedback{min-height:30px;font-weight:bold;margin:12px 0}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.listenbox,.vocab{background:var(--sand);border-radius:14px;padding:14px;margin:14px 0}.vocabGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.vocabItem{background:white;padding:12px;border:1px solid #d7c6a5;border-radius:12px}.vocabItem b{color:var(--wine)}.small{font-size:14px;color:#65564c}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.track audio{width:min(100%,620px)}.hidden{display:none}.transcript{white-space:pre-wrap;background:#fffdf8;padding:14px;border-left:5px solid var(--gold);line-height:1.6}.stars{color:#b88722;font-weight:bold}.answerKey{background:#edf6ef;border-left:5px solid var(--green);padding:12px}.criteria li{margin:5px 0}.say{font-size:14px;padding:8px 10px}@media(max-width:560px){.controls{flex-direction:column}.controls .btn{width:100%}header{align-items:flex-start;flex-direction:column}}
</style></head><body><header><h1>My Day · Kids Level 2</h1><span>Original unit practice · recorded English audio</span></header><main><div class="progress"><div id="progress"></div></div><section id="app" class="card" aria-live="polite"></section><div class="controls"><button class="btn" id="back">← Back</button><div><button class="btn" id="reset">Reset</button> <button class="btn" id="review">Review answer</button></div><button class="btn primary" id="next">Next →</button></div><p class="small">All voices are pre-recorded English MP3s bundled with this package. The app does not use device speech.</p></main><script>
const ACTIVITIES=[{"lesson":1,"kind":"quiz","title":"My day: first steps","question":"What usually happens before breakfast?","choices":["I wake up.","I go to bed.","I do homework."],"answer":0,"why":"A morning routine begins when you wake up."},{"lesson":1,"kind":"quiz","title":"Read the clock","question":"The clock shows 8:00. What do you say?","choices":["It is eight o'clock.","It is eight thirty.","It is nine o'clock."],"answer":0,"why":"The long hand is at 12 and the hour hand is at 8."},{"lesson":1,"kind":"quiz","title":"She gets up","question":"Choose the correct sentence.","choices":["Rosa gets up at seven.","Rosa get up at seven.","Rosa getting up at seven."],"answer":0,"why":"With he or she in the simple present, add -s to the verb."},{"lesson":2,"kind":"listen","track":0},{"lesson":2,"kind":"quiz","title":"Local clocks","question":"At the same moment, what can be true of two different places?","choices":["Their local clocks can show different times.","Every clock must show the same hour.","A clock can only show night."],"answer":0,"why":"Local clock time depends on the place."},{"lesson":2,"kind":"listen","track":1},{"lesson":3,"kind":"quiz","title":"A safe choice","question":"What is a safe response when you hear thunder outside?","choices":["Go inside and tell an adult.","Stand under a tree.","Touch a metal fence."],"answer":0,"why":"Move indoors and tell an adult."},{"lesson":3,"kind":"quiz","title":"Listen for ee","question":"Which word has the long ee sound?","choices":["sleep","cat","sun"],"answer":0,"why":"Sleep has the long ee sound."},{"lesson":3,"kind":"listen","track":2},{"lesson":4,"kind":"quiz","title":"Read a schedule","question":"Mia gets home at three and does homework at four. What does she do at four?","choices":["She does homework.","She gets home.","She wakes up."],"answer":0,"why":"The schedule says homework at four."},{"lesson":5,"kind":"quiz","title":"Roman numerals","question":"Which Roman numeral means four?","choices":["IV","VI","IX"],"answer":0,"why":"IV means four."},{"lesson":5,"kind":"quiz","title":"What does a sundial use?","question":"How does a sundial show time?","choices":["It uses a shadow.","It uses a song.","It uses a school bag."],"answer":0,"why":"The shadow changes as the sun appears to move across the sky."},{"lesson":5,"kind":"listen","track":3},{"lesson":6,"kind":"open","title":"Time to Speak","question":"Tell a partner two things you do at different times. Add one fact about a sundial.","model":"I wake up at seven. I have breakfast at eight. A sundial uses a shadow to show time.","criteria":["Two ordered routine actions","Two clear o'clock times","One correct sun/shadow fact"]}];const TRACKS=[{"id":"L1-ROSA-MORNING","title":"Rosa's Morning","gist":"What is Rosa's recording mainly about?","gistChoices":["Her daily routine","A trip to the beach","A science experiment"],"gistAnswer":0,"detail":"What does Rosa do at eight o'clock?","detailChoices":["She has breakfast.","She gets ready for bed.","She goes to school."],"detailAnswer":1,"extraDetail":"When does Rosa get home?","extraChoices":["At one o'clock","At three o'clock","At nine o'clock"],"extraAnswer":1,"before":"Picture a school morning. Which routine happens first?","answers":["Her daily routine.","She gets ready for bed.","At three o'clock."],"file":"076ee1b19478.mp3"},{"id":"L2-DIFFERENT-PLACES","title":"Different Places, Local Times","gist":"What is the main idea?","gistChoices":["People in different places can have different local times.","Every place has the same clock time.","A clock can only show night."],"gistAnswer":0,"detail":"Who is going to school?","detailChoices":["Sam","Ana","Mei"],"detailAnswer":0,"extraDetail":"Who is getting ready for bed?","extraChoices":["Sam","Ana","Mei"],"extraAnswer":2,"before":"Look at three place names. Do you think all three clocks show the same hour?","answers":["People in different places can have different local times.","Sam.","Mei."],"file":"1a462c91058e.mp3"},{"id":"L3-RAINY-WALK","title":"A Rainy Walk Home","gist":"What does Mia do when the weather changes?","gistChoices":["She goes inside and tells an adult.","She stands under a tree.","She goes out to play in the storm."],"gistAnswer":0,"detail":"What does Mia say to Ben?","detailChoices":["Can I help?","What time is it?","Where is the sundial?"],"detailAnswer":0,"extraDetail":"Where do they put the books?","extraChoices":["On a dry table","Under a tree","In the street"],"extraAnswer":0,"before":"Think of one safe place to go when you hear thunder outdoors.","answers":["She goes inside and tells an adult.","Can I help?","On a dry table."],"file":"d1a3b48d1ab3.mp3"},{"id":"L5-SHADOW-TIME","title":"How a Sundial Shows Time","gist":"What does a sundial use to show time?","gistChoices":["A shadow","A song","A school bag"],"gistAnswer":0,"detail":"What happens to the shadow as time passes?","detailChoices":["It changes direction and length.","It becomes a clock.","It disappears at noon every day."],"detailAnswer":0,"extraDetail":"Why can't a sundial show time at night?","extraChoices":["It needs daylight.","It needs a loud sound.","It needs a book."],"extraAnswer":0,"before":"Look at the sunlight diagram. What might move or change during the day?","answers":["A shadow.","It changes direction and length.","It needs daylight."],"file":"99b18fcbb60a.mp3"}];const VOCAB=[{"word":"wake up","ipa":"/weɪk ʌp/","example":"I wake up at seven.","definition":"stop sleeping","icon":"☀"},{"word":"get dressed","ipa":"/ɡet drest/","example":"I get dressed after I wake up.","definition":"put on your clothes","icon":"👕"},{"word":"have breakfast","ipa":"/hæv ˈbrekfəst/","example":"We have breakfast before school.","definition":"eat the first meal of the day","icon":"🥣"},{"word":"go to school","ipa":"/ɡoʊ tə skuːl/","example":"I go to school in the morning.","definition":"travel to your classes","icon":"🚌"},{"word":"get home","ipa":"/ɡet hoʊm/","example":"We get home in the afternoon.","definition":"arrive at your home","icon":"🏠"},{"word":"do homework","ipa":"/duː ˈhoʊmwɜːrk/","example":"I do homework before I play.","definition":"complete school work at home","icon":"📚"},{"word":"go to bed","ipa":"/ɡoʊ tə bed/","example":"I go to bed at nine.","definition":"get into bed to sleep","icon":"🌙"}];const AUDIO={"Rosa wakes up at seven o'clock. She gets dressed. She has breakfast at eight. She goes to school at nine. After school, she gets home at three. She does homework with her brother. At eight o'clock, she gets ready for bed.":"076ee1b19478.mp3","It is seven o'clock for Sam. He has breakfast. At that same moment, it is a different local time for Ana in Brazil and Mei in China. People in different places can have different clock times. Sam is going to school. Ana is having dinner. Mei is getting ready for bed.":"1a462c91058e.mp3","Mia walks home after school. Dark clouds move across the sky. She hears thunder. She goes inside and tells an adult. Her friend Ben's books are wet. Mia asks, Can I help? She puts the books on a dry table. Later, they read together.":"d1a3b48d1ab3.mp3","The sun shines on a stick in the ground. The stick makes a shadow. As time passes, the shadow changes direction and length. A sundial uses the shadow to show time. Roman numerals I through XII mark the hours. A sundial needs daylight, so it cannot show time at night.":"99b18fcbb60a.mp3","wake up":"22668bf14ea7.mp3","get dressed":"30ad52a9d525.mp3","have breakfast":"0d53ea02174b.mp3","go to school":"ed84094e15d7.mp3","get home":"d69b65941da5.mp3","do homework":"f95d4e56974e.mp3","go to bed":"9a3de76ff621.mp3","What time is it?":"a18081d2dd02.mp3","It is seven o'clock.":"d76996f81928.mp3","It is eight o'clock.":"798059691f22.mp3","It is nine o'clock.":"e06dc6f55e3a.mp3","It is three o'clock.":"540ac274ee22.mp3","What do you do at seven?":"0b860b22f0da.mp3","I wake up at seven.":"e1f5ac87e3eb.mp3","What does she do?":"129a0287f69a.mp3","She gets up at seven.":"9418781657f6.mp3","Can I help?":"9d30c9ac7fdf.mp3","Yes, please.":"202482320fd1.mp3","Are you okay?":"08b0c73156fc.mp3","Let's read together.":"20bcc5a14214.mp3","sun":"22fa6121da96.mp3","shadow":"ed9d3d832af8.mp3","sundial":"3ade6f8cc236.mp3","Roman numeral":"261388602626.mp3","daylight":"c18b9d45aba5.mp3","thunder":"badcfa3c6274.mp3","cloud":"000e793db70c.mp3","tree":"80655da8d80a.mp3","sleep":"c3ca5f787365.mp3","green":"bc74f4f071a5.mp3","sea":"6fa11fb296a8.mp3","read":"a7afddb68260.mp3","meal":"8504d96b1782.mp3","team":"d25187dc137f.mp3","one":"fe05bcdcdc49.mp3","two":"ad782ecdac77.mp3","three":"b802f384302c.mp3","four":"9f8f7eec5dea.mp3","five":"4db2c1df4610.mp3","six":"bec9703f7a45.mp3","seven":"a00bbe560e6b.mp3","eight":"d479fa0ef925.mp3","nine":"b4ddce182ecf.mp3","ten":"dd3562449147.mp3","eleven":"cc5a0c506761.mp3","twelve":"b521f9394fab.mp3","Great job!":"a2d4f4d7785d.mp3","Try again!":"6c5571c034e4.mp3","Listen again.":"1098e8a0dc25.mp3","Now answer the question.":"674211545db9.mp3","You did it!":"559b1abf4a98.mp3"};let index=0,selected=-1,checked=false,stars=0,listenStage=0,listenAnswers=[];const app=document.getElementById('app');const audioFiles=[];
function playLine(t){const f=AUDIO[t];if(!f)return false;const a=new Audio('audio/'+f);audioFiles.push(a);a.play().catch(()=>{});return true}
function render(){selected=-1;checked=false;listenStage=0;listenAnswers=[];const a=ACTIVITIES[index];document.getElementById('progress').style.width=((index+1)/ACTIVITIES.length*100)+'%';document.getElementById('back').disabled=index===0;document.getElementById('next').textContent=index===ACTIVITIES.length-1?'Finish ✓':'Next →';if(a.kind==='listen'){renderListen(a);return}if(a.kind==='open'){app.innerHTML='<div class="eyebrow">Lesson '+a.lesson+' · Speaking synthesis</div><h2 class="hero">'+a.title+'</h2><p class="copy">'+a.question+'</p><textarea id="response" rows="4" style="width:100%;font:18px Arial;padding:12px;border:2px solid #d7c6a5;border-radius:12px" aria-label="Your response"></textarea><div class="row"><button class="btn primary" id="check">Show my model</button></div><div id="feedback" class="feedback"></div><div id="model" class="answerKey hidden"><b>Possible model:</b> '+a.model+'<ul class="criteria">'+a.criteria.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';document.getElementById('check').onclick=()=>{document.getElementById('model').classList.remove('hidden');document.getElementById('feedback').textContent='Compare your ideas with the success criteria.';document.getElementById('feedback').className='feedback good'};return}app.innerHTML='<div class="eyebrow">Lesson '+a.lesson+' · Practice '+(index+1)+'</div><h2 class="hero">'+a.title+'</h2><p class="copy">'+a.question+'</p><div>'+a.choices.map((c,i)=>'<button class="choice" data-i="'+i+'">'+c+(AUDIO[c]?' <span class="small">🔊</span>':'')+'</button>').join('')+'</div><div class="row"><button class="btn primary" id="check">Check</button><button class="btn" id="retry">Retry</button><button class="btn" id="show">Show answer</button></div><div id="feedback" class="feedback" role="status"></div><div class="vocabGrid">'+VOCAB.filter((_,i)=>i<4).map(v=>'<div class="vocabItem"><span style="font:24px Segoe UI Emoji">'+v.icon+'</span> <b>'+v.word+'</b><div class="small">'+v.ipa+' · '+v.definition+'</div><div class="small">'+v.example+'</div><button class="say" data-word="'+v.word+'">🔊 Listen</button></div>').join('')+'</div>';app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(checked)return;app.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=Number(b.dataset.i)});document.getElementById('check').onclick=()=>checkQuiz(a);document.getElementById('retry').onclick=()=>{selected=-1;checked=false;app.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected','correct','wrong'));document.getElementById('feedback').textContent='';};document.getElementById('show').onclick=()=>showQuizAnswer(a);app.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>playLine(b.dataset.word));}
function checkQuiz(a){const f=document.getElementById('feedback');if(selected<0){f.textContent='Choose an answer first.';f.className='feedback bad';return}checked=true;const buttons=[...app.querySelectorAll('.choice')];if(selected===a.answer){buttons[selected].classList.add('correct');f.textContent='Great job! '+a.why;f.className='feedback good';stars++;}else{buttons[selected].classList.add('wrong');buttons[a.answer].classList.add('correct');f.textContent='Try again. '+a.why;f.className='feedback bad';}document.querySelector('header span').innerHTML='⭐ <span class="stars">'+stars+'</span> · recorded English audio'}
function showQuizAnswer(a){const buttons=[...app.querySelectorAll('.choice')];buttons[a.answer]?.classList.add('correct');const f=document.getElementById('feedback');f.textContent='Answer: '+a.choices[a.answer]+'. '+a.why;f.className='feedback good'}
function renderListen(a){const t=TRACKS[a.track];app.innerHTML='<div class="eyebrow">Lesson '+a.lesson+' · Listening</div><h2 class="hero">'+t.title+'</h2><p class="copy"><b>Before listening:</b> '+t.before+'</p><div class="listenbox track"><button id="play" class="btn primary">▶ Play English clip</button> <button id="again" class="btn">↻ Listen again</button><audio id="clip" preload="metadata" src="audio/'+t.file+'"></audio><p class="small">First listen for the main idea. Listen again for details.</p></div><div id="questions"></div><div id="answer" class="answerKey hidden"></div><div id="transcript" class="transcript hidden"></div><div class="row"><button id="startQuestions" class="btn primary">I listened — start questions</button><button id="showTranscript" class="btn hidden">Show transcript</button></div><div id="feedback" class="feedback" role="status"></div>';const clip=document.getElementById('clip');document.getElementById('play').onclick=()=>{clip.currentTime=0;clip.play().catch(()=>{});};document.getElementById('again').onclick=()=>{clip.currentTime=0;clip.play().catch(()=>{});};document.getElementById('startQuestions').onclick=()=>{listenStage=1;renderListenQuestion(a,t)};document.getElementById('showTranscript').onclick=()=>{const el=document.getElementById('transcript');el.textContent=t.text;el.classList.remove('hidden');document.getElementById('showTranscript').disabled=true};}
function renderListenQuestion(a,t){const q=listenStage===1?{prompt:'First listen · gist',question:t.gist,choices:t.gistChoices,answer:t.gistAnswer}:listenStage===2?{prompt:'Second listen · detail 1',question:t.detail,choices:t.detailChoices,answer:t.detailAnswer}:listenStage===3?{prompt:'Second listen · detail 2',question:t.extraDetail,choices:t.extraChoices,answer:t.extraAnswer}:null;if(!q){document.getElementById('questions').innerHTML='';const key=document.getElementById('answer');key.classList.remove('hidden');key.innerHTML='<b>Answer key</b><ol>'+t.answers.map(x=>'<li>'+x+'</li>').join('')+'</ol>';document.getElementById('showTranscript').classList.remove('hidden');return}document.getElementById('questions').innerHTML='<h3>'+q.prompt+'</h3><p>'+q.question+'</p>'+q.choices.map((c,i)=>'<button class="choice" data-i="'+i+'">'+c+'</button>').join('')+'<button id="checkListening" class="btn primary">Check</button>';let picked=-1;document.querySelectorAll('#questions .choice').forEach(b=>b.onclick=()=>{picked=Number(b.dataset.i);document.querySelectorAll('#questions .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('checkListening').onclick=()=>{if(picked<0){document.getElementById('feedback').textContent='Choose an answer first.';document.getElementById('feedback').className='feedback bad';return}const right=picked===q.answer;document.querySelectorAll('#questions .choice')[q.answer].classList.add('correct');if(!right)document.querySelectorAll('#questions .choice')[picked].classList.add('wrong');listenAnswers.push(q.choices[q.answer]);document.getElementById('feedback').textContent=(right?'Correct. ':'Answer: ')+q.choices[q.answer];document.getElementById('feedback').className='feedback '+(right?'good':'bad');setTimeout(()=>{listenStage++;renderListenQuestion(a,t)},350)};}
document.getElementById('back').onclick=()=>{if(index>0){index--;render()}};document.getElementById('next').onclick=()=>{if(index<ACTIVITIES.length-1){index++;render()}else{app.innerHTML='<div class="eyebrow">Unit complete</div><h2 class="hero">You did it!</h2><p class="stars">⭐ '+stars+' practice stars</p><p>Tell a partner one routine, one time, and one fact about a sundial.</p><button class="btn" id="restart">Play again</button>';document.getElementById('restart').onclick=()=>{index=0;stars=0;render()}}};document.getElementById('reset').onclick=()=>render();document.getElementById('review').onclick=()=>{const a=ACTIVITIES[index];if(a.kind==='quiz')showQuizAnswer(a);else if(a.kind==='listen'){const t=TRACKS[a.track];document.getElementById('answer').classList.remove('hidden');document.getElementById('answer').innerHTML='<b>Answer key</b><ol>'+t.answers.map(x=>'<li>'+x+'</li>').join('')+'</ol>';document.getElementById('showTranscript').classList.remove('hidden')}else if(a.kind==='open')document.getElementById('check').click()};render();
</script></body></html>
