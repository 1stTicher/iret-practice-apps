<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 12 — Looking Back Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title": "Unit 12 — Looking Back Practice App", "tag": "LEVEL 4 · UNIT 12", "sub": "Sensory adjectives, memory words, emphasis & substitution", "sections": [{"title": "Sensory Adjectives", "cards": [["bright", "Full of strong light or color.", "The stadium lights were so bright on game night."], ["colorful", "Having many bright colors.", "The fans wore colorful jerseys."], ["damp", "A little wet, often in an unpleasant way.", "The old storage room for the files was damp and cold."], ["deep", "Low and strong (for a sound or voice).", "The coach has a deep voice."], ["flavorful", "Having a lot of good taste.", "My grandmother's mole was always so flavorful."], ["fresh", "Clean, new, or recently made.", "I love the smell of fresh coffee in the morning."], ["high-pitched", "Very high (for a sound).", "The referee's whistle is very high-pitched."], ["melodic", "Pleasant to listen to, like music.", "The song has a very melodic guitar line."], ["musty", "Smelling old and wet.", "The old archive of paper invoices smelled musty."], ["rough", "Not smooth to touch.", "The hockey stick felt rough in my hands."]]}, {"title": "Memory Words", "hint": "Choose the best word.", "qs": [["I have a ___ memory of my first day at work — I remember every detail.", ["clear", "vague", "distant"], 0, "Clear = easy to remember in detail."], ["My memories of kindergarten are very ___. I don't remember much.", ["vague", "clear", "recent"], 0, "Vague = not clear."], ["Can you ___ the name of your first boss?", ["recall", "recent", "early"], 0, "Recall = remember."], ["I didn't ___ him at first. He looked so different!", ["recognize", "recall", "remember of"], 0, "Recognize = know someone when you see them."], ["My ___ memory is terrible. I forget where I put my phone every day.", ["short-term", "long-term", "childhood"], 0, "Short-term memory = remembering recent things."], ["Our ___ memories come from when we were very young.", ["earliest", "recentest", "vaguest"], 0, "Early → earliest = from the first part of your life."], ["The most ___ audit I did was last week.", ["recent", "distant", "early"], 0, "Recent = happened a short time ago."], ["Watching hockey always brings back ___ memories.", ["childhood", "short-term", "recent"], 0, "Childhood memories = from when you were a child."], ["It's a ___ memory now — it happened 20 years ago.", ["distant", "recent", "fresh"], 0, "Distant = far away in time."]]}, {"title": "Adding Emphasis", "hint": "What I... / The thing I... + be + the idea you want to emphasize.", "qs": [["___ I love about the gym is the music.", ["What", "That", "Which"], 0, "What I love is... puts the focus at the end."], ["The thing I hate ___ long meetings.", ["is", "are", "be"], 0, "Be connects the two parts (singular here)."], ["What I need right now ___ a vacation.", ["is", "are", "am"], 0, "The idea emphasized is singular → is."], ["What I miss ___ my friends from university.", ["are", "is", "be"], 0, "Plural noun → are is possible."], ["Which sentence adds emphasis correctly?", ["What I really enjoy is watching the NFL on Sundays.", "I really enjoy is watching the NFL on Sundays.", "What I really enjoy watching the NFL on Sundays."], 0, "What + subject + verb + be + focus."], ["The thing I remember most ___ the noise of the crowd.", ["is", "are", "was being"], 0, "The thing I... + is + focus."]]}, {"title": "Substitution", "hint": "Avoid repeating words with one/ones, auxiliaries, or so.", "qs": [["I don't like these jerseys. I prefer the red ___.", ["ones", "one", "it"], 0, "Plural count noun → ones."], ["My laptop is old. I need a new ___.", ["one", "ones", "it"], 0, "Singular count noun → one."], ["\"Did you finish the report?\" \"Yes, I ___.\"", ["did", "finished", "do"], 0, "Use the auxiliary instead of repeating the verb."], ["\"Is the meeting at 10?\" \"I think ___.\"", ["so", "it", "one"], 0, "So replaces the whole clause."], ["She has worked here for years, and so ___ I.", ["have", "did", "am"], 0, "Auxiliary for the present perfect → have."], ["\"Will we win tonight?\" \"I hope ___!\"", ["so", "it", "one"], 0, "I hope so = I hope we will win."]]}, {"title": "Remembering Together", "hint": "Classify the phrase.", "qs": [["\"Don't tell me you don't remember.\"", ["Prompting a response", "Recalling a memory"], 0, "You push the other person to remember."], ["\"That rings a bell.\"", ["Recalling a memory", "Prompting a response"], 0, "It sounds familiar to you."], ["\"Do you remember that time we...?\"", ["Prompting a response", "Recalling a memory"], 0, "You invite someone to remember."], ["\"It's all coming back to me now.\"", ["Recalling a memory", "Prompting a response"], 0, "You start to remember."], ["\"That whole period's a bit vague...\"", ["Recalling a memory", "Prompting a response"], 0, "You don't remember clearly."], ["\"I don't recall...\"", ["Recalling a memory", "Prompting a response"], 0, "A formal way to say you don't remember."]]}]};</script><script src="../assets/app.js"></script></body></html>
