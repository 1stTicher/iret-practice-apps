n droughts last longer.", ["face", "pose", "protect"], 0, "face difficulties."], ["We need ___ solutions, not quick fixes.", ["sustainable", "unstable", "potential"], 0, "sustainable solutions."], ["A changing tax law creates an ___ business environment.", ["unstable", "extreme", "growing"], 0, "unstable environment."], ["The ___ environment includes competitors, customers and regulations.", ["business", "human", "mobile"], 0, "business environment."], ["Coffee ___, growers and plantations are all at risk.", ["production", "solution", "threat"], 0, "coffee production."]]}, {"title": "Compound Nouns", "hint": "The first word is usually singular and describes the second.", "qs": [["What kind of group? A ___ group.", ["focus", "focuses", "focusing"], 0, "focus group."], ["Plural of 'product manager':", ["product managers", "products manager", "products managers"], 0, "Only the second word becomes plural."], ["noun + -ing:", ["event marketing", "managing director", "checkout"], 0, "event (noun) + marketing (-ing)."], ["-ing + noun:", ["outstanding invoices", "book-keeping", "central bank"], 0, "outstanding (-ing) + invoices."], ["verb + adverb:", ["takeover", "market research", "trading company"], 0, "take (verb) + over (adverb)."], ["adjective + noun:", ["direct marketing", "brainstorming", "giveaway"], 0, "direct (adj) + marketing."], ["Which is a compound noun written as one word?", ["website", "focus group", "product manager"], 0, "website."], ["The ___ of the plan are the high costs.", ["drawbacks", "drawback's", "drawsback"], 0, "draw + back → drawbacks."]]}, {"title": "Compound Adjectives", "hint": "Use a hyphen before the noun.", "qs": [["The strategy for the short term is clear. → The ___ strategy is clear.", ["short-term", "short term", "shorts-term"], 0, "Hyphen before the noun."], ["A website that is friendly for mobiles is a ___ website.", ["mobile-friendly", "mobile friendly's", "friendly-mobile"], 0, "mobile-friendly."], ["A meeting that lasts two hours i
