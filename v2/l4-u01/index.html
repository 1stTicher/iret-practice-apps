<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 1 — And We're Off! Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title": "Unit 1 — And We're Off! Practice App", "tag": "LEVEL 4 · UNIT 1", "sub": "Achievements, personal qualities, tense review & introductions", "sections": [{"title": "Achievements", "cards": [["break a record", "Do something better or faster than anyone before.", "My cousin broke a record swimming across our local lake."], ["face your fear", "Do something that scares you.", "I faced my fear of flying and took the flight to my friend's wedding."], ["get a lot of likes", "Receive many reactions on social media.", "My photos from Peru got a lot of likes."], ["have a sense of humor", "Be able to laugh and make others laugh.", "My coworker has a great sense of humor."], ["rise to the challenge", "Do well in a difficult situation.", "After the storm, local volunteers rose to the challenge and cleaned the park."], ["run a marathon", "Run a 42-kilometer race.", "My goal is to run a marathon next year."], ["run a business", "Manage your own company.", "Running a business is hard work, but I enjoy it."], ["set a goal for yourself", "Decide something you want to achieve.", "I set a goal for myself: learn to speak English with confidence."], ["take pride in something", "Feel happy and proud about what you do.", "We take pride in the quality of our work."], ["tell a joke", "Say something funny to make people laugh.", "Max always tells funny jokes at lunch."], ["win a medal", "Get a prize for finishing first, second or third.", "He won a gold medal in a 200-meter race."], ["work with your hands", "Do physical or manual work.", "I enjoy working with my hands, so I started doing pottery."]]}, {"title": "Personal Qualities", "hint": "Choose the correct form: adjective or noun.", "qs": [["She is very ___. She wants to be a manager someday.", ["ambitious", "ambition", "ambitiously"], 0, "After be → adjective."], ["He has a lot of ___ for his job. He loves it!", ["enthusiasm", "enthusiastic", "enthusiast"], 0, "After 'a lot of' → noun."], ["I feel ___ about my job interview.", ["confident", "confidence", "confide"], 0, "Feel + adjective."], ["Working with children involves a lot of ___.", ["responsibility", "responsible", "response"], 0, "After 'a lot of' → noun."], ["Paul has ten years of ___ as a nurse.", ["experience", "experienced", "experiences of"], 0, "Years of + noun."], ["Tell me why you are ___ for this position.", ["qualified", "qualification", "quality"], 0, "Be qualified for = have the right skills."], ["Raul shows great ___ in his paintings.", ["creativity", "creative", "create"], 0, "Show + noun."], ["The hotel staff were very ___ and kind.", ["polite", "politeness", "politely"], 0, "Were + adjective."], ["___ is important to me. Please don't lie.", ["Truthfulness", "Truthful", "Truth fully"], 0, "Subject of the sentence → noun."], ["My aunt is a ___ artist. Her paintings are in museums.", ["successful", "success", "succeed"], 0, "Adjective before a noun."]]}, {"title": "Tense Review", "hint": "Which tense is used?", "qs": [["\"What kind of music do you listen to?\"", ["Simple present", "Present continuous", "Present perfect"], 0, "Habits and likes → simple present."], ["\"I'm listening to a lot of Latin music right now.\"", ["Present continuous", "Simple present", "Past continuous"], 0, "Temporary actions now → present continuous."], ["\"What did you do for your last birthday?\"", ["Simple past", "Present perfect", "Past continuous"], 0, "Finished past action with a time → simple past."], ["\"I was playing soccer when I fell.\"", ["Past continuous", "Simple past", "Present perfect continuous"], 0, "Background action in the past → past continuous."], ["\"Have you ever lived in another country?\"", ["Present perfect", "Simple past", "Present continuous"], 0, "Life experience, no specific time → present perfect."], ["\"I've been living here for five years.\"", ["Present perfect continuous", "Present perfect", "Past continuous"], 0, "Started in the past and continues → present perfect continuous."], ["I ___ to the gym every Monday.", ["go", "am going", "have gone"], 0, "Routine → simple present."], ["How long ___ English?", ["have you been studying", "are you studying", "did you study"], 0, "Duration until now → present perfect continuous."], ["I ___ the new series yet.", ["haven't seen", "didn't see", "wasn't seeing"], 0, "Yet → present perfect."], ["She ___ dinner when the phone rang.", ["was cooking", "cooked", "has cooked"], 0, "Action in progress interrupted → past continuous."]]}, {"title": "Stative vs Dynamic", "hint": "Stative verbs (know, believe, want...) are usually not used in continuous forms.", "qs": [["Choose the correct sentence.", ["I know the answer.", "I'm knowing the answer."], 0, "Know is stative."], ["Choose the correct sentence.", ["She wants a new job.", "She is wanting a new job."], 0, "Want is stative."], ["This skate park is great! Which is correct here?", ["I'm loving it!", "I'm love it!"], 0, "Love can be dynamic when you enjoy something at the moment."], ["Choose the correct sentence.", ["I'm thinking about changing jobs.", "I think about changing jobs right now."], 0, "Think = consider (in progress) → dynamic."], ["Choose the correct sentence.", ["This soup tastes great.", "This soup is tasting great."], 0, "Taste (sense) is stative."], ["Choose the correct sentence.", ["I understand the instructions.", "I'm understanding the instructions."], 0, "Understand is stative."], ["We ___ dinner right now. Can I call you later?", ["'re having", "have got"], 0, "Have = eat → dynamic."], ["He ___ a car and a motorcycle.", ["owns", "is owning"], 0, "Own (possession) is stative."]]}, {"title": "Introductions", "hint": "Choose the best response.", "qs": [["Meeting someone new at work:", ["I don't think we've met before.", "Yeah, we go way back.", "Nice to see you again."], 0, "Used the first time you meet someone."], ["\"Have you met Pedro?\" (You haven't.)", ["No, I haven't. Hi, I'm...", "Yes, we go way back.", "Nice to see you again."], 0, "Answer no and introduce yourself."], ["\"Do you two know each other?\" (You've been friends for years.)", ["Yeah, we go way back.", "No, I don't.", "I don't think we've met."], 0, "We go way back = we've known each other for a long time."], ["You met someone this morning and see them again:", ["Yes, we met this morning! Nice to see you again.", "I don't think we've met before.", "Is this your first day?"], 0, "Nice to see you again = after a previous meeting."], ["You want to help a new colleague meet people:", ["Let me introduce you to some people.", "We go way back.", "I'm not sure, but hi."], 0, "Offer to introduce someone."], ["\"Do you know Ana?\" (You're not sure.)", ["I'm not sure, but hi, I'm...", "Yeah, we go way back.", "Yes, we met yesterday."], 0, "A friendly answer when you don't remember."]]}]};</script><script src="../assets/app.js"></script></body></html>
