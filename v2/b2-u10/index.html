<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 10 — Spend, Spend, Spend Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title":"Unit 10 — Spend, Spend, Spend Practice App","tag":"B2 FIRST · UNIT 10","sub":"Shopping, open cloze, phrasal verbs, ability and clear exam speaking","sections":[{"title":"Money & Shopping Vocabulary","hint":"Flip each card for a B2 meaning and example.","cards":[["value for money","Good quality compared with the price.","This laptop offers good value for money."],["shop around","Compare prices at different shops before buying.","I shopped around before choosing a new phone."],["a bargain","Something bought for a surprisingly low price.","The coat was a bargain at half price."],["make ends meet","Have just enough money for necessary expenses.","Many families find it hard to make ends meet."],["impulse purchase","Something you buy without planning to.","That expensive watch was an impulse purchase."],["refund","Money returned after you give something back.","I asked for a refund when the headphones broke."],["receipt","A document showing that you paid for something.","Keep the receipt in case you need a refund."],["afford","Have enough money to pay for something.","We can't afford a luxury hotel this month."],["cut back on","Reduce the amount you use or spend.","I'm cutting back on takeaways to save money."],["worthwhile","Useful or valuable enough to justify the effort or cost.","The course was a worthwhile investment."],["get into debt","Owe money, often because you borrowed or overspent.","It's easy to get into debt with a credit card."],["live within your means","Spend no more money than you can afford.","A budget helps you live within your means."]]},{"title":"Open Cloze Practice","hint":"B2 Reading & Use of English Part 2 tests grammar and fixed expressions.","qs":[["She spent far more money ___ she intended.",["than","as","then"],0,"Far more ... than is a comparative structure."],["We decided to cut back ___ unnecessary purchases.",["on","at","to"],0,"The phrasal verb is cut back on."],["I haven't bought anything online ___ last month.",["since","for","during"],0,"Since + a starting point in time."],["The new model isn't as expensive ___ the old one.",["as","than","like"],0,"As + adjective + as makes an equality comparison."],["I'm looking forward ___ getting my new laptop.",["to","for","at"],0,"Look forward to + -ing."],["Neither the customer ___ the salesperson knew the correct price.",["nor","or","but"],0,"Neither ... nor links two negative alternatives."],["By the time the sale started, the most popular items ___ already sold out.",["had","have","were"],0,"Past perfect: had sold out."],["She asked whether the product was available ___ stock.",["in","on","at"],0,"The fixed phrase is in stock."],["If I ___ compared prices, I would have saved money.",["had","have","would"],0,"Third conditional if-clause: had + past participle."],["There were too ___ people in the queue to enter the store.",["many","much","little"],0,"Use many with plural countable nouns."]]},{"title":"Arrive, Get & Reach","hint":"Choose the verb and preposition that sound natural.","qs":[["The package ___ at the warehouse just before noon.",["arrived","reached to","got in"],0,"Arrive at + specific place: arrived at the warehouse."],["We finally ___ the airport after a long drive.",["reached","arrived","got"],0,"Reach takes a direct object without a preposition."],["What time did you ___ to the meeting?",["get","reach","arrive"],0,"Get to a place; reach the meeting has no 'to'."],["The delivery van ___ in Madrid at 9 p.m.",["arrived","reached","got to"],0,"Arrive in + city/country."],["By lunchtime, the shipment had ___ its destination.",["reached","arrived","got to"],0,"Reach + a direct object, with no preposition."],["How can we ___ the customer before the deadline?",["reach","arrive","get at"],0,"Reach a person can mean contact them."],["She ___ at the office early this morning.",["arrived","reached","got"],0,"Arrive at + a location."],["We didn't ___ home until nearly midnight.",["get","get to","arrive at"],0,"Get home: no 'to' before home."]]},{"title":"Phrasal Verbs at Work","hint":"Pick the natural verb phrase.","qs":[["The manager will ___ the new project next month.",["take over","pull in","get to"],0,"Take over = assume control or responsibility."],["Our website managed to ___ more customers during the sale.",["pull in","take after","give off"],0,"Pull in customers means attract them."],["We need to ___ a practical solution before Friday.",["come up with","get over to","go down on"],0,"Come up with = think of or produce an idea."],["I had to ___ my purchase because the total was too high.",["cut back on","take over","run into"],0,"Cut back on = reduce; here it means reduce planned spending."],["The price is too high, so I'll ___ for a better deal.",["shop around","look after","get by with"],0,"Shop around = compare options and prices."],["The supplier promised to ___ the missing items tomorrow.",["send out","take after","run away"],0,"Send out means dispatch."],["Let's ___ the proposal carefully before signing.",["go over","go off","go into debt"],0,"Go over = review."],["We ___ an unexpected problem during the delivery.",["ran into","took off","brought up to"],0,"Run into a problem = encounter it."]]},{"title":"Ability: Could & Managed To","hint":"Distinguish general ability from one specific achievement.","qs":[["When she was younger, she ___ run ten kilometres easily.",["could","managed to","was able for"],0,"Could expresses general ability in the past."],["Despite the delay, we ___ deliver the parcel on time yesterday.",["managed to","could","can"],0,"Managed to emphasizes a successful action on one occasion."],["In the future, our team ___ track every order automatically.",["will be able to","could to","is able"],0,"Future ability: will be able to."],["He ___ read when he was four years old.",["could","managed to","will be able"],0,"Could is a natural choice for general past ability."],["We ___ resolve the complaint after several calls.",["were able to","could to","can to"],0,"Were able to describes a specific successful result."],["I haven't ___ understand the speaker very well this week.",["been able to","could","able"],0,"Present perfect ability: haven't been able to."],["Which sentence is correct?",["They succeeded in fixing the issue.","They succeeded to fix the issue.","They succeeded fixing to the issue."],0,"Succeed in + -ing."],["She ___ attend tomorrow if her schedule changes.",["might be able to","might can","may able to"],0,"After might, use be able to."],["Even though the system crashed, we ___ save all the data.",["managed to","could to","can to"],0,"Managed to focuses on an achieved outcome."],["By next year, I hope I ___ speak much more fluently.",["will be able to","will can","could to"],0,"Will be able to is a standard future form."]]},{"title":"Speaking & Review Writing","hint":"B2 First practice: choose a useful strategy.","qs":[["For Speaking Part 1, a strong answer usually includes ___.",["an answer, a reason and a relevant example","a memorised two-minute lecture","only yes or no"],0,"A concise answer plus reason and example gives clear development."],["If you want a moment to think, say ___.",["Let me think about that for a moment.","I no know the answer.","Question is impossible."],0,"A natural filler buys time without ending the answer."],["A B2 review should typically include ___.",["description, evaluation and recommendation","only a summary of prices","a formal complaint with no opinion"],0,"Reviews evaluate the experience for a specific audience."],["Which sentence sounds most natural in a review?",["I'd definitely recommend this place for its friendly service.","This place is recommend because service nice.","I much recommend place service."],0,"Recommend + object, and a clear reason, are natural."],["A good opening for a review of a café is ___.",["If you're looking for somewhere relaxed to meet friends, this café is worth trying.","Dear Sir or Madam, I demand a refund.","Once upon a time a café had existed."],0,"Match the tone and audience of a review."],["To improve pronunciation in connected speech, you should ___.",["link final consonants to following vowels naturally","pause after every word","stress every syllable equally"],0,"Linking helps speech sound smoother."],["Which sentence expresses balanced advice?",["It's convenient, although delivery can be expensive.","It's convenient despite it costs more.","Convenient is it delivery."],0,"Although + full clause expresses contrast."],["The clearest conclusion to a product review is ___.",["Overall, I'd recommend it for everyday use, but not for heavy travel.","There is no conclusion because reasons.","I hope the internet likes money."],0,"Finish with a justified overall judgement."]]},{"title":"Practical Speaking Scenarios","hint":"Read the prompt, flip for language support, and speak aloud.","cards":[["Compare buying online and in a shop.","Shopping online is convenient, whereas in-store shopping lets you ___."],["Explain a worthwhile purchase.","I think ___ was worth paying for because ___."],["Give a client two delivery options.","We can offer ___, but we can't guarantee ___."],["Describe a successful workplace problem-solving moment.","We managed to ___, despite ___."],["Make a polite recommendation.","I'd recommend ___ because ___, although ___."],["Review a recent service experience.","Overall, I found the service ___; the best thing was ___."],["Talk about a spending habit you changed.","I used to spend money on ___, but now I cut back on ___."],["Speak for 30 seconds about value.","For me, value for money means ___. For example, ___."]]}]};</script><script src="../assets/app.js"></script></body></html>
