<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 10 — What If...? Practice App</title><link rel="stylesheet" href="../assets/app.css"></head><body><script>window.APP={"title": "Unit 10 — What If...? Practice App", "tag": "LEVEL 4 · UNIT 10", "sub": "Mistakes, past unreal conditionals & telling great stories", "sections": [{"title": "Mistakes Vocabulary", "hint": "Tap the card to see the meaning and an example.", "cards": [["blame", "To say someone is responsible for something bad.", "The manager blamed the IT system for the late report."], ["blunder", "A big, careless mistake.", "Sending the draft audit to the client was a huge blunder."], ["confusion", "A situation where people don't understand what is happening.", "There was confusion about which version of the spreadsheet was final."], ["epic fail", "(informal) A very big, often funny, failure.", "The kicker missed a 20-yard field goal — an epic fail!"], ["fault", "Responsibility for a mistake.", "It wasn't your fault. The numbers were wrong in the system."], ["misunderstanding", "When people understand something differently.", "Because of a misunderstanding, we prepared the wrong quarter's report."], ["mix-up", "A mistake where one thing is confused with another.", "There was a mix-up with the tickets, so we sat in the wrong section."]]}, {"title": "Vocabulary Quiz", "hint": "Choose the best word.", "qs": [["The coach took the ___ for the loss. He said it was his decision.", ["blame", "mix-up", "confusion"], 0, "\"Take the blame\" = accept responsibility for something bad."], ["There was a ___ with the invoices: client A got client B's bill.", ["mix-up", "fault", "blame"], 0, "A mix-up = one thing confused with another."], ["I'm sorry, it was my ___. I forgot to send the file.", ["fault", "epic fail", "confusion"], 0, "\"It's my fault\" = I am responsible."], ["Deleting the whole database? That was a serious ___.", ["blunder", "misunderstanding", "mix-up"], 0, "A blunder is a big, careless mistake."], ["The new tax rules caused a lot of ___ in the office.", ["confusion", "fault", "blame"], 0, "Confusion = people don't understand clearly."], ["It was just a ___. I thought the meeting was on Tuesday, not Thursday.", ["misunderstanding", "blunder", "blame"], 0, "A misunderstanding = understanding something differently."], ["The goalie scored on his own net. Total ___!", ["epic fail", "fault", "confusion"], 0, "\"Epic fail\" is informal for a very big failure."], ["Don't ___ yourself. Everyone makes mistakes during audit season.", ["blame", "mix-up", "blunder"], 0, "Blame (verb) = say someone is responsible."]]}, {"title": "Past Unreal Conditionals", "hint": "if + past perfect → would have / might have + past participle.", "qs": [["If we ___ the numbers, we wouldn't have made that mistake in the report.", ["had checked", "checked", "would check"], 0, "The if clause uses the past perfect: had + past participle."], ["If the quarterback had thrown earlier, they ___ the game.", ["might have won", "would win", "had won"], 0, "Main clause: might have / would have + past participle. \"Might\" = less certain."], ["If I had known about the deadline, I ___ earlier.", ["would have started", "would start", "had started"], 0, "Imagined past result: would have + past participle."], ["What ___ if you hadn't studied accounting?", ["would you have done", "you would have done", "would you do"], 0, "Questions: question order only in the main clause."], ["If she ___ the train, she would have arrived on time.", ["hadn't missed", "didn't miss", "wouldn't have missed"], 0, "Negative in the if clause: hadn't + past participle."], ["We ___ the client if we had answered faster.", ["might not have lost", "didn't lose", "hadn't lost"], 0, "Use might not have when you're not sure about the result."], ["If the team ___ harder in training, they would have made the playoffs.", ["had worked", "worked", "would have worked"], 0, "If clause = past perfect."], ["Which sentence is correct?", ["If I had gone to the gym, I would have felt better.", "If I would have gone to the gym, I had felt better.", "If I went to the gym, I would have felt better."], 0, "Never use would have in the if clause."], ["If you had asked me, I ___ you.", ["would have helped", "helped", "would help"], 0, "Imagined past result → would have helped."], ["If the auditors ___ the error, the company would have paid a big fine.", ["hadn't found", "didn't find", "wouldn't find"], 0, "Past perfect negative in the if clause."]]}, {"title": "Modals of Past Probability", "hint": "modal + have + past participle.", "qs": [["The presentation was boring. You ___ it more interesting.", ["could have made", "could make", "must make"], 0, "Could have = possible, but it didn't happen."], ["They played perfectly. They simply ___ harder.", ["couldn't have tried", "could have tried", "must have try"], 0, "Couldn't have = impossible."], ["The report isn't on my desk. Someone ___ it.", ["must have taken", "must take", "could take"], 0, "Must have = you are almost sure it happened."], ["I'm not sure where my keys are. I ___ them at the gym.", ["might have left", "must leave", "couldn't have left"], 0, "Might have = maybe it happened."], ["He ___ the email — he was on vacation with no internet.", ["couldn't have sent", "must have sent", "could send"], 0, "You're sure it was impossible → couldn't have."], ["The stadium was full. Tickets ___ very expensive.", ["must have been", "could be", "must be"], 0, "Strong conclusion about the past → must have been."], ["We lost by one point. We ___ that game!", ["could have won", "must have won", "couldn't have won"], 0, "It was possible, but it didn't happen → could have."], ["Which sentence is correct?", ["She might have forgotten the meeting.", "She might has forgotten the meeting.", "She might have forget the meeting."], 0, "Always: modal + have (not has) + past participle."], ["The numbers don't match. The intern ___ a mistake.", ["may have made", "may make", "may made"], 0, "May have / might have = possible explanation."], ["You ___ me! I would have helped you.", ["could have called", "could call", "must have called"], 0, "Could have = a possibility in the past that didn't happen."]]}, {"title": "Keep Your Listener Engaged", "hint": "Choose the phrase that fits the story best.", "qs": [["Before telling something shocking: \"___ My boss gave everyone Friday off!\"", ["You won't believe this, but...", "In the end...", "Isn't that amazing?"], 0, "Use it to introduce surprising news."], ["After one surprise, adding another: \"We finished the audit early. ___ The client paid a bonus!\"", ["But that's not all!", "You know what?", "Wouldn't you know it?"], 0, "Use it to add more surprising information."], ["Preparing the listener: \"___ We got tickets for the Super Bowl!\"", ["Are you ready for this?", "That's not all!", "You can imagine!"], 0, "Builds suspense before big news."], ["When bad luck happens at the worst moment: \"I was almost at the office and — ___ — it started raining.\"", ["wouldn't you know it", "isn't that amazing", "are you ready for this"], 0, "Expresses typical bad luck."], ["After describing a stressful situation: \"We had three deadlines on the same day. ___\"", ["You can imagine!", "Are you ready for this?", "But that's not all!"], 0, "Invites the listener to imagine how it felt."], ["After amazing news: \"He ran the marathon in under three hours. ___\"", ["Isn't that amazing?", "Wouldn't you know it?", "You know what?"], 0, "Asks the listener to share your surprise."], ["Starting a new, interesting point casually: \"___ I think I'm going to learn to play hockey.\"", ["You know what?", "But that's not all!", "You can imagine!"], 0, "A casual way to introduce an idea."]]}]};</script><script src="../assets/app.js"></script></body></html>
