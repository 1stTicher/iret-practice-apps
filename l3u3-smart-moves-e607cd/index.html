<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Moves · Practice</title>
<style>
  :root { --wine:#722F37; --gold:#C5A059; --bg:#FFFAF0; --card:#FFFFFF; --soft:#F6ECE4; --text:#1A1A1A; --muted:#555555;
          --ok:#2D7A4A; --okbg:#E3F1E8; --bad:#B04545; --badbg:#F8E5E5; --line:#EADFC8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--wine); color:#fff; padding:14px 18px; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; font-size:14px; opacity:.9; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .progress { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 14px; }
  .dot { width:34px; height:34px; border-radius:50%; border:2px solid var(--gold); background:#fff; color:var(--wine);
         font-weight:bold; cursor:pointer; }
  .dot.active { background:var(--wine); color:#fff; border-color:var(--wine); }
  .dot.done { background:var(--okbg); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .card h2 { margin:0 0 4px; color:var(--wine); font-size:20px; }
  .instr { margin:0 0 14px; color:var(--muted); }
  .item { border-top:1px solid var(--line); padding:12px 0; }
  .item:first-of-type { border-top:none; }
  .q { font-weight:bold; margin-bottom:8px; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  .opt { border:2px solid var(--line); background:#fff; border-radius:20px; padding:7px 14px; cursor:pointer; font-size:15px; }
  .opt.sel { border-color:var(--wine); background:var(--soft); }
  .item.correct .opt.sel, .item.correct .answerline { border-color:var(--ok); background:var(--okbg); }
  .item.wrong .opt.sel, .item.wrong .answerline { border-color:var(--bad); background:var(--badbg); }
  .fb { margin-top:6px; font-size:14px; min-height:18px; }
  .item.correct .fb { color:var(--ok); } .item.wrong .fb { color:var(--bad); }
  .hint { display:none; margin-top:6px; font-size:14px; color:var(--wine); background:var(--soft); padding:6px 10px; border-radius:8px; }
  .showhints .hint { display:block; }
  .tiles { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .tile { border:1px solid var(--gold); background:#FBF3E4; border-radius:6px; padding:6px 10px; cursor:pointer; font-size:15px; }
  .tile.used { visibility:hidden; }
  .answerline { min-height:40px; border:2px dashed var(--line); border-radius:8px; padding:6px; display:flex; flex-wrap:wrap; gap:6px; }
  .answerline .tile { background:#fff; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  button.ctl { font-family:inherit; font-size:15px; border-radius:8px; padding:9px 14px; cursor:pointer; border:2px solid var(--wine); background:#fff; color:var(--wine); }
  button.ctl.primary { background:var(--wine); color:#fff; }
  .score { margin-top:10px; font-weight:bold; color:var(--wine); min-height:20px; }
  .nav { display:flex; justify-content:space-between; margin-top:14px; }
  .plan { display:grid; gap:6px; margin:6px 0 14px; font-size:13px; }
  .floor { display:grid; grid-template-columns:110px repeat(4, 1fr) 70px 70px; gap:4px; align-items:stretch; }
  .floor div { border:1px solid var(--wine); border-radius:6px; padding:6px 4px; text-align:center; background:#fff; }
  .floor .lab { border:none; background:none; color:var(--wine); font-weight:bold; text-align:left; }
  .floor .empty { border:none; background:none; }
  table.sum { width:100%; border-collapse:collapse; margin-top:10px; }
  table.sum td, table.sum th { border-bottom:1px solid var(--line); padding:8px; text-align:left; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:18px; }
</style>
</head>
<body>
<header>
  <h1>Smart Moves · Practice</h1>
  <p>Level 3 · Unit 3 — places, routes, advice and directions</p>
</header>
<main>
  <div class="progress" id="progress"></div>
  <div class="card" id="stage"></div>
  <div class="nav">
    <button class="ctl" id="back">← Back</button>
    <button class="ctl primary" id="next">Next →</button>
  </div>
</main>
<footer>Irvin Romo · English Teacher</footer>
<script>
const ACTIVITIES = [
 {id:'L3U03-APP-A01', targets:'VOCAB-L3-U03-L1-*', title:'City features', instr:'Read the meaning. Choose the word.', type:'mcq', items:[

  ['a structure that goes over a river or road', ['bridge','tunnel','sidewalk','highway'], 'bridge', 'You cross the river on it.'],

  ['a place where people park cars and motorcycles', ['parking lot','fire station','sidewalk','terminal'], 'parking lot', 'Where do you leave your motorcycle?'],
  ['the path next to a street where people walk', ['sidewalk','highway','bridge','line'], 'sidewalk', 'People walk on it, not cars.'],
  ['the building where officials from another country work', ['embassy','clinic','monument','hostel'], 'embassy', 'You go there when you lose your passport abroad.'],
  ['the building where fire engines and firefighters wait', ['fire station','embassy','terminal','clinic'], 'fire station', 'Think of fire.'],
  ['a structure that helps people remember a person or event', ['monument','sculpture','bridge','embassy'], 'monument', 'The Angel of Independence is one.'],
  ['art made from stone, wood, metal or clay', ['sculpture','monument','hostel','ferry'], 'sculpture', 'You can see it in a museum or a park.']]},
 {id:'L3U03-APP-A02', targets:'VOCAB-L3-U03-L2-*', title:'Planning a trip', instr:'Complete the sentence. Choose the word.', type:'mcq', items:[
  ['I want to ___ a seat on the 6:00 bus.', ['book','fare','line','direct'], 'book', 'A verb: to arrange a seat for the future.'],
  ['We have a ___ for a table at the restaurant at 8 p.m.', ['reservation','schedule','terminal','route'], 'reservation', 'An arrangement for a table or a room.'],
  ['The bus ___ is $12. You pay the driver.', ['fare','arrival','line','route'], 'fare', 'The money you pay to travel.'],

 {id:'L3U03-APP-A03', targets:'GRAM-L3-U03-L1-articles', title:'a, an, the or –', instr:'Choose the correct word. Choose – for no article.', type:'mcq', items:[
  ['There\'s ___ parking lot behind the kitchen.', ['a','an','the','–'], 'a', 'First time you mention it.'],
  ['___ parking lot is full after 7 p.m.', ['The','A','An','–'], 'The', 'Second time: we both know which one.'],

  ['Is there ___ embassy on this street?', ['an','a','the','–'], 'an', 'Embassy starts with a vowel sound.'],
  ['It\'s ___ biggest monument in the city.', ['the','a','an','–'], 'the', 'Superlatives use the.'],
  ['The festival is in ___ Mexico City.', ['–','the','a','an'], '–', 'Most city names have no article.'],
  ['Take ___ first bus in the morning.', ['the','a','an','–'], 'the', 'Ordinals (first, second) use the.'],
  ['She is ___ engineer.', ['an','a','the','–'], 'an', 'Jobs use a/an. Engineer starts with a vowel sound.']]},
 {id:'L3U03-APP-A04', targets:'GRAM-L3-U03-L2-modals-for-advice', title:'Advice: should, could, I\'d', instr:'Choose the best answer.', type:'mcq', items:[
  ['Good idea: You ___ take the subway. It\'s faster.', ['should','shouldn\'t','could not','would'], 'should', 'Should = a good idea.'],

  ['Your opinion: ___ take a taxi with a big suitcase.', ['I\'d','You\'d','She\'d','They\'d'], 'I\'d', 'For advice, use would only with I.'],
  ['Which sentence is correct advice?', ['I wouldn\'t take the bus.','You wouldn\'t take the bus.','He wouldn\'t take the bus.','They wouldn\'t take the bus.'], 'I wouldn\'t take the bus.', 'Advice with would: only I would / I wouldn\'t.'],
  ['A: Should I take Line 2?  B: ...', ['Yes, you should.','Yes, you should take.','Yes, I should.','Yes, should you.'], 'Yes, you should.', 'Short answer: Yes, you should. / No, you shouldn\'t.']]},

  [['take','What','I','should','?'], 'What should I take ?', 'Question word + should + I + verb.'],
  [['get','How','there','I','do','?'], 'How do I get there ?', 'Question word + do + I + verb.'],
  [['park','should','Where','my motorcycle','I','?'], 'Where should I park my motorcycle ?', 'Where + should + I ...'],
  [['line','should','Which','take','I','?'], 'Which line should I take ?', 'Which line + should + I ...'],
  [['special','Why','the spot','is','?'], 'Why is the spot special ?', 'Question word + is + the spot ... (like: Why is she serious?)'],

 {id:'L3U03-APP-A06', targets:'VOCAB-L3-U03-L3-*', title:'Where do you arrive?', instr:'You start at the entrance of the restaurant. Read the directions. Choose the room.', type:'mcq', plan:true, items:[
  ['Go through the lobby and go down the hallway. It\'s the first door on your right.', ['kitchen','restroom','office','storage room'], 'kitchen', 'The first room after the lobby.'],
  ['Go down the hallway. It\'s at the end, on your right, before the stairs.', ['restroom','dining room','kitchen','staff room'], 'restroom', 'The last room on the ground floor.'],
  ['Take the elevator upstairs to the second floor. It\'s the first room.', ['office','staff room','kitchen','cold room'], 'office', 'Upstairs, first room.'],
  ['It\'s downstairs in the basement, next to the cold room.', ['storage room','dining room','office','restroom'], 'storage room', 'Downstairs = the basement.'],
  ['It\'s upstairs on the second floor, next to the office.', ['staff room','kitchen','storage room','dining room'], 'staff room', 'Second floor, second room.']]},
 {id:'L3U03-APP-A07', targets:'VOCAB-L3-U03-L3-can-you-tell-me-how-to-get-to', title:'Polite questions', instr:'Choose the polite question with the correct word order.', type:'mcq', items:[
  ['Where is the kitchen? (make it polite)', ['Can you tell me where the kitchen is?','Can you tell me where is the kitchen?','Can you tell me the kitchen where is?'], 'Can you tell me where the kitchen is?', 'After Can you tell me: where + the kitchen + is.'],
  ['Which floor is the office on? (make it polite)', ['Do you know which floor the office is on?','Do you know which floor is the office on?','Do you know the office which floor is on?'], 'Do you know which floor the office is on?', 'After Do you know: statement order.'],
  ['How do I get to the restroom? (make it polite)', ['Can you tell me how to get to the restroom?','Can you tell me how get to the restroom?','Can you tell me how to getting to the restroom?'], 'Can you tell me how to get to the restroom?', 'how to get to ...'],
  ['Where are the stairs? (make it polite)', ['Do you know where the stairs are?','Do you know where are the stairs?','Do you know where the stairs?'], 'Do you know where the stairs are?', 'where + the stairs + are.'],
  ['When does the bus leave? (make it polite)', ['Can you tell me when the bus leaves?','Can you tell me when does the bus leave?','Can you tell me when the bus does leave?'], 'Can you tell me when the bus leaves?', 'No does in the polite question: when the bus leaves.']]},
 {id:'L3U03-APP-A08', targets:'VOCAB-L3-U03-L3-repeating-details-to-show-you-understand', title:'Check that you understand', instr:'Someone gives you directions. Choose the best reply.', type:'mcq', items:[
  ['"It\'s upstairs, on the fifth floor."', ['The fifth floor? OK, thanks.','Fifth is upstairs good.','I go to five.'], 'The fifth floor? OK, thanks.', 'Repeat the key detail as a question.'],
  ['"The bus stops across the street."', ['Across the street? Great.','The street is across.','Bus? Street.'], 'Across the street? Great.', 'Repeat where.'],
  ['"Go down that hallway, and it\'s on your left."', ['On my left? Thanks.','Left is the hallway.','Go left, you.'], 'On my left? Thanks.', 'Repeat the detail with my: on my left.'],
  ['You have another question. What do you say?', ['Sorry, one more question. Which way is the elevator?','One more question sorry, elevator is?','Question: elevator where is?'], 'Sorry, one more question. Which way is the elevator?', 'Sorry, one more question + a polite question.']]},
 {id:'L3U03-APP-A09', targets:'L4 writing skills (Student\'s Book 3.4)', title:'Check the personal statement', instr:'Choose the sentence with no mistakes.', type:'mcq', items:[
  ['Job titles', ['I think I would be an excellent City Guide.','I think I would be an excellent city guide.'], 'I think I would be an excellent City Guide.', 'Job titles use capital letters.'],
  ['because', ['I know the streets well because I ride a motorcycle.','I know the streets well, because I ride a motorcycle.'], 'I know the streets well because I ride a motorcycle.', 'No comma before because.'],
  ['so', ['I work with a team in a restaurant, so I am good with people.','I work with a team in a restaurant so I am good with people.'], 'I work with a team in a restaurant, so I am good with people.', 'Use a comma before so.'],
  ['Experiences', ['I\'ve never worked at a festival before, but I\'m excited to try.','I never worked at a festival before, but I\'m excited to try.'], 'I\'ve never worked at a festival before, but I\'m excited to try.', 'Use the present perfect for experiences up to now.'],
  ['Months', ['The festival is from July 25th to the 27th.','The festival is from july 25th to the 27th.'], 'The festival is from July 25th to the 27th.', 'Months use capital letters.'],
  ['Be clear', ['The volunteer job of City Guide is perfect for me.','The volunteer job is perfect for me.'], 'The volunteer job of City Guide is perfect for me.', 'Repeat the job title to be clear.']]},
 {id:'L3U03-APP-A10', targets:'L3-U03 mixed review', title:'Unit review', instr:'Mixed questions from the whole unit.', type:'mcq', items:[
  ['People walk on it next to the street.', ['sidewalk','highway','terminal','fare'], 'sidewalk', 'Lesson 1 word.'],
  ['You pay it on the bus.', ['fare','route','line','arrival'], 'fare', 'Lesson 2 word.'],
  ['___ first ferry leaves at 7:00.', ['The','A','An','–'], 'The', 'Ordinals use the.'],
  ['Good idea: You ___ go early, before the traffic.', ['should','shouldn\'t','\'d','would'], 'should', 'Should = good idea.'],
  ['Choose the correct question.', ['Where should I park?','Where I should park?','Where should park I?'], 'Where should I park?', 'Where + should + I.'],
  ['Choose the polite question.', ['Do you know which floor the café is on?','Do you know which floor is the café on?','Do you know the café which floor?'], 'Do you know which floor the café is on?', 'Statement order after Do you know.'],
  ['It\'s downstairs, ___ the basement.', ['in','on','at','to'], 'in', 'in the basement / on the fifth floor.'],
  ['The best last sentence for a personal statement:', ['For these reasons, I think I would be an excellent City Guide.','For these reasons, I think I would be excellent at this job.'], 'For these reasons, I think I would be an excellent City Guide.', 'Repeat the job title.']]}
];

// deterministic shuffle so the correct option is not always first
function seeded(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%1000)/1000; }; }
function shuffle(arr, key){ const r=seeded(key), a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const state = ACTIVITIES.map(a => ({answers:a.items.map(()=>a.type==='order'?[]:null), checked:false, score:null, hints:false}));
let current = 0, finished = false;
const stage = document.getElementById('stage');

function planHTML(){
  const f=(label, rooms)=>`<div class="floor"><div class="lab">${label}</div>${rooms.map(r=>r?`<div>${r}</div>`:'<div class="empty"></div>').join('')}<div>stairs</div><div>elevator</div></div>`;
  return `<div class="plan" aria-label="Restaurant floor plan">${f('Second floor',['office','staff room','',''])}${f('Ground floor',['entrance + lobby','kitchen','dining room','restroom'])}${f('Basement',['storage room','cold room','',''])}<div style="color:var(--muted)">On the ground floor, the hallway goes from the lobby to the stairs. The rooms are on your right.</div></div>`;
}

function render(){
  renderProgress();
  if(finished){ return renderSummary(); }
  const a=ACTIVITIES[current], s=state[current];
  let html=`<h2>${current+1}. ${a.title}</h2><p class="instr">${a.instr}</p>${a.plan?planHTML():''}<div class="items ${s.hints?'showhints':''}" data-activity="${a.id}" data-targets="${a.targets}">`;
  a.items.forEach((it,i)=>{
    if(a.type==='mcq'){
      const opts=shuffle(it[1], a.id+i);
      html+=`<div class="item" data-i="${i}"><div class="q">${i+1}. ${it[0]}</div><div class="opts">${opts.map(o=>`<button class="opt${s.answers[i]===o?' sel':''}" data-v="${encodeURIComponent(o)}">${o}</button>`).join('')}</div><div class="hint">Hint: ${it[3]}</div><div class="fb"></div></div>`;
    } else {
      const tiles=shuffle(it[0], a.id+i), used=s.answers[i];
      html+=`<div class="item" data-i="${i}"><div class="q">${i+1}.</div><div class="tiles">${tiles.map((w,k)=>`<button class="tile${used.includes(k)?' used':''}" data-k="${k}">${w}</button>`).join('')}</div><div class="answerline">${used.map(k=>`<button class="tile placed" data-k="${k}">${tiles[k]}</button>`).join('')}</div><div class="hint">Hint: ${it[2]}</div><div class="fb"></div></div>`;
    }
  });
  html+=`</div><div class="controls"><button class="ctl" id="hint">Hint</button><button class="ctl primary" id="check">Check</button><button class="ctl" id="show">Show answers</button><button class="ctl" id="retry">Try again</button></div><div class="score" id="score">${s.score!==null?scoreText(s.score,a.items.length):''}</div>`;
  stage.innerHTML=html;
  if(s.checked) paintCheck(false);
  bind();
  document.getElementById('back').disabled = current===0;
  document.getElementById('next').textContent = current===ACTIVITIES.length-1 ? 'Finish ✓' : 'Next →';
}

function renderProgress(){
  const p=document.getElementById('progress');
  p.innerHTML=ACTIVITIES.map((a,i)=>`<button class="dot${i===current&&!finished?' active':''}${state[i].checked?' done':''}" data-go="${i}" title="${a.title}">${i+1}</button>`).join('');
  p.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{ finished=false; current=+d.dataset.go; render(); });
}

function tilesFor(i){ const a=ACTIVITIES[current]; return shuffle(a.items[i][0], a.id+i); }

function bind(){
  const a=ACTIVITIES[current], s=state[current];
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const i=+b.closest('.item').dataset.i; s.answers[i]=decodeURIComponent(b.dataset.v); s.checked=false; s.score=null; render(); });
  stage.querySelectorAll('.tiles .tile').forEach(b=>b.onclick=()=>{ const i=+b.closest('.item').dataset.i, k=+b.dataset.k; if(!s.answers[i].includes(k)) s.answers[i].push(k); s.checked=false; s.score=null; render(); });
  stage.querySelectorAll('.answerline .tile').forEach(b=>b.onclick=()=>{ const i=+b.closest('.item').dataset.i, k=+b.dataset.k; s.answers[i]=s.answers[i].filter(x=>x!==k); s.checked=false; s.score=null; render(); });
  document.getElementById('hint').onclick=()=>{ s.hints=!s.hints; render(); };
  document.getElementById('check').onclick=()=>{ s.checked=true; s.score=countCorrect(); render(); };
  document.getElementById('show').onclick=()=>{ showAnswers(); s.checked=true; s.score=countCorrect(); s.revealed=true; render(); };
  document.getElementById('retry').onclick=()=>{ state[current]={answers:a.items.map(()=>a.type==='order'?[]:null), checked:false, score:null, hints:false}; render(); };
}

function isCorrect(i){
  const a=ACTIVITIES[current], s=state[current], it=a.items[i];
  if(a.type==='mcq') return s.answers[i]===it[2];
  const tiles=tilesFor(i); return s.answers[i].map(k=>tiles[k]).join(' ')===it[1];
}
function countCorrect(){ return ACTIVITIES[current].items.reduce((n,_,i)=>n+(isCorrect(i)?1:0),0); }
function scoreText(n,t){ return `Score: ${n} / ${t}` + (n===t?' — excellent!':''); }

function paintCheck(){
  const a=ACTIVITIES[current], s=state[current];
  stage.querySelectorAll('.item').forEach(el=>{
    const i=+el.dataset.i, ok=isCorrect(i), empty=a.type==='mcq'?s.answers[i]===null:s.answers[i].length===0;
    el.classList.add(ok?'correct':'wrong');
    const right=a.type==='mcq'?a.items[i][2]:a.items[i][1].replace(' ?','?');
    el.querySelector('.fb').textContent = ok ? 'Correct!' : (empty ? 'Choose an answer. ' : 'Not yet. ') + (s.revealed ? 'Answer: '+right : 'Try the hint.');
  });
}

function showAnswers(){
  const a=ACTIVITIES[current], s=state[current];
  a.items.forEach((it,i)=>{
    if(a.type==='mcq') s.answers[i]=it[2];
    else { s.answers[i]=tileOrder(tilesFor(i), it[1]); }
  });
}

// Tile indexes that spell the answer; tiles can hold more than one word ("my motorcycle").
function tileOrder(tiles, answer){
  const taken=[]; let rest=answer;
  while(rest.length){
    const k=tiles.map((t,idx)=>idx).filter(idx=>!taken.includes(idx)&&(rest===tiles[idx]||rest.startsWith(tiles[idx]+' ')))
                 .sort((x,y)=>tiles[y].length-tiles[x].length)[0];
    if(k===undefined) break;
    taken.push(k); rest=rest.slice(tiles[k].length).trimStart();
  }
  return taken;
}

function renderSummary(){
  const total=ACTIVITIES.reduce((n,a)=>n+a.items.length,0);
  const got=state.reduce((n,s)=>n+(s.score||0),0);
  stage.innerHTML=`<h2>Well done!</h2><p class="instr">Here is your score for each activity. Choose an activity to practice again.</p>
   <table class="sum"><tr><th>Activity</th><th>Score</th></tr>${ACTIVITIES.map((a,i)=>`<tr><td>${i+1}. ${a.title}</td><td>${state[i].score===null?'not checked':state[i].score+' / '+a.items.length}</td></tr>`).join('')}
   <tr><th>Total</th><th id="total">${got} / ${total}</th></tr></table>
   <div class="controls"><button class="ctl primary" id="restart">Start again</button></div>`;
  document.getElementById('restart').onclick=()=>{ ACTIVITIES.forEach((a,i)=>state[i]={answers:a.items.map(()=>a.type==='order'?[]:null), checked:false, score:null, hints:false}); finished=false; current=0; render(); };
  document.getElementById('back').disabled=false;
  document.getElementById('next').textContent='Finish ✓';
}

document.getElementById('back').onclick=()=>{ if(finished){ finished=false; } else if(current>0){ current--; } render(); };
document.getElementById('next').onclick=()=>{ if(current<ACTIVITIES.length-1 && !finished){ current++; } else { finished=true; } render(); };
render();
</script>
</body>
</html>
