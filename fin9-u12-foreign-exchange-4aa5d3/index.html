<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreign Exchange · Practice</title>
<style>
  :root { --wine:#722F37; --gold:#C5A059; --bg:#FFFAF0; --card:#FFFFFF; --soft:#F6ECE4; --text:#1A1A1A; --muted:#555555;
          --ok:#2D7A4A; --okbg:#E3F1E8; --bad:#B04545; --badbg:#F8E5E5; --line:#EADFC8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--wine); color:#fff; padding:14px 18px; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; font-size:14px; opacity:.9; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .progress { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 14px; }
  .dot { width:34px; height:34px; border-radius:50%; border:2px solid var(--gold); background:#fff; color:var(--wine);
         font-weight:bold; cursor:pointer; }
  .dot.active { background:var(--wine); color:#fff; border-color:var(--wine); }
  .dot.done { background:var(--okbg); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .card h2 { margin:0 0 4px; color:var(--wine); font-size:20px; }
  .instr { margin:0 0 14px; color:var(--muted); }
  .item { border-top:1px solid var(--line); padding:12px 0; }
  .item:first-of-type { border-top:none; }
  .q { font-weight:bold; margin-bottom:8px; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  .opt { border:2px solid var(--line); background:#fff; border-radius:20px; padding:7px 14px; cursor:pointer; font-size:15px; }
  .opt.sel { border-color:var(--wine); background:var(--soft); }
  .item.correct .opt.sel, .item.correct .answerline { border-color:var(--ok); background:var(--okbg); }
  .item.wrong .opt.sel, .item.wrong .answerline { border-color:var(--bad); background:var(--badbg); }
  .fb { margin-top:6px; font-size:14px; min-height:18px; }
  .item.correct .fb { color:var(--ok); } .item.wrong .fb { color:var(--bad); }
  .hint { display:none; margin-top:6px; font-size:14px; color:var(--wine); background:var(--soft); padding:6px 10px; border-radius:8px; }
  .showhints .hint { display:block; }
  .tiles { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .tile { border:1px solid var(--gold); background:#FBF3E4; border-radius:6px; padding:6px 10px; cursor:pointer; font-size:15px; }
  .tile.used { visibility:hidden; }
  .answerline { min-height:40px; border:2px dashed var(--line); border-radius:8px; padding:6px; display:flex; flex-wrap:wrap; gap:6px; }
  .answerline .tile { background:#fff; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  button.ctl { font-family:inherit; font-size:15px; border-radius:8px; padding:9px 14px; cursor:pointer; border:2px solid var(--wine); background:#fff; color:var(--wine); }
  button.ctl.primary { background:var(--wine); color:#fff; }
  .score { margin-top:10px; font-weight:bold; color:var(--wine); min-height:20px; }
  .nav { display:flex; justify-content:space-between; margin-top:14px; }
  .plan { display:grid; gap:6px; margin:6px 0 14px; font-size:13px; }
  .floor { display:grid; grid-template-columns:110px repeat(4, 1fr) 70px 70px; gap:4px; align-items:stretch; }
  .floor div { border:1px solid var(--wine); border-radius:6px; padding:6px 4px; text-align:center; background:#fff; }
  .floor .lab { border:none; background:none; color:var(--wine); font-weight:bold; text-align:left; }
  .floor .empty { border:none; background:none; }
  table.sum { width:100%; border-collapse:collapse; margin-top:10px; }
  table.sum td, table.sum th { border-bottom:1px solid var(--line); padding:8px; text-align:left; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:18px; }
</style>
</head>
<body>
<header>
  <h1>Foreign Exchange · Practice</h1>
  <p>Finance English 9 · Unit 12 — FX risk, hedging, passive for markets, predictions</p>
</header>
<main>
  <div class="progress" id="progress"></div>
  <div class="card" id="stage"></div>
  <div class="nav">
    <button class="ctl" id="back">← Back</button>
    <button class="ctl primary" id="next">Next →</button>
  </div>
</main>
<footer>Irvin Romo · English Teacher</footer>
<script>
const ACTIVITIES = [
 {
  "id": "FIN9U12-APP-A01",
  "title": "FX basics",
  "instr": "Read the definition. Choose the term.",
  "type": "mcq",
  "items": [
   [
    "the exchange rate for exchanging currency right now, today",
    [
     "spot rate",
     "forward rate",
     "hedge ratio"
    ],
    "spot rate",
    "Today's price at the counter."
   ],
   [
    "the risk that a change in exchange rates changes how much you receive or pay",
    [
     "currency risk",
     "credit risk",
     "interest"
    ],
    "currency risk",
    "Also called FX risk or FX exposure."
   ],
   [
    "when a currency becomes worth MORE",
    [
     "appreciation",
     "depreciation",
     "inflation"
    ],
    "appreciation",
    "Each dollar buys fewer pesos if the peso appreciates."
   ],
   [
    "when a currency becomes worth LESS",
    [
     "depreciation",
     "appreciation",
     "deflation"
    ],
    "depreciation",
    "Each dollar buys more pesos if the peso depreciates."
   ],
   [
    "If the peso appreciates against the dollar, each dollar buys ___ pesos.",
    [
     "fewer",
     "more",
     "the same"
    ],
    "fewer",
    "The peso is stronger."
   ]
  ]
 },
 {
  "id": "FIN9U12-APP-A02",
  "title": "Protecting the business",
  "instr": "Read the definition. Choose the hedging tool.",
  "type": "mcq",
  "items": [
   [
    "an agreement to exchange currency at a rate fixed today, for a future date",
    [
     "forward contract",
     "currency option",
     "natural hedge"
    ],
    "forward contract",
    "Lock in today's rate."
   ],
   [
    "the right, but not the obligation, to exchange currency at a set rate, for a fee",
    [
     "currency option",
     "forward contract",
     "spot rate"
    ],
    "currency option",
    "Like insurance: you pay a premium."
   ],
   [
    "matching income and costs in the same currency, with no contract",
    [
     "natural hedge",
     "forward contract",
     "currency option"
    ],
    "natural hedge",
    "Nothing needs converting."
   ],
   [
    "the share of an exposure that is protected",
    [
     "hedge ratio",
     "spot rate",
     "multiplier"
    ],
    "hedge ratio",
    "e.g. 50% of the expected payments."
   ],
   [
    "Which tool keeps the benefit if the rate moves in your favour?",
    [
     "currency option",
     "forward contract",
     "neither"
    ],
    "currency option",
    "A right, not an obligation."
   ]
  ]
 },
 {
  "id": "FIN9U12-APP-A03",
  "title": "Passive: FX market events",
  "instr": "Choose the passive sentence.",
  "type": "mcq",
  "items": [
   [
    "The central bank raised the policy rate at yesterday's meeting.",
    [
     "The policy rate was raised at yesterday's meeting.",
     "The policy rate raised at yesterday's meeting.",
     "The policy rate was raise at yesterday's meeting."
    ],
    "The policy rate was raised at yesterday's meeting.",
    "was + past participle."
   ],
   [
    "Investors sold the peso after weak growth data.",
    [
     "The peso was sold off after weak growth data.",
     "The peso sold off after weak growth data.",
     "The peso was sell off after weak growth data."
    ],
    "The peso was sold off after weak growth data.",
    "sell off → was sold off."
   ],
   [
    "Strong capital inflows have supported the peso this year.",
    [
     "The peso has been supported by strong capital inflows this year.",
     "The peso has supported strong capital inflows this year.",
     "The peso was been supported this year."
    ],
    "The peso has been supported by strong capital inflows this year.",
    "has been + past participle."
   ],
   [
    "The central bank intervened to defend the exchange rate.",
    [
     "The exchange rate was defended through central bank intervention.",
     "The exchange rate defended the central bank.",
     "The exchange rate was defend by intervention."
    ],
    "The exchange rate was defended through central bank intervention.",
    "Focus on the exchange rate."
   ],
   [
    "Risk-off sentiment drove demand for dollars.",
    [
     "Demand for dollars was driven by risk-off sentiment.",
     "Demand for dollars drove risk-off sentiment.",
     "Demand for dollars was drove by risk-off sentiment."
    ],
    "Demand for dollars was driven by risk-off sentiment.",
    "drive → driven."
   ]
  ]
 },
 {
  "id": "FIN9U12-APP-A04",
  "title": "How confident is the prediction?",
  "instr": "Choose the future form for the confidence level.",
  "type": "mcq",
  "items": [
   [
    "Firm, confident prediction: USD/MXN ___ stay range-bound this quarter.",
    [
     "will likely",
     "might",
     "is expected to"
    ],
    "will likely",
    "will = firm prediction."
   ],
   [
    "Evidence-based: With rates already rising, the dollar ___ strengthen.",
    [
     "is going to",
     "might",
     "may not"
    ],
    "is going to",
    "going to = evidence now."
   ],
   [
    "Genuinely uncertain: The peso ___ strengthen if investment keeps growing.",
    [
     "might",
     "will",
     "is going to"
    ],
    "might",
    "might / may = uncertain."
   ],
   [
    "Consensus view: The dollar ___ soften next year.",
    [
     "is expected to",
     "might",
     "is going to"
    ],
    "is expected to",
    "What most analysts think."
   ],
   [
    "Moderate confidence: Volatility ___ stay high until after the election.",
    [
     "is likely to",
     "will definitely",
     "might not"
    ],
    "is likely to",
    "Probable, not certain."
   ]
  ]
 },
 {
  "id": "FIN9U12-APP-A05",
  "title": "Build the briefing sentence",
  "instr": "Tap the parts in the right order. Tap a part again to remove it.",
  "type": "order",
  "items": [
   [
    [
     "A forward contract",
     "locks in",
     "today's rate"
    ],
    "A forward contract locks in today's rate",
    "Explain the tool simply."
   ],
   [
    [
     "The peso",
     "was sold off",
     "after the data"
    ],
    "The peso was sold off after the data",
    "Passive for a market event."
   ],
   [
    [
     "The dollar",
     "is expected to",
     "soften next year"
    ],
    "The dollar is expected to soften next year",
    "Consensus view."
   ]
  ]
 }
];

// deterministic shuffle so the correct option is not always first
function seeded(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%1000)/1000; }; }
function shuffle(arr, key){ const r=seeded(key), a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const state = ACTIVITIES.map(a => ({answers:a.items.map(()=>a.type==='order'?[]:null), checked:false, score:null, hints:false}));
let current = 0, finished = false;
const stage = document.getElementById('stage');

function planHTML(){
  const f=(label, rooms)=>`<div class="floor"><div class="lab">${label}</div>${rooms.map(r=>r?`<div>${r}</div>`:'<div class="empty"></div>').join('')}<div>stairs</div><div>elevator</div></div>`;
  return `<div class="plan" aria-label="Restaurant floor plan">${f('Second floor',['office','staff room','',''])}${f('Ground floor',['entrance + lobby','kitchen','dining room','restroom'])}${f('Basement',['storage room','cold room','',''])}<div style="color:var(--muted)">On the ground floor, the hallway goes from the lobby to the stairs. The rooms are on your right.</div></div>`;
}

function render(){
  renderProgress();
  if(finished){ return renderSummary(); }
  const a=ACTIVITIES[current], s=state[current];
  let html=`<h2>${current+1}. ${a.title}</h2><p class="instr">${a.instr}</p>${a.plan?planHTML():''}<div class="items ${s.hints?'showhints':''}" data-activity="${a.id}" data-targets="${a.targets}">`;
  a.items.forEach((it,i)=>{
    if(a.type==='mcq'){
      const opts=shuffle(it[1], a.id+i);
      html+=`<div class="item" data-i="${i}"><div class="q">${i+1}. ${it[0]}</div><div class="opts">${opts.map(o=>`<button class="opt${s.answers[i]===o?' sel':''}" data-v="${encodeURIComponent(o)}">${o}</button>`).join('')}</div><div class="hint">Hint: ${it[3]}</div><div class="fb"></div></div>`;
    } else {
      const tiles=shuffle(it[0], a.id+i), used=s.answers[i];
      html+=`<div class="item" data-i="${i}"><div class="q">${i+1}.</div><div class="tiles">${tiles.map((w,k)=>`<button class="tile${used.includes(k)?' used':''}" data-k="${k}">${w}</button>`).join('')}</div><div class="answerline">${used.map(k=>`<button class="tile placed" data-k="${k}">${tiles[k]}</button>`).join('')}</div><div class="hint">Hint: ${it[2]}</div><div class="fb"></div></div>`;
    }
  });
  html+=`</div><div class="controls"><button class="ctl" id="hint">Hint</button><button class="ctl primary" id="check">Check</button><button class="ctl" id="show">Show answers</button><button class="ctl" id="retry">Try again</button></div><div class="score" id="score">${s.score!==null?scoreText(s.score,a.items.length):''}</div>`;
  stage.innerHTML=html;
  if(s.checked) paintCheck(false);
  bind();
  document.getElementById('back').disabled = current===0;
  document.getElementById('next').textContent = current===ACTIVITIES.length-1 ? 'Finish ✓' : 'Next →';
}

function renderProgress(){
  const p=document.getElementById('progress');
  p.innerHTML=ACTIVITIES.map((a,i)=>`<button class="dot${i===current&&!finished?' active':''}${state[i].checked?' done':''}" data-go="${i}" title="${a.title}">${i+1}</button>`).join('');
  p.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{ finished=false; current=+d.dataset.go; render(); });
}

function tilesFor(i){ const a=ACTIVITIES[current]; return shuffle(a.items[i][0], a.id+i); }

function bind(){
  const a=ACTIVITIES[current], s=state[current];
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const i=+b.closest('.item').dataset.i; s.answers[i]=decodeURIComponent(b.dataset.v); s.checked=false; s.score=null; render(); });
  stage.querySelectorAll('.tiles .tile').forEach(b=>b.onclick=()=>{ const i=+b.closest('.item').dataset.i, k=+b.dataset.k; if(!s.answers[i].includes(k)) s.answers[i].push(k); s.checked=false; s.score=null; render(); });
  stage.querySelectorAll('.answerline .tile').forEach(b=>b.onclick=()=>{ const i=+b.closest('.item').dataset.i, k=+b.dataset.k; s.answers[i]=s.answers[i].filter(x=>x!==k); s.checked=false; s.score=null; render(); });
  document.getElementById('hint').onclick=()=>{ s.hints=!s.hints; render(); };
  document.getElementById('check').onclick=()=>{ s.checked=true; s.score=countCorrect(); render(); };
  document.getElementById('show').onclick=()=>{ showAnswers(); s.checked=true; s.score=countCorrect(); s.revealed=true; render(); };
  document.getElementById('retry').onclick=()=>{ state[current]={answers:a.items.map(()=>a.type==='order'?[]:null), checked:false, score:null, hints:false}; render(); };
}

function isCorrect(i){
  const a=ACTIVITIES[current], s=state[current], it=a.items[i];
  if(a.type==='mcq') return s.answers[i]===it[2];
  const tiles=tilesFor(i); return s.answers[i].map(k=>tiles[k]).join(' ')===it[1];
}
function countCorrect(){ return ACTIVITIES[current].items.reduce((n,_,i)=>n+(isCorrect(i)?1:0),0); }
function scoreText(n,t){ return `Score: ${n} / ${t}` + (n===t?' — excellent!':''); }

function paintCheck(){
  const a=ACTIVITIES[current], s=state[current];
  stage.querySelectorAll('.item').forEach(el=>{
    const i=+el.dataset.i, ok=isCorrect(i), empty=a.type==='mcq'?s.answers[i]===null:s.answers[i].length===0;
    el.classList.add(ok?'correct':'wrong');
    const right=a.type==='mcq'?a.items[i][2]:a.items[i][1].replace(' ?','?');
    el.querySelector('.fb').textContent = ok ? 'Correct!' : (empty ? 'Choose an answer. ' : 'Not yet. ') + (s.revealed ? 'Answer: '+right : 'Try the hint.');
  });
}

function showAnswers(){
  const a=ACTIVITIES[current], s=state[current];
  a.items.forEach((it,i)=>{
    if(a.type==='mcq') s.answers[i]=it[2];
    else { s.answers[i]=tileOrder(tilesFor(i), it[1]); }
  });
}

// Tile indexes that spell the answer; tiles can hold more than one word ("my motorcycle").
function tileOrder(tiles, answer){
  const taken=[]; let rest=answer;
  while(rest.length){
    const k=tiles.map((t,idx)=>idx).filter(idx=>!taken.includes(idx)&&(rest===tiles[idx]||rest.startsWith(tiles[idx]+' ')))
                 .sort((x,y)=>tiles[y].length-tiles[x].length)[0];
    if(k===undefined) break;
    taken.push(k); rest=rest.slice(tiles[k].length).trimStart();
  }
  return taken;
}

function renderSummary(){
  const total=ACTIVITIES.reduce((n,a)=>n+a.items.length,0);
  const got=state.reduce((n,s)=>n+(s.score||0),0);
  stage.innerHTML=`<h2>Well done!</h2><p class="instr">Here is your score for each activity. Choose an activity to practice again.</p>
   <table class="sum"><tr><th>Activity</th><th>Score</th></tr>${ACTIVITIES.map((a,i)=>`<tr><td>${i+1}. ${a.title}</td><td>${state[i].score===null?'not checked':state[i].score+' / '+a.items.length}</td></tr>`).join('')}
   <tr><th>Total</th><th id="total">${got} / ${total}</th></tr></table>
   <div class="controls"><button class="ctl primary" id="restart">Start again</button></div>`;
  document.getElementById('restart').onclick=()=>{ ACTIVITIES.forEach((a,i)=>state[i]={answers:a.items.map(()=>a.type==='order'?[]:null), checked:false, score:null, hints:false}); finished=false; current=0; render(); };
  document.getElementById('back').disabled=false;
  document.getElementById('next').textContent='Finish ✓';
}

document.getElementById('back').onclick=()=>{ if(finished){ finished=false; } else if(current>0){ current--; } render(); };
document.getElementById('next').onclick=()=>{ if(current<ACTIVITIES.length-1 && !finished){ current++; } else { finished=true; } render(); };
render();
</script>
</body>
</html>
